<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Förhandsvisning – Live-projektorn (#461)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/styles.css" />
    <style>
      /* Simuleringspanelen ligger ovanpå projektorn (bara i förhandsvisningen). */
      .pv { position: fixed; left: 10px; bottom: 10px; z-index: 100; width: 290px; font: 13px/1.35 system-ui, sans-serif;
        background: rgba(255, 255, 255, 0.96); color: #1b2559; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
      .pv summary { cursor: pointer; padding: 8px 12px; font-weight: 700; }
      .pv-body { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 12px; }
      .pv-body b { width: 100%; margin-top: 6px; }
      .pv button { font: inherit; padding: 4px 8px; border-radius: 8px; border: 1px solid #c5cde0; background: #f3f6fc; cursor: pointer; }
      .pv button:hover { background: #e3e9f7; }
      .pv-note { width: 100%; color: #5a6585; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <details class="pv" open>
      <summary>🧪 Simulering (bara förhandsvisning)</summary>
      <div class="pv-body">
        <span class="pv-note">Allt här är låtsasdata i webbläsaren – ingen Firestore. Vyval, ljud och fullskärm i projektorns
          egen verktygsrad. Tangent 1/2/3 byter vy.</span>
        <b>Scenario</b>
        <button data-go="fas=lobby">Lobby 2 klasser</button>
        <button data-go="fas=lobby&klasser=3">Lobby 3 klasser</button>
        <button data-go="fas=live">Pågår (12:43)</button>
        <button data-go="fas=live&klasser=3">Pågår 3 klasser</button>
        <button data-go="fas=slut">Vinnare</button>
        <button data-go="fas=oavgjort">Oavgjort</button>
        <b>Händelser</b>
        <button data-act="redo">+1 redo/klass</button>
        <button data-act="auto">Auto-svar på/av</button>
        <button data-act="plus0">+15 rätt klass 1</button>
        <button data-act="plus1">+15 rätt klass 2</button>
        <button data-act="snart">Hoppa till 0:08 kvar</button>
      </div>
    </details>

    <script type="module">
      import { mountProjector } from "./src/live/projector.js";
      import {
        phaseAt, sumCounters, classStandings, decideWinner, topPlayers, buildResult, formatClock,
      } from "./src/live/live-core.js";

      const q = new URLSearchParams(location.search);
      const fas = q.get("fas") || "lobby";
      const tre = q.get("klasser") === "3";
      if (q.get("vy")) localStorage.setItem("pp:live:vy", q.get("vy"));

      const NAMN = ["Alma", "Omar", "Ines", "Leo", "Clara", "Sam", "Ella", "Noah", "Maja", "Elias", "Wilma", "Adam",
        "Saga", "Hugo", "Freja", "Liam", "Alva", "Ali", "Signe", "Vera", "Otto", "Nora", "Ebbe", "Selma", "Malte"];
      const KL = [["4b", "4B", 17, 15], ["5e", "5E", 22, 19], ["3a", "3A", 20, 16]].slice(0, tre ? 3 : 2);
      const now = () => Date.now();

      const session = {
        id: "demo", name: KL.map((k) => k[1]).join(" mot "), gameMode: "multiplication_0_10",
        participatingClassIds: KL.map((k) => k[0]), classNames: Object.fromEntries(KL.map((k) => [k[0], k[1]])),
        classDivisors: Object.fromEntries(KL.map((k) => [k[0], k[2]])), durationSeconds: 20 * 60, countdownSeconds: 4,
        counterShards: 10, status: "lobby", createdBy: "rasmus",
      };
      let players = [];
      let nameIx = 0;
      function addPlayer(cid) {
        const p = { uid: `p${players.length}`, classId: cid, name: NAMN[nameIx++ % NAMN.length], lastSeenAt: now(), correct: 0, incorrect: 0 };
        players.push(p);
        return p;
      }
      // Fördela `total` rätt på klassens spelare (deterministiskt, ojämnt).
      function give(cid, total) {
        const mine = players.filter((p) => p.classId === cid);
        let left = total;
        mine.forEach((p, i) => {
          const share = i === mine.length - 1 ? left : Math.min(left, Math.round((total / mine.length) * (1.6 - (i % 5) * 0.25)));
          p.correct += share;
          p.incorrect += i % 4;
          left -= share;
        });
      }

      if (fas === "lobby") KL.forEach(([cid, , , n]) => { for (let i = 0; i < n - 4; i++) addPlayer(cid); });
      else {
        KL.forEach(([cid, , , n]) => { for (let i = 0; i < n; i++) addPlayer(cid); });
        session.status = "live";
        if (fas === "live") {
          session.startedAt = now() - 4000 - (20 * 60 - (12 * 60 + 43)) * 1000 - 500;
          give("4b", 250); give("5e", 290); if (tre) give("3a", 231);
        } else {
          session.status = "finished";
          session.startedAt = now() - 4000 - 20 * 60 * 1000 - 3000;
          session.finishedAt = now() - 1000;
          if (fas === "oavgjort") { give("4b", 340); give("5e", 440); } else { give("4b", 345); give("5e", 433); }
          if (tre) give("3a", 360);
        }
      }

      function compute() {
        const t = now();
        const ph = phaseAt(session, t);
        const counters = players.map((p) => ({ classId: p.classId, correct: p.correct }));
        const classes = classStandings(session, sumCounters(counters), players, session.status === "lobby" ? t : null);
        const w = decideWinner(classes);
        return {
          sessionId: "demo", session: { ...session }, status: session.status, phase: ph.phase, countdown: ph.countdown,
          msLeft: ph.msLeft, clock: formatClock(ph.msLeft), classes, totalCorrect: classes.reduce((n, c) => n + c.correct, 0),
          leaderIds: w.leaderIds, winnerId: w.winnerId, draw: w.draw, top: topPlayers(players, 10),
          result: session.result || null, now: t,
        };
      }

      let cb = null;
      let lastKey = "";
      function emit(force) {
        if (!cb) return;
        const st = compute();
        if (st.phase === "ended" && session.status === "live") {
          setTimeout(() => { if (session.status === "live") { session.status = "finished"; session.finishedAt = now(); emit(true); } }, 900);
        }
        if (st.phase === "finished" && !session.result && !emit.rt) {
          emit.rt = setTimeout(() => { session.result = buildResult(session, compute().classes, players); emit(true); }, 2500);
        }
        const key = JSON.stringify([st.status, st.phase, st.countdown, st.clock, st.classes, st.top, !!st.result, session.classDivisors]);
        if (!force && key === lastKey) return;
        lastKey = key;
        cb(st);
      }
      setInterval(() => emit(false), 250);

      const deps = {
        subscribe(sid, fn) { cb = fn; emit(true); return () => { cb = null; }; },
        now,
        async start() { await new Promise((r) => setTimeout(r, 250)); if (session.status === "lobby") { session.status = "live"; session.startedAt = now(); } emit(true); },
        async finish() { session.status = "finished"; session.finishedAt = now(); emit(true); },
        async setDivisor(sid, cid, n) { session.classDivisors[cid] = Math.max(1, Math.floor(Number(n))); emit(true); },
      };

      const ctx = { app: document.getElementById("app"), go: (h) => console.log("navigera till", h) };
      mountProjector(ctx, "demo", { cleanups: [], uid: "rasmus", deps });

      // --- Simuleringspanelen ---
      let auto = fas === "live" && q.get("auto") !== "av";
      setInterval(() => {
        if (!auto || phaseAt(session, now()).phase !== "live") return;
        const weights = [1.08, 1, 0.95];
        const i = Math.floor(Math.random() * KL.length);
        if (Math.random() > weights[i] * 0.7) return;
        const mine = players.filter((p) => p.classId === KL[i][0]);
        if (!mine.length) return;
        mine[Math.floor(Math.random() * mine.length)].correct += 1 + Math.floor(Math.random() * 2);
        emit(false);
      }, 180);
      document.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => { location.search = b.dataset.go; }));
      document.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => {
        const a = b.dataset.act;
        if (a === "redo") KL.forEach(([cid]) => addPlayer(cid));
        if (a === "auto") auto = !auto;
        if (a.startsWith("plus")) {
          const cid = KL[Number(a.slice(4))][0];
          if (!players.some((p) => p.classId === cid)) addPlayer(cid);
          give(cid, 15);
        }
        if (a === "snart" && session.startedAt) session.startedAt = now() - 4000 - (20 * 60 - 8) * 1000;
        emit(true);
      }));
    </script>
  </body>
</html>
