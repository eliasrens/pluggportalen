<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Förhandsvisning – Live: Quiz från Plugga (#553)</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <link rel="stylesheet" href="./src/live/live.css" />
    <link rel="stylesheet" href="./src/mult/fast-answer.css" />
    <style>
      /* Lärarens områdesval (riktiga plugga-quiz-picker.js, seed-innehåll i
         stället för Firestore) → ögonblicksbilden (elevsynligt + facit) →
         elevens flervalsknappar med samma frågor. */
      body { margin: 0; background: var(--ljus); }
      .pv { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 14px; }
      .pv section { background: #fff; border-radius: 12px; padding: 14px 16px; box-shadow: var(--skugga-mjuk); }
      .pv h2 { margin: 0 0 8px; font-size: 1.05rem; }
      .pv-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 8px 0; font-size: 14px; }
      .pv-json { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .pv-json pre { margin: 0; max-height: 260px; overflow: auto; font-size: 11px; background: #f6f7fb;
        padding: 8px; border-radius: 8px; white-space: pre-wrap; }
      .pv-play { grid-column: 1 / -1; height: 440px; display: flex; flex-direction: column; }
      #pv-elev { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
      .pv-err { color: #c0392b; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="pv">
      <section>
        <h2>📚 Lärarens val – Quiz från Plugga</h2>
        <div class="pv-row">
          <b>Format:</b>
          <label><input type="radio" name="fmt" value="snille" checked /> ⚡ Snilleblixten (minst 5)</label>
          <label><input type="radio" name="fmt" value="rush" /> 💰 Guldrushen (minst 8)</label>
        </div>
        <div class="field" data-field="quizArea"><label>Ämne och arbetsområde</label><div class="live-setup-custom"></div></div>
        <div class="pv-row">
          <b>Antal frågor:</b>
          <select id="pv-count"><option>5</option><option selected>10</option><option>15</option><option>20</option><option value="alla">alla</option></select>
          <button class="btn gron" type="button" id="pv-skapa">Skapa (förhandsvisning)</button>
        </div>
        <div class="pv-row" style="font-size:13px;color:var(--text-svag)">
          Svarssätt: 🔘 Flerval (inget val visas – quiz har bara flerval). Läsförståelsefrågor hoppas över.
        </div>
        <div class="pv-err" id="pv-fel"></div>
      </section>
      <section>
        <h2>Ögonblicksbilden (§4.4)</h2>
        <div class="pv-json">
          <div><b>Elevsynligt (questions)</b><pre id="pv-pub">–</pre></div>
          <div><b>🔒 Facit (lärarskyddat)</b><pre id="pv-facit">–</pre></div>
        </div>
      </section>
      <section class="pv-play">
        <h2>Elevens skärm <small class="hint" id="pv-status"></small></h2>
        <div id="pv-elev"></div>
      </section>
    </div>
    <script type="module">
      const [{ mount }, core, { requireGameMode }, { loadAnswerComponent }, seed, { validateSessionInput, buildSessionDoc }, { registerFormat, getFormat }] =
        await Promise.all([
          import("./src/live/modes/plugga-quiz-picker.js"),
          import("./src/live/modes/plugga-quiz-core.js"),
          import("./src/live/modes/index.js"),
          import("./src/live/answer-kinds.js"),
          import("./seed/seed-data.js"),
          import("./src/live/live-core.js"),
          import("./src/live/live-formats.js"),
        ]);
      const mode = requireGameMode("plugga_quiz");

      // Seed-innehållet + tre påhittade kantfall (få frågor, bara läsförståelse, dubblettalternativ).
      const fr = (id, question, options, answerIndex, extra = {}) => ({ id, question, options, answerIndex, explanation: "", ...extra });
      const extra = [
        { id: "medeltiden", name: "Medeltiden (få frågor)", quiz: [
          fr("m1", "Vad kallades en riddares häst?", ["Springare", "Ponny", "Åsna"], 0, { category: "fakta" }),
          fr("m2", "Vem bodde i en borg?", ["Bonden", "Adeln", "Munken"], 1),
          fr("m3", "Vad är en  tornerspel?", ["En  tävling", "En tävling ", "En dans", "Ett krig"], 0, { category: "begrepp" }),
        ] },
        { id: "lasning", name: "Läsförståelse (bara texter)", quiz: [
          fr("l1", "Vad hette hunden?", ["Bamse", "Fido"], 0, { passage: "Det var en gång en hund som hette Bamse." }),
          fr("l2", "Var bodde hunden?", ["I stan", "På landet"], 1, { passage: "Bamse bodde på landet." }),
        ] },
      ];
      const content = {
        getSubjects: async () => seed.subjects,
        getAreas: async (sid) => [...(seed.areas[sid] || []), ...(sid === "so" ? extra : [])],
      };
      const FORMATS = {
        snille: { id: "test_snilleblixten", displayName: "Snilleblixten", minQuestions: 5 },
        rush: { id: "test_guldrushen", displayName: "Guldrushen", minQuestions: 8 },
      };
      // Testformat (aldrig i produktion) så att kärnans validering/sessionsdokument kan köras.
      for (const f of Object.values(FORMATS)) {
        if (getFormat(f.id)) continue;
        registerFormat({ ...f, icon: "🧪", scope: "inom-klass", minClasses: 1, maxClasses: 3,
          answerKinds: ["free", "choice"], pacing: "lärarstyrd", setupFields: [],
          compatibleGameModes: () => true, validateSetup: () => [], buildSessionFields: () => ({}),
          sessionTitle: (s) => s.name, computeStandings: () => ({}), buildResult: () => ({}),
          projectorViews: async () => ({}), studentView: async () => ({}), historyRenderer: async () => ({}) });
      }

      const box = document.querySelector('[data-field="quizArea"]');
      let picker = null;
      const fmtKey = () => document.querySelector('input[name="fmt"]:checked').value;
      function mountPicker() {
        picker = mount(box, box.querySelector(".live-setup-custom"), { format: FORMATS[fmtKey()], content });
      }
      document.querySelectorAll('input[name="fmt"]').forEach((i) => i.addEventListener("change", mountPicker));
      mountPicker();

      const mountChoice = await loadAnswerComponent("choice");
      let elev = null;
      document.getElementById("pv-skapa").addEventListener("click", async () => {
        const fel = document.getElementById("pv-fel");
        const pick = picker.value();
        const input = { name: "Quizfredag", format: FORMATS[fmtKey()].id, gameMode: mode.id, classIds: ["4b"],
          classNames: { "4b": "4B" }, quizArea: pick };
        const errs = validateSessionInput(input);
        fel.textContent = errs.join(" ");
        if (errs.length) return;
        const session = buildSessionDoc(input, { uid: "larare" });
        const area = (await content.getAreas(pick.subjectId)).find((a) => a.id === pick.areaId);
        const snap = core.buildQuizSnapshot(area.quiz, { count: document.getElementById("pv-count").value });
        document.getElementById("pv-pub").textContent = JSON.stringify({ session: { answerKind: session.answerKind, quiz: session.quiz }, questions: snap.questions }, null, 1);
        document.getElementById("pv-facit").textContent = JSON.stringify(snap.facit, null, 1);
        document.getElementById("pv-status").textContent = `${snap.questions.length} frågor · ${pick.areaName}`;
        elev?.destroy();
        window.__pvSvar = [];
        elev = mountChoice(document.getElementById("pv-elev"), {
          source: mode.createSource({ questions: snap.questions, facit: snap.facit, shuffle: false }),
          check: mode.checkAnswer, choices: mode.choices, suffix: "",
          onAnswer: (a) => window.__pvSvar.push({ ...mode.answerRecord(a.question, a.result), correct: a.result.correct, choiceIndex: a.choiceIndex }),
        });
        window.__pvSnap = snap;
      });
      window.__pvKlar = true;
    </script>
  </body>
</html>
