<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Förhandsvisning – kläder på avatarer</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #fdf6ec; color: #4a3b2a; }
      header { padding: 16px 20px; }
      header h1 { margin: 0 0 4px; font-size: 1.2rem; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; padding: 8px 16px 28px; }
      .cell { display: flex; flex-direction: column; align-items: center; gap: 2px; background:#fff; border:1px solid #e6d9c2; border-radius:10px; padding:8px 2px; }
      .cell .avatar-figure { font-size: 100px; }
      .cell .lbl { font-size: 0.62rem; opacity: 0.75; text-align:center; }
      h2 { font-size: 1rem; margin: 16px 16px 0; }
      /* referenslinjer för ögon (y=34 → 28.3%) och mun (y=46 → 38.3%) i containern */
      .cell .avatar-figure::before,
      .cell .avatar-figure::after {
        content:""; position:absolute; left:0; right:0; height:1px; pointer-events:none;
      }
      .cell.guides .avatar-figure::before { top: 28.3%; background: rgba(0,120,255,.5); }
      .cell.guides .avatar-figure::after  { top: 38.3%; background: rgba(255,40,40,.55); }
    </style>
  </head>
  <body>
    <header>
      <h1>Kläder på avatarer – ansiktsplagg</h1>
      <p style="margin:0;font-size:.8rem">Blå linje = ögonankare (y=34). Röd linje = munankare (y≈46). Varje rad = ett ansiktsplagg på alla avatarer.</p>
    </header>
    <div id="rot"></div>

    <script type="module">
      import { AVATARS, avatarMarkup } from "./src/avatars.js";
      import { ANSIKTE_WEARABLES } from "./src/art-wearables-ansikte.js";

      const rot = document.getElementById("rot");
      const avatarIds = Object.keys(AVATARS);
      const faceItems = Object.keys(ANSIKTE_WEARABLES);

      function section(title, itemId) {
        const h = document.createElement("h2");
        h.textContent = title;
        rot.appendChild(h);
        const grid = document.createElement("div");
        grid.className = "grid";
        for (const av of avatarIds) {
          const cell = document.createElement("div");
          cell.className = "cell guides";
          cell.innerHTML = `${avatarMarkup(av, itemId ? [itemId] : [])}<span class="lbl">${av}</span>`;
          grid.appendChild(cell);
        }
        rot.appendChild(grid);
      }

      section("Utan plagg (referens)", null);
      for (const item of faceItems) section(item, item);
    </script>
  </body>
</html>
