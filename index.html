<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pluggportalen</title>
    <meta name="description" content="Pluggportalen – en glad studiesida för åk 4." />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/styles.css" />
    <link rel="stylesheet" href="./src/games.css" />

  <body>
    <!-- Hamburgerknapp (bara synlig på små skärmar) – öppnar sidomenyn. -->

      <span aria-hidden="true">☰</span>
    </button>
    <!-- Mörk overlay bakom off-canvas-menyn på mobil. -->

    <div class="layout">
      <aside class="sidebar" id="sidebar" aria-label="Sidomeny">
        <button class="brand" id="brand" title="Till startsidan">
          <span class="logo">📚</span> <span class="brand-text">Pluggportalen</span>
        </button>
        <div id="sidebar-body" class="sidebar-body"></div>
      </aside>

      <main id="app" class="container">
        <div class="spinner">Laddar…</div>
      </main>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
