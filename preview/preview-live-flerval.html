<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Förhandsvisning – Live flerval (#552)</title>
    <link rel="stylesheet" href="../src/styles.css" />
    <style>
      /* Hela sidan = en viewport, ingen scroll (Chromebook 1366×768). */
      html, body { height: 100%; margin: 0; overflow: hidden; }
      body { display: flex; flex-direction: column; background: var(--ljus); }
      .pv-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 14px;
        font-size: 13px; background: #fff; box-shadow: var(--skugga-mjuk); }
      .pv-bar b { color: var(--bla-mork); }
      .pv-bar label { display: inline-flex; gap: 4px; align-items: center; }
      .pv-stage { flex: 1; min-height: 0; padding: 2vh 2vw; }
      .pv-foot { display: flex; gap: 16px; justify-content: space-between; padding: 6px 14px; font-size: 12px;
        color: var(--text-svag); background: #fff; }
      .pv-log { font-family: ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
  </head>
  <body>
    <div class="pv-bar">
      <b>Flerval – Snilleblixten/Guldrushen (#552)</b>
      <span>Klicka eller tryck 1–4. Första valet låser.</span>
      <button type="button" id="pv-avsloja">Avslöja</button>
      <button type="button" id="pv-nasta">Nästa fråga</button>
      <label><input type="checkbox" id="pv-fraga" checked /> Visa frågan</label>
    </div>
    <div class="pv-stage" id="pv-root"></div>
    <div class="pv-foot">
      <span id="pv-counts">0 val</span>
      <span class="pv-log" id="pv-log">Registrerade val visas här.</span>
    </div>

    <script type="module">
      const $ = (id) => document.getElementById(id);
      // Samma laddning som i appen: dynamisk import, inget i bootkedjan.
      const [{ mountChoiceAnswer }, { requireGameMode }] = await Promise.all([
        import("../src/live/choice-answer.js"),
        import("../src/live/modes/index.js"),
      ]);
      const mode = requireGameMode("multiplication_0_10");
      const source = mode.createSource();
      let q = null, ch = null, val = 0;
      const log = [];

      const ca = mountChoiceAnswer($("pv-root"), {
        onChoose(i, option) {
          val++;
          const r = mode.checkAnswer(q, String(option));
          log.push({ key: q.key, i, option, correct: r.correct });
          $("pv-counts").textContent = `${val} val`;
          $("pv-log").textContent = `${q.text} → alternativ ${i + 1} (${option}) ${r.correct ? "✅" : "❌"}`;
        },
      });
      function nasta() {
        q = source.next();
        ch = mode.choices(q);
        ca.setQuestion({ options: ch.options, question: $("pv-fraga").checked ? `${q.text} = ?` : "" });
      }
      $("pv-nasta").addEventListener("click", nasta);
      $("pv-avsloja").addEventListener("click", () => ca.reveal(ch.answerIndex));
      nasta();
      window.__ca = ca; // för automatiska tester i webbläsaren
      window.__pv = { log, current: () => ({ q, ch }), nasta };
    </script>
  </body>
</html>
