<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Läsresan – lärarvy (issue #402)</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/styles.css" />
  </head>
  <body>
    <div class="layout">
      <main id="app" class="container"></main>
    </div>

    <script type="module">
      // Lärarvyn för Läsresan med STUBBAD klassdata – ingen inloggning, ingen
      // Firestore. Kör den RIKTIGA renderaren (teacher-lasresan.js) med
      // injicerade källor (loadClass/loadAttempts) i ett klasskort som ser ut
      // som teacher-classes.js. ?tom=1 → klass utan elever.
      import { el, icon, teacherNav, teacherHead } from "/src/teacher-shared.js";
      import { renderClassLasresan } from "/src/teacher-lasresan.js";

      const app = document.getElementById("app");
      const ctx = { app, go: () => {}, renderTopbar: () => {} };

      const students = [
        { id: "s1", namn: "Örjan Lind", username: "orjan.6a", avatarId: "lion" },
        { id: "s2", namn: "Alva Berg", username: "alva.6a", avatarId: "owl" },
        { id: "s3", namn: "Bo Ek", username: "bo.6a", avatarId: "frog" },
        { id: "s4", namn: "Cleo Nyström", username: "cleo.6a", avatarId: "unicorn" },
        { id: "s5", namn: "Dan Holm", username: "dan.6a", avatarId: "robot" },
        { id: "s6", namn: "Elsa <b>Åberg</b>", username: "elsa.6a", avatarId: "cat" }, // escaping-test
        { id: "s7", namn: "Filip Sund", username: "filip.6a", avatarId: "panda" },
        { id: "s8", namn: "Greta Vik", username: "greta.6a", avatarId: "koala" },
      ];
      const cat = (f, o, m, h) => ({
        fakta: { q: f[0], correct: f[1] },
        ordforstaelse: { q: o[0], correct: o[1] },
        mellan_raderna: { q: m[0], correct: m[1] },
        helhet_slutsats: { q: h[0], correct: h[1] },
      });
      const lr = (o) => ({ worldId: "skogen", completedWorlds: [], ...o });
      const LASRESA = {
        s1: lr({ level: 5, totalTexts: 18, totalQuestions: 126, totalCorrect: 91, totalIncorrect: 35, moneyEarned: 273, stepInWorld: 18, catStats: cat([44, 36], [30, 21], [28, 15], [24, 19]) }),
        s2: null, // har inte börjat
        s3: lr({ level: 2, totalTexts: 4, totalQuestions: 24, totalCorrect: 9, totalIncorrect: 15, moneyEarned: 27, stepInWorld: 4, catStats: cat([10, 6], [6, 2], [5, 1], [3, 0]) }),
        s4: lr({ level: 6, totalTexts: 22, totalQuestions: 150, totalCorrect: 130, totalIncorrect: 20, moneyEarned: 390, worldId: "oknen", stepInWorld: 2, completedWorlds: ["skogen"], catStats: cat([50, 47], [36, 31], [34, 27], [30, 25]) }),
        s5: lr({ level: 3, totalTexts: 0, totalQuestions: 0, stepInWorld: 0, currentTextId: "x" }), // startat, inget avslutat
        s6: lr({ level: 4, totalTexts: 9, totalQuestions: 60, totalCorrect: 41, totalIncorrect: 19, moneyEarned: 123, stepInWorld: 9, catStats: cat([24, 20], [14, 9], [12, 6], [0, 0]) }),
        s7: lr({ level: 1, totalTexts: 6, totalQuestions: 30, totalCorrect: 11, totalIncorrect: 19, moneyEarned: 33, stepInWorld: 6, catStats: cat([12, 6], [8, 3], [6, 1], [4, 1]) }),
        s8: lr({ level: 7, totalTexts: 20, totalQuestions: 160, totalCorrect: 149, totalIncorrect: 11, moneyEarned: 447, stepInWorld: 20, catStats: cat([60, 58], [40, 37], [32, 29], [28, 25]) }),
      };
      const TITLES = ["Räven och kråkan", "Hur bin gör honung", "Stormnatten", "Vikingarnas skepp", "Brevet från <mormor>", "Myrstacken", "Isbjörnens vinter", "Den gamla fyren", "Solsystemet", "Hemliga rummet"];
      const DAY = 86400000;
      function attemptsFor(id, max) {
        const l = LASRESA[id];
        if (!l || !l.totalTexts) return [];
        const n = Math.min(max, l.totalTexts);
        const avg = l.totalCorrect / l.totalQuestions;
        return Array.from({ length: n }, (_, i) => {
          const total = 5 + ((i + id.length) % 4);
          const correct = Math.max(0, Math.min(total, Math.round(total * avg + ((i % 3) - 1))));
          return { textId: `t${i}`, title: TITLES[i % TITLES.length], textLevel: l.level - (i % 2), totalQuestions: total, correct, completedAt: Date.now() - i * 1.7 * DAY };
        });
      }

      const fake = (v, ms = 250) => new Promise((r) => setTimeout(() => r(v), ms));
      const loadClass = (ids) => fake(ids.filter((id) => id !== "s2").map((studentId) => ({ studentId, lasresa: LASRESA[studentId] })));
      const loadAttempts = (id, max) => fake(attemptsFor(id, max), 400);

      const container = el(`<div class="teacher-page teacher-dark"></div>`);
      container.appendChild(teacherNav(ctx, "klasser"));
      container.appendChild(teacherHead(ctx, { icon: "users", title: "Klasser & elever" }));
      const card = el(`<div class="panel class-card">
        <div class="class-head">
          <div class="class-title">
            <span class="class-emoji" aria-hidden="true">${icon("school", 22)}</span>
            <span class="class-name">6A</span>
            <span class="class-count">${students.length} elever</span>
          </div>
        </div>
        <div class="class-stats">
          <div class="stats-tabs" role="tablist" aria-label="Statistik">
            <button type="button" class="stats-tab" role="tab">${icon("chart", 16)}<span>Ämnen</span></button>
            <button type="button" class="stats-tab active" role="tab" aria-selected="true">${icon("book", 16)}<span>Läsresan</span></button>
          </div>
          <div class="stats-pane"></div>
        </div>
      </div>`);
      container.appendChild(card);
      app.replaceChildren(container);

      const empty = new URLSearchParams(location.search).has("tom");
      renderClassLasresan(ctx, card.querySelector(".stats-pane"), {
        students: empty ? [] : students,
        loadClass,
        loadAttempts,
      });
    </script>
  </body>
</html>
