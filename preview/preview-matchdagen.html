<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Matchdagen – förhandsvisning (#869, #870, #871, #872, #873)</title>
  <!-- Förhandsvisning av Etapp 1c med STUBBADE data (spec §15): hela appen
       (md-app.js) – en hel match i 3D eller 2D, tabellen, truppen och statistiken.
       Ingen Firebase: karriären och matcherna sparas i localStorage
       ("preview-md:"), områdena är påhittade. game-shared.js stubbas (importmap).
       Kör: PORT=8869 node server.mjs → /preview/preview-matchdagen.html
         ?vy=match|tabell|trupp|stat   flik att öppna
         ?omg=0–5    spelade omgångar (påhittade resultat) – ?omg=5 = säsongen slut
         ?klubb=ny   börja utan klubb (formuläret)      ?ny=1  rensa allt sparat
         ?2d=1       2D-reserven      ?lugnt=1  lugnt läge      ?fps=1  bilder/s
         ?auto=1     roboten spelar (slumpar svaren)        ?svar=skriv  ?klocka=30  ?kallor=inga
       Etapp 2a (#870):
         ?div=0–7    klubben i en annan division (stegen, 8–12 lag, två frågor per skott från 3)
         ?kval=1     ligan är vunnen – kvalmatchen väntar (oavgjort → straffar)
         ?straffar=1 kvalet står 1 – 1 efter full tid – "Fortsätt matchen" går direkt till straffarna
       Etapp 2b (#871):
         ?kassa=N    klubbkassan (köp på marknaden under Truppen)
         ?trupp=visa två köpta spelare, grundpelare bland reserverna och träningspoäng (kräver ?omg≥1)
       #883:
         ?gammal=1   en äldre karriär (före #883): grundpelarna 2★ med 0–99 poäng och lägret "1-N" (gamla formen)
       Etapp 2c (#872):
         ?omg=N      spelar också Silverpokalens matcher som kommer före omgång N (vunna) – den som
                     väntar efter omgång N står kvar under Match ("Silverpokalen · Kvartsfinal · …")
         ?cup=ute    förlorar cupens andra match (utslagna)
         ?rekord=1   en ligamatch står 6 – 0 i 88:e minuten – "Fortsätt matchen" → "Nytt rekord: 6 mål i en match!"
       Etapp 3 (#873):
         ?mastare=1  Superligan, tio omgångar vunna – sista ligamatchen står 3 – 0 i 88:e minuten:
                     "Fortsätt matchen" → mästare, pokalen lyfts (firandet), inbjudan till Mästarcupen
         ?mc=1       inbjudna till Mästarcupen, kvartsfinalen väntar (efter omgång 3)
         ?mc=final   finalen väntar ("FINALEN", fullsatt läktare med flaggor) – med &slut=1 står den
                     2 – 0 i 88:e minuten: "Fortsätt matchen" → pokalen lyfts → "Starta en legendklubb"
         ?mc=vunnen  Mästarcupen är vunnen den här säsongen – erbjudandet under Match
         ?legend=1   en legendklubb (två guldstjärnor, två gamla klubbar i klubbhistoriken, fullt pokalskåp)
         ?vy=pokaler Pokalskåpet -->
  <script type="importmap">
    { "imports": { "../src/game-shared.js": "./matchdagen-868/game-shared.js" } }
  </script>
  <link rel="stylesheet" href="../src/styles.css" />
  <style>
    body { margin: 0; background: #08111f; }
    .ram { padding: 12px 0; }
    .not { max-width: 1180px; margin: 10px auto 0; padding: 0 16px; color: #a9b8d0; font: 600 13px/1.4 Nunito, system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="ram"><section id="app"></section></div>
  <p class="not">Förhandsvisning med påhittade data – i Pluggporten kommer frågorna från lärarens val och allt sparas i Firestore.</p>
  <script type="module">
    import { startaMatchdagen } from "../src/matchdagen/md-app.js";
    import { matchKlar, nastaMatch, nyKarriar, nyLiga } from "../src/matchdagen/delat/md-sasong.js";
    import { kvalMatch } from "../src/matchdagen/delat/md-kval.js";
    import { cupKlar, cupMatch } from "../src/matchdagen/delat/md-cup.js";
    import { nyMatch } from "../src/matchdagen/delat/md-motor.js";
    import { simMal } from "../src/matchdagen/delat/md-liga.js";
    import { skapaPrng } from "../src/matchdagen/delat/md-prng.js";
    import { kop, kopInfo } from "../src/matchdagen/delat/md-trupp.js";
    import { mcKlar, mcMatch } from "../src/matchdagen/delat/md-mastarcup.js";

    const p = new URLSearchParams(location.search);
    const UID = "preview";
    const NYCKEL = "preview-md:";
    if (p.get("ny") === "1") Object.keys(localStorage).filter((k) => k.startsWith(NYCKEL) || k.includes("matchdagen-")).forEach((k) => localStorage.removeItem(k));

    const AREAS = {
      "so/sverige": {
        name: "Sverige", quiz: [
          { question: "Vad heter Sveriges huvudstad?", options: ["Stockholm", "Göteborg", "Malmö", "Uppsala"], answerIndex: 0 },
          { question: "Vilken är Sveriges största sjö?", options: ["Vänern", "Vättern", "Mälaren"], answerIndex: 0 },
          { question: "Hur många landskap har Sverige?", options: ["25", "21", "30", "12"], answerIndex: 0 },
        ],
        pairs: [
          { term: "landskap", definition: "ett av Sveriges 25 gamla områden" },
          { term: "län", definition: "ett område med en egen region" },
          { term: "kommun", definition: "en ort med eget styre" },
          { term: "socken", definition: "en gammal kyrklig indelning" },
        ],
      },
      "ma/addera": { name: "Addition", generator: { topic: "addition", variants: ["enkel"], grade: "ak4" } },
    };
    const k = p.get("kallor") || "alla";
    const inst = k === "inga" ? {} : {
      omraden: ["so/sverige"], tabeller: [6, 7, 8], rakna: p.get("svar") === "skriv" ? ["ma/addera"] : [],
      svarssatt: p.get("svar") === "skriv" ? "skriv" : "flerval", klocka: Number(p.get("klocka")) || 0,
      lugnt: p.get("lugnt") === "1", paus: Number(p.get("paus") ?? 60),
    };

    // Stubbad "Firestore" i localStorage.
    const las = (n) => { try { return JSON.parse(localStorage.getItem(NYCKEL + n) || "null"); } catch { return null; } };
    const skriv = (n, v) => localStorage.setItem(NYCKEL + n, JSON.stringify(v));
    const data = {
      lasKarriar: async () => las("karriar"),
      sparaKarriar: async (uid, K) => skriv("karriar", K),
      sparaMatch: async (uid, K, id, match) => { skriv("karriar", K); skriv(`match:${id}`, { ...match, id }); },
      sparaTrupp: async (uid, K) => skriv("karriar", { ...K, klubb: las("karriar")?.klubb || K.klubb }),
      lasMatch: async (uid, id) => las(`match:${id}`),
    };

    // ?omg=N: en klubb med N påhittade omgångar (för tabellen och statistiken).
    if (p.get("klubb") === "ny") localStorage.removeItem(NYCKEL + "karriar");
    else if (p.has("omg") || p.has("div") || p.has("kval") || p.has("straffar") || p.has("kassa") || p.has("trupp") || p.has("cup") || p.has("rekord") || p.has("mastare") || p.has("mc") || p.has("legend") || p.has("gammal") || !las("karriar")) {
      const r = skapaPrng("preview-869").tal;
      let K = nyKarriar({ namn: "Blixtarna IF", farg: "#2f6fe8", rng: r });
      // Etapp 3 (#873): toppen – Superligan, Mästarcupen och legendklubben.
      const mc = p.get("mc");
      const topp = p.has("mastare") || !!mc;
      const div = topp ? 7 : Math.max(0, Math.min(7, Number(p.get("div")) || 0));
      if (div) K = { ...K, div, liga: nyLiga(div, K.klubb.farg, r) };
      if (topp) {
        K = { ...K, sasong: 9, kassa: 9000, trupp: K.trupp.map((x) => ({ ...x, st: 5 })), rekord: undefined,
          pokaler: [{ typ: "liga", namn: "Vinnare Division 6", sasong: 1, datum: "2026-09-02" }, { typ: "kval", namn: "Kvalade upp till Division 5", sasong: 1, datum: "2026-09-02" },
            { typ: "cup", namn: "Silverpokalen", sasong: 4, datum: "2026-10-01" }, { typ: "superliga", namn: "Mästare i Superligan", sasong: 8, datum: "2026-11-12" }] };
        if (mc) K.mastarcup = `${K.sasong}-0`;
      }
      if (p.get("legend") === "1") {
        K = { ...K, sasong: 31, klubb: { ...K.klubb, legendStjarnor: 2 },
          klubbhistorik: ["Pluggporten FC|#e8473f|1-14|4.5.2.2.1", "Åskvädret IF|#8e5cf7|15-30|5.6.3.3.1"],
          pokaler: [1, 3, 5, 9, 16, 18, 20, 23, 31].map((s, i) => ({ typ: ["liga", "kval", "cup"][i % 3], namn: ["Vinnare Division 6", "Kvalade upp till Division 5", "Silverpokalen"][i % 3], sasong: s, datum: "2026-10-01" }))
            .concat([12, 13, 27, 28, 29].map((s) => ({ typ: "superliga", namn: "Mästare i Superligan", sasong: s, datum: "2026-11-01" })),
              [14, 30].map((s) => ({ typ: "mastarcup", namn: "Mästarcupen", sasong: s, datum: "2026-11-10" }))) };
      }
      const kval = p.get("kval") === "1" || p.get("straffar") === "1";
      const n = kval ? K.liga.schema.length : p.has("mastare") ? K.liga.schema.length - 1 : mc === "1" ? 3 : mc ? 8
        : Math.min(K.liga.schema.length, Number(p.get("omg")) || 0);
      // Mästarcupen (#873): en match som väntar spelas efter cupen, före ligamatchen – vunnen.
      let mcNr = 0;
      const spelaMc = (i) => {
        const stat = { skott: 7, skottPaMal: 4, pass: 15, passOk: 11, tacklingar: 6, vunnaBollar: 4, raddningar: 3, horner: 2, derasSkott: 4,
          fragor: 29, ratt: 24, perKalla: { "tabell:7": { fragor: 29, ratt: 24 } }, sekunder: 430 };
        const ut = mcKlar(K, { res: { oss: 2, dem: 1, utfall: "", mal: [{ min: 21, lag: "oss" }, { min: 55, lag: "dem" }, { min: 80, lag: "oss" }], stat },
          rng: r, nu: Date.now() - (n - i) * 2 * 86400000 - 1800000, matchId: `mc${++mcNr}`, uid: UID });
        K = ut.K;
        skriv(`match:mc${mcNr}`, { ...ut.match, id: `mc${mcNr}` });
      };
      // Silverpokalen (#872): en cupmatch som väntar spelas före ligamatchen, som i appen.
      let cupNr = 0;
      const spelaCup = (i) => {
        const ute = p.get("cup") === "ute" && ++cupNr === 2;
        const stat = { skott: 6, skottPaMal: 3, pass: 14, passOk: 10, tacklingar: 6, vunnaBollar: 4, raddningar: 2, horner: 1, derasSkott: 3,
          fragor: 28, ratt: 20, perKalla: { "tabell:7": { fragor: 28, ratt: 20 } }, sekunder: 420 };
        const [oss, dem] = ute ? [1, 2] : [2, 1];
        const mal = [{ min: 12, lag: "oss" }, { min: 40, lag: ute ? "dem" : "oss" }, { min: 77, lag: ute ? "dem" : "oss" }].slice(0, oss + dem);
        const ut = cupKlar(K, { res: { oss, dem, utfall: "", mal, stat }, rng: r, nu: Date.now() - (n - i) * 2 * 86400000 - 3600000, matchId: `c${i}`, uid: UID,
          kallNamn: { "tabell:7": "7:ans tabell" } });
        K = ut.K;
        skriv(`match:c${i}`, { ...ut.match, id: `c${i}` });
      };
      for (let i = 0; i < n && nastaMatch(K); i++) {
        if (cupMatch(K, UID)) spelaCup(i);
        if (mcMatch(K, UID)) spelaMc(i);
        const [oss, dem] = kval || topp ? [3 + (i % 2), i % 2] : simMal(0.36, nastaMatch(K).mot.styrka, r);
        const fragor = 26 + Math.floor(r() * 5), ratt = Math.round(fragor * (0.6 + r() * 0.25));
        const stat = { skott: 4 + oss * 2, skottPaMal: 2 + oss, pass: 14, passOk: 10, tacklingar: 6, vunnaBollar: 4, raddningar: 2, horner: 1, derasSkott: 3,
          fragor, ratt, perKalla: { "omrade:so/sverige": { fragor: Math.round(fragor / 2), ratt: Math.round(ratt / 2) }, "tabell:7": { fragor: fragor - Math.round(fragor / 2), ratt: ratt - Math.round(ratt / 2) } }, sekunder: 400 + r() * 60 };
        const mal = [...Array(oss)].map((_, j) => ({ min: 10 + j * 20, lag: "oss" })).concat([...Array(dem)].map((_, j) => ({ min: 15 + j * 25, lag: "dem" })));
        const ut = matchKlar(K, { res: { oss, dem, utfall: "", mal, stat }, rng: r, nu: Date.now() - (n - i) * 2 * 86400000, matchId: `p${i}`,
          kallNamn: { "omrade:so/sverige": "Sverige", "tabell:7": "7:ans tabell" } });
        K = ut.K;
        skriv(`match:p${i}`, { ...ut.match, id: `p${i}` });
      }
      // ?trupp=visa: köp de två bästa som går att köpa (grundpelarna till reserverna) och lite träning.
      if (p.get("trupp") === "visa") {
        K = { ...K, kassa: 20000 };
        for (let i = 0; i < 2; i++) {
          const kan = (K.marknad || []).filter((x) => kopInfo(K, x.id).kan).sort((a, b) => b.st - a.st)[0];
          if (kan) K = kop(K, kan.id).K;
        }
        K.trupp = K.trupp.map((x, i) => (x.st < 5 ? { ...x, xp: [36, 44, 12, 28, 48, 0, 24][i] } : x));
        K.kassa = 1500;
      }
      // ?gammal=1 (#883): så ser en karriär från före #883 ut – 2★-grundpelare och ett använt läger i gamla formen.
      if (p.get("gammal") === "1") {
        K.trupp = K.trupp.map((x, i) => (x.grundpelare ? { ...x, st: 2, xp: [0, 60, 96, 12, 84, 36, 99][i] } : x));
        if (K.liga.omg > 0) K.lager = `${K.sasong}-${K.liga.omg}`;
      }
      if (mc === "vunnen" && mcMatch(K, UID)) spelaMc(n);
      if (p.has("kassa")) K.kassa = Math.max(0, Number(p.get("kassa")) || 0);
      skriv("karriar", K);
      // ?straffar=1: kvalet står 1 – 1 efter full tid och ligger som en pågående match (md-lokal.js).
      const kv = kvalMatch(K);
      if (p.get("rekord") === "1" && cupMatch(K, UID)) { spelaCup(n); skriv("karriar", K); }
      if (p.get("rekord") === "1" && nastaMatch(K)) {
        // ?rekord=1: ligamatchen står 6 – 0 i 88:e minuten – ett läge till och slutsignalen.
        const nm = nastaMatch(K);
        const m = { ...nyMatch({ mot: { namn: nm.mot.namn, styrka: nm.mot.styrka }, div: K.div }), min: 88, halvlek: 2, oss: 6, dem: 0, lagen: 40,
          mal: [3, 17, 29, 44, 61, 80].map((min) => ({ min, lag: "oss" })) };
        Object.assign(m.stat, { skott: 11, skottPaMal: 8, pass: 16, passOk: 13, fragor: 30, ratt: 26, sekunder: 420 });
        localStorage.setItem(`matchdagen-match:${UID}`, JSON.stringify({ v: 1, sasong: K.sasong, omg: K.liga.omg, typ: "liga", matchId: "preview-rekord", m }));
      } else if ((p.has("mastare") && nastaMatch(K)) || (mc === "final" && p.get("slut") === "1" && mcMatch(K, UID))) {
        // ?mastare=1 / ?mc=final&slut=1: matchen står 3 – 0 (2 – 0) i 88:e minuten – ett läge till och slutsignalen.
        const f = mcMatch(K, UID);
        const mot = f ? f.mot : nastaMatch(K).mot;
        const m = { ...nyMatch({ mot: { namn: mot.namn, styrka: mot.styrka }, div: K.div, avgor: !!f }), min: 88, halvlek: 2, oss: f ? 2 : 3, dem: 0, lagen: 40,
          mal: (f ? [34, 70] : [12, 50, 77]).map((min) => ({ min, lag: "oss" })) };
        Object.assign(m.stat, { skott: 9, skottPaMal: 6, pass: 16, passOk: 13, fragor: 30, ratt: 25, sekunder: 420 });
        localStorage.setItem(`matchdagen-match:${UID}`, JSON.stringify({ v: 1, sasong: K.sasong, omg: K.liga.omg, typ: f ? "mastarcup" : "liga", ...(f ? { runda: f.runda } : {}),
          matchId: f ? "preview-final" : "preview-mastare", m }));
      } else if (p.get("straffar") === "1" && kv) {
        const m = { ...nyMatch({ mot: { namn: kv.mot.namn, styrka: kv.mot.styrka }, div: K.div, avgor: true }),
          min: 90, halvlek: 2, slut: true, oss: 1, dem: 1, lagen: 38, mal: [{ min: 23, lag: "oss" }, { min: 71, lag: "dem" }] };
        Object.assign(m.stat, { skott: 6, skottPaMal: 3, pass: 15, passOk: 11, fragor: 27, ratt: 19, sekunder: 410 });
        localStorage.setItem(`matchdagen-match:${UID}`, JSON.stringify({ v: 1, sasong: K.sasong, omg: K.liga.omg, typ: "kval", matchId: "preview-kval", m }));
      } else localStorage.removeItem(`matchdagen-match:${UID}`);
    }

    const S = await startaMatchdagen(document.getElementById("app"), {
      uid: UID, inst, data,
      hamtaOmrade: async (s, a) => AREAS[`${s}/${a}`] ?? null,
      avatar: { avatarId: "fox", avatarItems: [] },
      tvinga2d: p.get("2d") === "1",
    });
    window.__md = S;
    if (p.get("vy") && p.get("vy") !== "match") S.visa(p.get("vy"));

    // ?auto=1: en robot som spelar (skärmdumpar och fps-mätningen) – den slumpar svaren.
    if (p.get("auto") === "1") {
      setInterval(() => {
        const ruta = document.querySelector(".md-ruta button");
        if (ruta) return ruta.click();
        const start = document.querySelector("[data-avspark]:not(:disabled)");
        if (start) return start.click();
        const val = [...document.querySelectorAll(".md-val button:not(:disabled)")];
        if (val.length) {
          const skjut = val.find((b) => b.dataset.id === "skjut" && /Bra läge|Jätteläge/.test(b.textContent));
          return (skjut || val.find((b) => b.dataset.id === "tackla") || val[Math.random() < 0.6 ? 0 : 1]).click();
        }
        const alt = [...document.querySelectorAll(".md-alt:not(:disabled)")];
        if (alt.length && !document.querySelector(".md-fraga[data-utfall]")) alt[Math.floor(Math.random() * alt.length)].click();
      }, 900);
    }
  </script>
</body>
</html>
