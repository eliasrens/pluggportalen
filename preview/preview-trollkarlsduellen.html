<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demoläge – Trollkarlsduellen (#536)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../src/styles.css" />
    <style>
      /* Demopanelen ligger ovanpå projektorn – finns BARA i den här filen. */
      .pv { position: fixed; left: 10px; bottom: 10px; z-index: 100; width: 330px; max-height: 70vh; overflow: auto;
        font: 13px/1.35 system-ui, sans-serif; background: rgba(255, 255, 255, 0.96); color: #1b2559; border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0,0,0,.35); }
      .pv summary { cursor: pointer; padding: 8px 12px; font-weight: 700; position: sticky; top: 0; background: inherit; }
      .pv-body { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 12px; }
      .pv-body b { width: 100%; margin-top: 6px; }
      .pv button, .pv select { font: inherit; padding: 4px 8px; border-radius: 8px; border: 1px solid #c5cde0; background: #f3f6fc; cursor: pointer; }
      .pv button:hover { background: #e3e9f7; }
      .pv-note { width: 100%; color: #5a6585; }
      .pv-log { width: 100%; font: 11px/1.3 ui-monospace, monospace; color: #33415c; white-space: pre-wrap; max-height: 110px; overflow: auto;
        background: #f3f6fc; border-radius: 8px; padding: 6px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <details class="pv" open>
      <summary>🧙 Demoläge – Trollkarlsduellen</summary>
      <div class="pv-body">
        <span class="pv-note">Simulerad match i webbläsaren – ingen Firestore, inga riktiga elevresultat. Klass A = 4B,
          klass B = 5E. Läget sparas i fliken (sessionStorage) så "Omladdningstest" laddar om mitt i matchen.</span>
        <b>Match</b>
        <button data-act="lobby">Ny match: lobby</button>
        <button data-act="live">Ny match: pågår</button>
        <button data-act="auto">Auto-svar på/av</button>
        <button data-act="reload">🔄 Omladdningstest</button>
        <b>Rätt svar (magi)</b>
        <button data-act="plus10-0">+10 rätt A</button>
        <button data-act="plus10-1">+10 rätt B</button>
        <button data-act="full-0">Full mätare A</button>
        <button data-act="full-1">Full mätare B</button>
        <button data-act="hopp98">98 → 103 (A)</button>
        <button data-act="bada">Båda fulla samtidigt</button>
        <b>Attacker (bara bilden)</b>
        <button data-act="slump">Slumpattack</button>
        <select data-attack></select>
        <button data-act="valfri-left">från vänster</button>
        <button data-act="valfri-right">från höger</button>
        <b>Ställning och tid</b>
        <button data-act="ledning">Ledningsbyte</button>
        <button data-act="t35">35 s kvar</button>
        <button data-act="t10">10 s kvar</button>
        <button data-act="byt">Byt trollkarlar</button>
        <b>Slut</b>
        <button data-act="slut">Matchslut nu</button>
        <button data-act="oavgjort">Oavgjort</button>
        <button data-act="vinn-rasmus">Rasmus vinner</button>
        <button data-act="vinn-elias">Elias vinner</button>
        <div class="pv-log" data-log></div>
      </div>
    </details>

    <script type="module">
      import { mountProjector } from "../src/live/projector.js";
      import {
        phaseAt, classStandings, decideWinner, topPlayers, buildResult, formatClock, buildSessionDoc,
      } from "../src/live/live-core.js";
      import { swapWizards, resolveWizards } from "../src/live/trollkarl/trollkarl-val.js";
      import { listAttacks } from "../src/live/trollkarl/trollkarl-register.js";
      import { trollkarlDemo } from "../src/live/trollkarl/trollkarl-vy.js";

      const KEY = "pv-trollkarl-sim";
      const elev = location.hash.includes("skarm=elev");
      const bus = "BroadcastChannel" in window ? new BroadcastChannel("pv-trollkarl-sim") : null;
      if (elev) document.querySelector(".pv").hidden = true;
      localStorage.setItem("pp:live:vy", new URLSearchParams(location.search).get("vy") || "trollkarl");
      const now = () => Date.now();
      const logEl = document.querySelector("[data-log]");
      const log = (t) => { logEl.textContent = `${new Date().toLocaleTimeString("sv-SE")} ${t}\n${logEl.textContent}`.slice(0, 3000); };

      function newSim(fas) {
        const s = {
          ...buildSessionDoc({
            name: "4B mot 5E", gameMode: "multiplication_0_10", classIds: ["4b", "5e"],
            classNames: { "4b": "4B", "5e": "5E" }, durationMin: 20, divisors: { "4b": 17, "5e": 22 },
          }, { uid: "demo" }),
          id: `demo-${now().toString(36)}`,
        };
        if (fas === "live") { s.status = "live"; s.startedAt = now() - 4000; }
        return { session: s, correct: { "4b": 0, "5e": 0 } };
      }
      let sim = JSON.parse(sessionStorage.getItem(KEY) || "null") || newSim("live");
      const save = () => sessionStorage.setItem(KEY, JSON.stringify(sim));

      function compute() {
        const t = now();
        const s = sim.session;
        const ph = phaseAt(s, t);
        const players = s.participatingClassIds.flatMap((cid) => Array.from({ length: 12 }, (_, i) => (
          { uid: `${cid}-${i}`, classId: cid, name: `Elev ${i + 1}`, lastSeenAt: t, correct: 0, incorrect: 0 })));
        const classes = classStandings(s, sim.correct, players, s.status === "lobby" ? t : null);
        const w = decideWinner(classes);
        return {
          sessionId: s.id, session: { ...s }, status: s.status, phase: ph.phase, countdown: ph.countdown, msLeft: ph.msLeft,
          clock: formatClock(ph.msLeft), classes, totalCorrect: classes.reduce((n, c) => n + c.correct, 0),
          leaderIds: w.leaderIds, winnerId: w.winnerId, draw: w.draw, top: topPlayers([], 10), result: s.result || null, now: t,
        };
      }

      let cb = null;
      let lastKey = "";
      let resultT = 0;
      function emit(force) {
        if (!elev) { save(); bus?.postMessage(sim); }
        if (!cb) return;
        const st = compute();
        const s = sim.session;
        if (!elev && st.phase === "ended" && s.status === "live") {
          setTimeout(() => { if (s.status === "live") finish(); }, 900);
        }
        if (!elev && st.phase === "finished" && !s.result && !resultT) {
          resultT = setTimeout(() => { resultT = 0; s.result = buildResult(s, compute().classes, []); log(`result.winner = ${s.result.winner}`); emit(true); }, 2500);
        }
        const key = JSON.stringify([st.status, st.phase, st.countdown, st.clock, st.classes, !!st.result, s.classDivisors, s.wizards]);
        if (!force && key === lastKey) return;
        lastKey = key;
        cb(st);
      }
      function finish() {
        const s = sim.session;
        if (s.status === "finished") return;
        if (!s.startedAt) s.startedAt = now() - 10_000;
        s.status = "finished";
        s.finishedAt = now();
        log("Matchslut");
        emit(true);
      }
      setInterval(() => emit(false), 250);
      if (elev && bus) bus.onmessage = (e) => { sim = e.data; };

      const deps = {
        subscribe(sid, fn) { cb = fn; emit(true); return () => { cb = null; }; },
        now,
        async start() { await new Promise((r) => setTimeout(r, 250)); if (sim.session.status === "lobby") { sim.session.status = "live"; sim.session.startedAt = now(); } emit(true); },
        async finish() { finish(); },
        async setDivisor(sid, cid, n) { sim.session.classDivisors[cid] = Math.max(1, Math.floor(Number(n))); emit(true); },
        async setWizards(sid, map) { await new Promise((r) => setTimeout(r, 150)); sim.session.wizards = { ...map }; log(`wizards = ${JSON.stringify(map)}`); emit(true); },
      };
      const ctx = { app: document.getElementById("app"), go: (h) => log(`navigera till ${h}`) };
      mountProjector(ctx, sim.session.id, { cleanups: [], uid: "demo", deps, screen: elev });

      // Attacklistan fylls av registret (del C/D registrerar i trollkarl-innehall.js).
      const sel = document.querySelector("[data-attack]");
      sel.innerHTML = listAttacks().map((a) => `<option value="${a.id}">${a.name || a.id}</option>`).join("");

      // --- Demopanelen --------------------------------------------------------------
      let auto = false;
      setInterval(() => {
        if (!auto || phaseAt(sim.session, now()).phase !== "live") return;
        const cid = Math.random() < 0.52 ? "4b" : "5e";
        sim.correct[cid] += 1 + Math.floor(Math.random() * 2);
        emit(false);
      }, 200);
      const ids = () => sim.session.participatingClassIds;
      const score = (cid) => sim.correct[cid] / sim.session.classDivisors[cid];
      const setLeft = (ms) => { const s = sim.session; if (s.status !== "live") return; s.startedAt = now() - 4000 - (s.durationSeconds * 1000 - ms); delete s.endsAt; };
      const leadBy = (cid) => {
        const o = ids().find((x) => x !== cid);
        const need = Math.ceil((score(o) + 1.5) * sim.session.classDivisors[cid]);
        sim.correct[cid] = Math.max(sim.correct[cid], need);
      };
      const ACT = {
        lobby() { sim = newSim("lobby"); save(); location.reload(); },
        live() { sim = newSim("live"); save(); location.reload(); },
        auto() { auto = !auto; log(`auto-svar ${auto ? "på" : "av"}`); },
        reload() { save(); location.reload(); },
        hopp98() {
          const a = ids()[0];
          sim.correct[a] = Math.floor(sim.correct[a] / 100) * 100 + 98;
          emit(true);
          setTimeout(() => { sim.correct[a] += 5; log(`${a}: 98 → 103`); emit(true); }, 900);
        },
        bada() { for (const c of ids()) sim.correct[c] = Math.floor(sim.correct[c] / 100) * 100 + 100; },
        slump() { const side = Math.random() < 0.5 ? "left" : "right"; log(`slumpattack från ${side}: ${trollkarlDemo.view?.attack(side) ? "köad" : "nekad"}`); },
        "valfri-left"() { log(`${sel.value} från vänster: ${trollkarlDemo.view?.attack("left", sel.value) ? "köad" : "nekad"}`); },
        "valfri-right"() { log(`${sel.value} från höger: ${trollkarlDemo.view?.attack("right", sel.value) ? "köad" : "nekad"}`); },
        ledning() {
          const st = compute();
          const trail = ids().find((c) => !(st.leaderIds.length === 1 && st.leaderIds[0] === c)) || ids()[1];
          leadBy(trail);
          log(`ledningsbyte → ${trail}`);
        },
        t35() { setLeft(35_000); },
        t10() { setLeft(10_000); },
        byt() { sim.session.wizards = swapWizards(resolveWizards(sim.session)); log(`wizards = ${JSON.stringify(sim.session.wizards)}`); },
        slut() { finish(); },
        oavgjort() {
          const n = Math.max(...ids().map((c) => sim.correct[c]), 100);
          for (const c of ids()) { sim.session.classDivisors[c] = 20; sim.correct[c] = n; }
          finish();
        },
        "vinn-rasmus"() { const m = resolveWizards(sim.session); leadBy(ids().find((c) => m[c] === "rasmus")); finish(); },
        "vinn-elias"() { const m = resolveWizards(sim.session); leadBy(ids().find((c) => m[c] === "elias")); finish(); },
      };
      document.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => {
        const a = b.dataset.act;
        const m = a.match(/^(plus10|full)-(\d)$/);
        if (m) {
          const cid = ids()[Number(m[2])];
          sim.correct[cid] = m[1] === "plus10" ? sim.correct[cid] + 10 : Math.floor(sim.correct[cid] / 100) * 100 + 100;
        } else ACT[a]?.();
        emit(true);
      }));
      log(`session ${sim.session.id} · fas ${compute().phase} · rätt ${JSON.stringify(sim.correct)}`);
    </script>
  </body>
</html>
