/* ── src/styles/18-varld.css ── */
/* ============================================================================
   Husvärlden (#/elev/hus + #/elev/rum) – EN spelscen med kamerazoom-nivåer
   ============================================================================
   Scenen (.varld-stage) täcker större delen av innehållsytan och innehåller
   fullstora LAGER (.varld-lager) – ett per zoomnivå (ute/rummet, senare byn).
   Kameran (varld-kamera.js) sätter transform/transform-origin/opacity inline;
   timing &amp; easing (samma som gamla .gar-in-zoomen: 900 ms, cubic-bezier,
   origin mot fönstret) ligger här. Sidomenyn påverkas inte – bara #app-ytan
   breddas i världsläget (body.varld-lage sätts av routern). */

body.varld-lage .container {
  max-width: 1440px;
}

.varld-stage {
  position: relative;
  width: 100%;
  /* Höjden fyller innehållsytan minus header/marginaler. 100dvh (inte 100vh)
     räknar bort mobilens dynamiska webbläsar-chrome, så scenen inte hamnar
     under adressfältet. vh-raden är en fallback för mycket gamla motorer.
     OBS: på DESKTOP (&gt;700px) blir scenen kant-i-kant (se @media längre ner) men
     scen-BOXEN (.varld-lager) hålls kvar i den här storleken så objekten aldrig
     zoomas – bara mer övertecknad himmel/mark visas runt om (issue #373). */
  height: clamp(420px, calc(100vh - 150px), 900px);
  height: clamp(420px, calc(100dvh - 150px), 900px);
  border-radius: var(--radie);
  overflow: hidden;
  box-shadow: var(--skugga-mjuk);
  background: #bde3f5;
  margin-bottom: 16px;
  /* Avatarens storlek i scen-koordinater (px i ute-SVG:ns viewBox). En
     framtida by-nivå sätter ett mindre värde på sina hus-kopior. */
  --varld-avatar-font: 120px;
}

/* KANT-I-KANT IMMERSIV VÄRLD på DESKTOP (issue #373, &gt; 700px) ----------------
   Scenen fyller HELA ytan till höger om sidomenyn – ingen läsbar maxbredd, ingen
   lavendel-marginal, ingen kortram. VIKTIGT: objekten (hus/avatar/UFO/sol/
   minihus/djur) behåller EXAKT sin gamla storlek. Det löser vi genom att hålla
   scen-lagren (.varld-lager) kvar i den GAMLA scen-boxens mått, centrerade i det
   nu full-bleed:ade staget. Ute-scenernas övertecknade himmel/gräs (svg
   overflow:visible) svämmar då ut BORTOM lagret och fyller den extra ytan → man
   ser MER himmel/mark runt om i stället för förstorade objekt. Kameran (inline
   transform på lagren) är opåverkad. Rummet undantas (kaklet/väggen ska fylla
   ut kant-i-kant och möblerna är redan cap:ade i storlek → ingen zoom där).
   Brytpunkten är 820px = exakt där sidomenyn fortfarande är FAST (över 820) i
   stället för off-canvas. Under 820px (off-canvas-meny + hamburger = &quot;mobil&quot;/
   surfplatta) rörs scenen INTE – den ser ut precis som förr, och den fasta
   hamburgern krockar aldrig med scenens topp-kontroller. */
@media (min-width: 821px) {
  body.varld-lage .container {
    max-width: none;
    margin: 0;
    padding: 0;
  }

  .varld-stage {
    height: 100vh;
    height: 100dvh;
    border-radius: 0;
    box-shadow: none;
    margin: 0;
  }

  /* Scen-boxen = gamla scen-måtten, centrerad i staget (margin:auto + inset:0).
     Ute-svg:n fyller lagret (100 %) → objekten får sin gamla skala; översikts-
     overlays (gårdsdjur, odling, minihus) sitter kvar i % av samma box → allt
     linjerar exakt som förr. Rummet (.room-stage) undantas och fyller staget. */
  .varld-lager:not(.room-stage) {
    inset: 0;
    width: min(calc(100% - 40px), 1400px);
    height: clamp(420px, calc(100dvh - 150px), 900px);
    margin: auto;
  }

  /* By-/skol-scenerna ritar marken med preserveAspectRatio=&quot;none&quot; (fyller BARA
     scen-boxen, ingen överteckning). För att slippa en synlig söm (grön yta OVAN
     scenens himmelsrand) förankras deras box i TOPPEN: himmelsranden hamnar då
     högst upp och den extra ytan under/vid sidorna fylls av samma gräsgröna som
     staget-botten. Ute-nivåerna (hus/gård…) fylls i stället av svg:ns
     övertecknade natur och förblir vertikalt centrerade. */
  .varld-lager.varld-by,
  .varld-lager.varld-skola {
    margin-top: 0;
    margin-bottom: auto;
  }
  .varld-stage[data-niva=&quot;by&quot;],
  .varld-stage[data-niva=&quot;skola&quot;],
  .varld-stage[data-niva=&quot;grannby&quot;] {
    background: #a8da8f;
  }
}

.varld-lager {
  position: absolute;
  inset: 0;
  transition: transform 0.9s cubic-bezier(0.55, 0, 0.2, 1), opacity 0.55s ease 0.25s;
  will-change: transform, opacity;
}
.varld-lager.varld-dold { visibility: hidden; }
.varld-lager.varld-utan-anim { transition: none !important; }

/* Ute-scenen ritas med preserveAspectRatio=&quot;xMidYMid meet&quot; så att hus + avatar
   + all natur ALLTID får plats (inget beskärs på korta/breda eller smala/höga
   skärmar). overflow:visible låter den övertecknade himlen/gräset (ritade långt
   utanför viewBoxen) fylla ut letterbox-ytan i stället för att lämna tomma
   kanter – .varld-stage (overflow:hidden) klipper det mot scenramen. */
.varld-ute svg { display: block; width: 100%; height: 100%; overflow: visible; }

/* Elevens avatar framför huset (foreignObject i ute-SVG:n → skalar med scenen).
   Botten-justerad (flex-end) och fyller foreignObject:ens höjd, så fötterna
   står kvar på marklinjen (foreignObject-botten) medan extrautrymmet hamnar
   OVANFÖR huvudet – där ger det plats åt hattar/kepsar utan att de klipps. */
.varld-avatar {
  font-size: var(--varld-avatar-font, 120px);
  line-height: 0;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  height: 100%;
}
.varld-avatar .avatar-figure { vertical-align: top; }

/* Rummets lager återanvänder .room-stage-utseendet (väggfärger m.m.) men
   fyller hela scenen i stället för att vara ett eget block. */
.varld-lager.room-stage {
  height: auto;
  margin: 0;
  border-radius: 0;
  box-shadow: none;
  /* KOHERENT SKALNING: rummet ska se ut som SAMMA rum i olika storlek på alla
     bredder – möbler, djur OCH deras inbördes avstånd (procent-positioner) ska
     krympa/växa TILLSAMMANS. Tidigare var storleken fast (rem × --rum-skala med
     en fast desktop/mobil-breakpoint) medan positionerna var i procent → på en
     smal scen blev sakerna ~samma pixelstorlek men avstånden få pixlar, så allt
     &quot;klumpades mot mitten&quot;.
     Lösning: scenen är en container (container-type: inline-size) och saker mäts
     i en &quot;rums-enhet&quot; som följer scenBREDDEN kontinuerligt
     (1cqw = 1 % av scenbredden). Därmed upptar varje sak SAMMA andel av scenen
     vid varje bredd → ingen ihopklumpning, ingen fast breakpoint.
     Capen (--rum-cap) håller stora desktop-scener på samma pixelstorlek som förr
     (gamla --rum-skala:1.55 ≈ 24.8px), så laptop/desktop ser likadant ut.

     EN &quot;rums-enhet&quot; (motsvarar gamla 1rem × skala) räknas fram som
       min(var(--rum-koeff) * 1cqw, var(--rum-cap))
     OBS: cqw MÅSTE skrivas direkt där måttet används (i .room-item/.room-pet-
     reglerna nedan och i de inline-satta storlekarna i varld-rum*.js) – en
     container-enhet som bärs via en egen var() (t.ex. --rum-enhet: 2.5cqw)
     resolvas mot fel container (deklarations-elementets, dvs viewporten) i
     Chromium. Därför bär vi bara de ENHETSLÖSA rattarna i variabler och
     multiplicerar med 1cqw på plats. */
  container-type: inline-size;
  --rum-koeff: 2.5; /* rums-enheter per 1 % scenbredd (1cqw) */
  --rum-cap: 25px;  /* tak per enhet → desktop = gamla fasta storleken */
}

#husgrupp, #kompis-husgrupp { cursor: pointer; transform-origin: 50% 75%; transition: transform 0.25s; outline: none; }
#husgrupp:hover, #husgrupp:focus-visible,
#kompis-husgrupp:hover, #kompis-husgrupp:focus-visible { transform: scale(1.02) rotate(-0.6deg); }

/* Klasskylten vid gårdskanten – klick zoomar ut till klassbyn. */
#klasskylt {
  cursor: pointer;
  transform-box: fill-box;
  transform-origin: 50% 85%;
  transition: transform 0.25s;
  outline: none;
}
#klasskylt:hover, #klasskylt:focus-visible { transform: scale(1.05) rotate(-1.2deg); }

/* Nav-skyltarna nere till VÄNSTER (by → &quot;Andra byar&quot;, skola → &quot;Min by&quot;): samma
   trä-skylt (navSkyltSvg → skyltMarkup) och klick-som-zoom-känsla som gårdskylten
   ovan, men som overlay-UI i .varld-ui (position:absolute mot scenen). Speglar
   gårdskyltens placering: nere till vänster. Ligger i scenens overlay-skikt
   (.varld-ui = --z-scen-ui), egen z-index behövs inte. */
.varld-navskylt {
  position: absolute;
  left: 12px;
  bottom: 12px;
  width: clamp(96px, 16vw, 150px);
  pointer-events: auto;
  cursor: pointer;
  transform-origin: 50% 90%;
  transition: transform 0.25s;
  outline: none;
  /* Liten skugga/lyft så skylten läser som ett klickbart objekt mot scenen. */
  filter: drop-shadow(2px 3px 0 rgba(59, 51, 80, 0.18));
}
.varld-navskylt:hover, .varld-navskylt:focus-visible { transform: scale(1.05) rotate(-1.2deg); }
.varld-navskylt:active { transform: scale(0.98) rotate(-1.2deg); }
.varld-navskylt .navskylt-svg { display: block; width: 100%; height: auto; }
/* &quot;Till gården&quot;-skylten (hus-nivån, #328) speglas till HÖGRA hörnet så den
   inte krockar med gårdskylten/grusgången som redan bor nere till vänster. */
.varld-navskylt.hoger { left: auto; right: 12px; }
/* &quot;Andra byar&quot; (#483): by-layouten håller hörnet fritt från hus (BY_SKYLT i
   varld-by.js = 22 % × 22 % nere till vänster). Skylten kapas så den alltid
   ryms där: bredd ≤ 22 % − 12 px, och höjden (0,65 × bredd) + 12 px ≤ 22 % av
   den lägsta scenhöjden 420 px → bredd ≤ 124 px. */
#by-skylt { width: min(clamp(96px, 16vw, 124px), calc(22% - 12px)); }

/* --- Gårds-grenen (#328): baksidan/gården + laggårdens interiör ------------
   Båda lagren delar .varld-ute:s svg-regel (fullstor + overflow:visible så de
   övertecknade himlarna/väggarna fyller letterbox-ytan). Bakgrundsfärgerna
   matchar scenernas gräs/trä så inget blått blinkar fram under kamerazoomen. */
.varld-gard { background: #a8da8f; }
.varld-laggard { background: #b0805a; }

/* --- Bondgårdsdjuren (#330): häst/ko/gris i hagen &amp; laggården ---------------
   Overlay-lager ovanpå scen-SVG:n (samma mönster som .tradgard-lager):
   pointer-events:none så klick (t.ex. laggårdsdörren) går vidare till scenen;
   container-type → djurens cqw-storlek mäts mot lagrets bredd. Noderna delar
   .room-item/.room-pet-klasserna så promenad-CSS:en (gång-guppet + spegling)
   följer med gratis; storleken sätts inline mot --fdjur-koeff/--fdjur-cap. */
.gard-djur-lager {
  position: absolute;
  inset: 0;
  pointer-events: none;
  container-type: inline-size;
  /* #336: rejält större djur i hagen/ladan (+~55 %) så sidoprofilerna läses
     på håll – rummets djurstorlek (itemSize) påverkas INTE av de här. */
  --fdjur-koeff: 3.1;
  --fdjur-cap: 47px;
}
/* Klick på djuret öppnar foder-panelen (#332) – lagret är pointer-events:none,
   så själva djur-noderna måste slå på pekar-händelser igen. */
.gard-djur-lager .gard-djur { cursor: pointer; pointer-events: auto; }
/* Hagens staket-FRAMKANT (#345): eget lager EFTER djur-lagret i DOM → främre
   slanan ritas ovanpå djuren, så de ser ut att stå INNANFÖR gärdsgården.
   SVG:n delar viewBox/preserveAspectRatio med scen-SVG:n och fyller lagret
   (.varld-ute svg-regeln) → koordinaterna linjerar exakt. pointer-events:none
   så klick på djuren (foder-panelen, #332) går rakt igenom. */
.gard-forgrund { position: absolute; inset: 0; pointer-events: none; }
.gard-djur-lager .gard-djur .rp-namn { cursor: pointer; }
/* #371: i HAGEN (.har-forgrund – lagret som har ett staket ovanpå djuren) sitter
   djurets namnskylt OVANFÖR huvudet, absolut placerad ur nodens flöde. Under
   fötterna hamnar den annars nere vid gärdsgårds-lagret (.gard-forgrund ligger
   ovanpå djuren) och döljs delvis bakom en slana/stolpe. Ovanför huvudet är den
   fri från staketet → alltid HELT synlig. Ladan (utan forgrund) och rummets
   .room-pet .rp-namn är oförändrade. */
.gard-djur-lager.har-forgrund .gard-djur .rp-namn {
  position: absolute;
  left: 50%;
  bottom: 100%;
  transform: translateX(-50%);
  margin: 0 0 3px;
}

/* Mood-minen (glad/nöjd/less ur trivseln, #330): liten bricka uppe till höger
   på djur-noden – i rummet OCH i hagen/ladan (samma markup i båda). */
.room-pet .fdjur-mood {
  position: absolute;
  top: -0.35rem;
  right: -0.5rem;
  width: 1.05rem;
  height: 1.05rem;
  pointer-events: none;
}
.room-pet .fdjur-mood svg { display: block; width: 100%; height: 100%; }

/* --- Matning &amp; daglig gåva (#332) ------------------------------------------ */
/* 🎁-badgen: dagens gåva väntar (trivsel ≥ 60, inte hämtad idag) – uppe till
   vänster (mood-minen bor till höger), med ett litet uppmärksamhets-gupp. */
.room-pet .fdjur-gava {
  position: absolute;
  top: -0.5rem;
  left: -0.5rem;
  font-size: 0.85rem;
  pointer-events: none;
  animation: fdjur-gava-gupp 1.6s ease-in-out infinite;
}
@keyframes fdjur-gava-gupp {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px) scale(1.08); }
}

/* Hjärt-puffen vid matning: samma stigande/tonande bana som klapp-hjärtana
   (pet-rygg-fx-keyframes), tre stycken med inline-fördröjning/spridning. */
.foder-hjarta {
  position: absolute;
  left: 50%;
  top: -4px;
  pointer-events: none;
  font-size: 1.05rem;
  opacity: 0;
  animation: pet-rygg-fx 1.1s ease-out both;
}

/* Foder-sektionen (gårds-panelen + rummets namn-panel): trivsel-rad med
   mood-min i radhöjd; gröd-knapparna återbrukar .room-tray/.tray-item,
   favoritgrödan får en mjuk markering. */
.foder-trivsel-rad { display: flex; align-items: center; gap: 0.4rem; margin: 0.3rem 0 0.2rem; }
.foder-mood { width: 1.2rem; height: 1.2rem; flex: none; }
.foder-mood svg { display: block; width: 100%; height: 100%; }
.foder-tray .tray-item.foder-fav { outline: 2px solid var(--gron, #2e7d32); border-radius: 10px; }

@media (prefers-reduced-motion: reduce) {
  .room-pet .fdjur-gava,
  .foder-hjarta { animation: none; }
}

/* Laggårdens dörr – klick går in i interiören (samma känsla som #husgrupp). */
#laggard-dorr {
  cursor: pointer;
  transform-box: fill-box;
  transform-origin: 50% 85%;
  transition: transform 0.25s;
  outline: none;
}
#laggard-dorr:hover, #laggard-dorr:focus-visible { transform: scale(1.04); }

/* Odlingsbäddens slots (#329) – klickbara grödor/tomrutor i gårds-scenen.
   OBS: transform bär POSITIONEN (translate i scen-koordinater), så hover får
   inte skriva över den – lyft i stället grödan en aning via translate-tillägg. */
.odling-slot { cursor: pointer; outline: none; }
.odling-slot:hover &gt; *:not(rect), .odling-slot:focus-visible &gt; *:not(rect) { transform: translateY(-2px); }
/* Skördeklar gröda pulserar mjukt så den syns på håll. */
.odling-klar { animation: odling-klar-puls 1.6s ease-in-out infinite; }
@keyframes odling-klar-puls {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.82; }
}
@media (prefers-reduced-motion: reduce) {
  .odling-klar { animation: none; }
}

/* Rummets &quot;Gå ut&quot;-val (#328): liten popover-meny under ut-knappen, uppe till
   VÄNSTER – samma panel-känsla som verktygs-rullgardinen (.varld-verktyg-meny). */
.varld-ut-meny {
  pointer-events: auto;
  position: absolute;
  top: 58px;
  left: 12px;
  z-index: var(--z-meny);
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 200px;
  max-width: min(250px, 80vw);
  padding: 8px;
  background: rgba(255, 255, 255, 0.98);
  border: 2.5px solid #3b3350;
  border-radius: 16px;
  box-shadow: 4px 4px 0 rgba(59, 51, 80, 0.18);
  animation: verktyg-meny-in 0.12s ease;
}
.varld-ut-meny .varld-knapp {
  width: 100%;
  justify-content: flex-start;
  gap: 10px;
  border-color: transparent;
  border-radius: 12px;
  box-shadow: none;
  background: transparent;
}
.varld-ut-meny .varld-knapp:hover { transform: none; background: #f3eefe; }
.varld-ut-meny .varld-knapp:active { transform: translateY(1px); box-shadow: none; }
/* Etiketterna ska ALLTID synas i menyn (även på mobil där de annars göms). */
.varld-ut-meny .varld-knapp span { display: inline; }


/* ── src/styles/19-varld-by.css ── */
/* --- Klassbyn (by-nivån): hus längs en slingrande väg med dekor ------------ */
.varld-by { background: #a8da8f; }

/* Stämningsdekor (träd/granar/buskar/lyktstolpar, art-by-dekor.js): egna små
   SVG:er ankrade med bottenmitten på sin markpunkt (left/top i % av lagret,
   inline från varld-by-scen.js). Aldrig klickbara – klick ska alltid nå
   husen/tomterna bakom. */
.by-dekor {
  position: absolute;
  transform: translate(-50%, -100%);
  pointer-events: none;
}
.by-dekor &gt; svg {
  width: 100%;
  height: 100%;
  display: block;
}

.by-mark,
.omrade-mark {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  /* Låter gräs/himmel/väg som ritas UTANFÖR viewBoxen (0–100) svämma ut och fylla
     det full-bleed:ade staget sömlöst på desktop (#373). Staget klipper (overflow
     hidden) mot skärmkanten. På mobil ligger allt ändå inom scen-boxen. */
  overflow: visible;
}

/* En tomt = ett minihus + elevens avatar (husMini) med namnskylt under.
   left/top/width/height sätts inline av varld-by-scen.js utifrån byLayout
   (procent av lagret – samma koordinater som kamerans fokuspunkter). */
.by-tomt {
  position: absolute;
  transform: translate(-50%, -50%);
  cursor: pointer;
  outline: none;
}
.by-tomt &gt; svg {
  width: 100%;
  height: 100%;
  display: block;
  transition: transform 0.2s ease;
  transform-origin: 50% 90%;
}
.by-tomt:hover &gt; svg,
.by-tomt:focus-visible &gt; svg { transform: scale(1.06); }
.by-tomt:focus-visible { outline: 3px solid var(--lila, #7c5cd6); outline-offset: 4px; border-radius: 12px; }

.by-namn {
  position: absolute;
  top: calc(100% - 2px);
  left: 50%;
  transform: translateX(-50%);
  max-width: 150%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  background: rgba(255, 255, 255, 0.92);
  border: 2px solid rgba(59, 51, 80, 0.55);
  border-radius: 999px;
  padding: 1px 10px;
  font-weight: 800;
  font-size: 0.78rem;
  color: #3b3350;
}
.by-tomt.du .by-namn {
  background: var(--gron, #34a853);
  border-color: rgba(59, 51, 80, 0.55);
  color: #fff;
}

.by-du {
  position: absolute;
  top: -4px;
  left: 72%;
  background: var(--gron, #34a853);
  color: #fff;
  font-weight: 800;
  font-size: 0.8rem;
  padding: 2px 10px;
  border-radius: 999px;
  box-shadow: var(--skugga);
  transform: rotate(6deg);
  z-index: var(--z-scen-markor);
  pointer-events: none;
}

/* Låst kompis-hus: en liten hänglås-bricka på huset + huset tonas lätt så det
   syns att man inte kommer in just nu (klick öppnar .by-last-bubbla i stället). */
.by-tomt.last &gt; svg { filter: grayscale(0.35) brightness(0.97); }
.by-last-ikon {
  position: absolute;
  top: -2px;
  left: 68%;
  font-size: 0.95rem;
  z-index: var(--z-scen-markor);
  pointer-events: none;
  filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.35));
}

/* Vänlig pratbubbla ovanför ett låst hus (visas i byn, ingen navigering). Hänger
   ovanför tomt-noden och pekar ned mot huset; tonar in/ut via .show. */
.by-last-bubbla {
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translate(-50%, 6px);
  background: #fff;
  color: #3b3350;
  border: 2px solid rgba(59, 51, 80, 0.55);
  border-radius: 12px;
  padding: 6px 12px;
  font-weight: 800;
  font-size: 0.8rem;
  white-space: nowrap;
  box-shadow: var(--skugga-mjuk);
  opacity: 0;
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: var(--z-bubbla);
  pointer-events: none;
}
.by-last-bubbla::after {
  content: &quot;&quot;;
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 7px solid transparent;
  border-top-color: #fff;
  filter: drop-shadow(0 2px 0 rgba(59, 51, 80, 0.35));
}
.by-last-bubbla.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

@media (prefers-reduced-motion: reduce) {
  .by-last-bubbla { transition-duration: 0.01s; }
}

/* --- Klasscentret i byn (#480, klasscenter/kc-by.js) ----------------------- */
/* Rutan placeras av by-layouten (left = mitten, top = överkant, procent av
   lagret) och bottnar på samma marklinje som radens hus. Byggnaden ritas utan
   ambient (kc-by.js animera:false, #374); bara HTML-boxar transformeras. */
.by-klasscenter {
  position: absolute;
  transform: translateX(-50%);
  cursor: pointer;
  outline: none;
}
.by-klasscenter &gt; svg {
  width: 100%;
  height: 100%;
  display: block;
  transition: transform 0.2s ease;
  transform-origin: 50% 94%;
}
.by-klasscenter:hover &gt; svg,
.by-klasscenter:focus-visible &gt; svg { transform: scale(1.04); }
.by-klasscenter:focus-visible { outline: 3px solid var(--lila, #7c5cd6); outline-offset: 4px; border-radius: 12px; }
.by-klasscenter.kc-nyniva &gt; svg { animation: kc-nyniva 0.6s ease-out; }
@keyframes kc-nyniva { 0% { transform: scale(0.85); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }

/* Mätaren: diskret pill ovanför byggnaden (samma stil som .by-namn). Klick går
   igenom till byggnaden. Dold tills hovring/tangentbordsfokus (#484) – bara
   opacity/transform (kompositerbart, ingen layout, #374). Hovringen gäller bara
   enheter som KAN hovra: pekskärmar får &quot;fastnad&quot; :hover efter tryck, där tar
   bubblan över (kc-by.js medMatare). */
.kc-matare-plats {
  position: absolute;
  bottom: calc(100% + 4px);
  left: 50%;
  transform: translate(-50%, 6px);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s ease, transform 0.15s ease;
}
.by-klasscenter:focus-visible .kc-matare-plats { opacity: 1; transform: translate(-50%, 0); }
@media (hover: hover) {
  .by-klasscenter:hover .kc-matare-plats { opacity: 1; transform: translate(-50%, 0); }
}
.kc-matare {
  display: grid;
  justify-items: center;
  gap: 2px;
  min-width: 9.5rem;
  background: rgba(255, 255, 255, 0.92);
  border: 2px solid rgba(59, 51, 80, 0.55);
  border-radius: 12px;
  padding: 3px 10px 4px;
  color: #3b3350;
  font-size: 0.7rem;
  font-weight: 700;
  line-height: 1.15;
  white-space: nowrap;
  box-shadow: var(--skugga-mjuk);
}
.kc-matare-titel { font-size: 0.78rem; font-weight: 800; }
.kc-matare-bar {
  display: block;
  width: 100%;
  height: 6px;
  border-radius: 999px;
  background: rgba(59, 51, 80, 0.15);
  overflow: hidden;
}
.kc-matare-bar &gt; i { display: block; height: 100%; border-radius: inherit; background: var(--gron, #34a853); }
.kc-matare.max .kc-matare-bar &gt; i { background: linear-gradient(90deg, #8fd3ff, #c99bff, #ffd36b); }

/* Placeholder-bubblan vid klick (rummet byggs i epic 2) – .by-last-bubbla-familjen. */
.kc-bubbla {
  position: absolute;
  top: 30%;
  left: 50%;
  transform: translate(-50%, 6px);
  max-width: 18rem;
  background: #fff;
  color: #3b3350;
  border: 2px solid rgba(59, 51, 80, 0.55);
  border-radius: 12px;
  padding: 6px 12px;
  font-weight: 800;
  font-size: 0.8rem;
  text-align: center;
  box-shadow: var(--skugga-mjuk);
  opacity: 0;
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: var(--z-bubbla);
  pointer-events: none;
}
.kc-bubbla.show { opacity: 1; transform: translate(-50%, 0); }
/* Bubblan ersätter mätaren medan den visas (samma plats ovanför byggnaden). */
.by-klasscenter.kc-bubbla-oppen .kc-matare-plats { opacity: 0; }

@media (prefers-reduced-motion: reduce) {
  .kc-bubbla, .kc-matare-plats, .by-klasscenter &gt; svg { transition-duration: 0.01s; }
  .by-klasscenter.kc-nyniva &gt; svg { animation: none; }
}

/* --- Klasspoäng: stjärn-toggle uppe till höger (#klass-toggle-wrap) --------- */
/* Kompakt ✨-knapp i by-scenens högra hörn som fäller ut/in klassens stats-
   skylt; default infälld så byn inte skyms. Wrappen är ankaret (position:
   relative) som skylten hänger under, i samma anda som verktygs-rullgardinen. */
.varld-klass-toggle { position: relative; display: flex; justify-content: flex-end; }
/* (hidden döljs nu av den globala [hidden]-regeln trots display:flex ovan) */

/* Själva ✨-knappen ärver .varld-knapp; en gul touch + siffra gör den till en
   tydlig &quot;klasspoäng&quot;-pill. */
.varld-klass-stjarna {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.varld-klass-stjarna .ks-toggle-tal { font-weight: 800; }
.varld-klass-stjarna[aria-expanded=&quot;true&quot;] {
  background: #fff6d9;
  border-color: #ffb703;
}

/* Utfällbar &quot;byskylt&quot;: klassens gemensamma nivå + positiva totaler. Absolut
   under ✨-knappen (höger-ankrad), samma popover-känsla som verktygsmenyn. */
.varld-klass-stats {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  z-index: var(--z-meny);
  pointer-events: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  width: max-content;
  max-width: min(360px, 80vw);
  padding: 8px 16px;
  background: #fff;
  border: 3px solid #3b3350;
  border-radius: 16px;
  box-shadow: 4px 4px 0 rgba(59, 51, 80, 0.18);
  text-align: center;
  animation: verktyg-meny-in 0.12s ease;
}
/* (hidden döljs nu av den globala [hidden]-regeln trots display:flex ovan) */
.varld-klass-stats .ks-rubrik {
  font-weight: 800;
  font-size: 0.92rem;
  color: #3b3350;
}
.varld-klass-stats .ks-niva {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
}
.varld-klass-stats .ks-niva-badge {
  flex: 0 0 auto;
  background: var(--lila, #7c5cd6);
  color: #fff;
  font-weight: 800;
  font-size: 0.82rem;
  padding: 2px 10px;
  border-radius: 999px;
  white-space: nowrap;
}
.varld-klass-stats .ks-bar {
  flex: 1 1 auto;
  height: 12px;
  min-width: 70px;
  background: #ece7f6;
  border: 2px solid rgba(59, 51, 80, 0.55);
  border-radius: 999px;
  overflow: hidden;
}
.varld-klass-stats .ks-bar-fyll {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #ffd34d, #ffb703);
  border-radius: 999px;
  transition: width 0.5s ease;
}
.varld-klass-stats .ks-rad {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 14px;
}
.varld-klass-stats .ks-stat {
  font-weight: 700;
  font-size: 0.8rem;
  color: #3b3350;
  white-space: nowrap;
}
@media (prefers-reduced-motion: reduce) {
  .varld-klass-stats .ks-bar-fyll { transition: none; }
}
@media (max-width: 700px) {
  /* Tightare utfälld skylt på smala skärmar; den hänger fortsatt under ✨-knappen. */
  .varld-klass-stats { padding: 6px 12px; }
  .varld-klass-stats .ks-rubrik { font-size: 0.85rem; }
  /* Övriga knappar visar bara ikon på mobil, men ✨-siffran är hela poängen med
     togglen → behåll talet synligt. */
  .varld-klass-stjarna .ks-toggle-tal { display: inline; }
}

/* På by-nivån göms rums-/husverktygen (Måla om gäller det egna huset). */
.varld-stage[data-niva=&quot;by&quot;] .varld-knapp.bara-rum,
.varld-stage[data-niva=&quot;by&quot;] .varld-knapp.rum-och-hus,
.varld-stage[data-niva=&quot;by&quot;] .varld-knapp[data-panel=&quot;palett&quot;],
.varld-stage[data-niva=&quot;by&quot;] .varld-knapp[data-panel=&quot;hus&quot;] { display: none; }

/* På en KAMRATS hus (läs-vy) – och en ANNAN klass elevs hus (grannbyhus, #114) –
   göms alla scen-kontroller helt: man kan bara titta in i deras rum eller gå
   tillbaka. */
.varld-stage[data-niva=&quot;kompishus&quot;] .varld-verktyg,
.varld-stage[data-niva=&quot;grannbyhus&quot;] .varld-verktyg { display: none; }

/* På skol-/grannby-nivån (andra klassers byar) göms rums-/husverktygen – här
   tittar man bara på byar, inget att måla om eller pyssla med. */
.varld-stage[data-niva=&quot;skola&quot;] .varld-verktyg,
.varld-stage[data-niva=&quot;grannby&quot;] .varld-verktyg { display: none; }

/* --- Skol-nivån (områdesöversikt): en klass-by per klass ------------------- */
.varld-skola { background: #a8da8f; }
/* .omrade-mark delar layout + overflow:visible med .by-mark (definierat ovan). */

/* En klass-by-enhet: generisk by-silhuett + en namnskylt. left/top/width/height
   sätts inline av varld-omrade.js (procent av lagret – samma koordinater som
   kamerans fokuspunkter). */
.omrade-by {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  cursor: pointer;
  outline: none;
}
.omrade-by-hus {
  width: 100%;
  height: 76%;
  transition: transform 0.2s ease;
  transform-origin: 50% 90%;
}
.omrade-by:hover .omrade-by-hus,
.omrade-by:focus-visible .omrade-by-hus { transform: scale(1.06); }
.omrade-by:focus-visible {
  outline: 3px solid var(--lila, #7c5cd6);
  outline-offset: 4px;
  border-radius: 12px;
}
.omrade-by-hus &gt; svg { width: 100%; height: 100%; display: block; }

.omrade-by-namn {
  margin-top: 2px;
  max-width: 150%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  background: rgba(255, 255, 255, 0.92);
  border: 2px solid rgba(59, 51, 80, 0.55);
  border-radius: 999px;
  padding: 1px 10px;
  font-weight: 800;
  font-size: 0.78rem;
  color: #3b3350;
}
.omrade-by-namn b { color: var(--lila, #7c5cd6); }
.omrade-by.du .omrade-by-namn {
  background: var(--gron, #34a853);
  border-color: rgba(59, 51, 80, 0.55);
  color: #fff;
}
.omrade-by.du .omrade-by-namn b { color: #fff; }

/* --- Grannby-nivån (läs-vy av en annan klass by) -------------------------- */
/* Grannbyn ritas numera IDENTISKT med den egna klassbyn (#114): samma
   mountByScen → samma globala .by-mark/.by-tomt/.by-namn-stilar gäller här. Bara
   lagrets bakgrund behövs som egen regel. Grannby-hus-lagret (en annan klass
   elevs exteriör, läs-vy) ärver .varld-kompis-lagrets stilar. */
.varld-grannby { background: #a8da8f; }


/* ── src/styles/20-varld-ui.css ── */
/* --- Overlay-UI i spelvyn (integrerade scen-kontroller) -------------------- */
/* Själva overlay-skiktet släpper igenom pekare; bara knappar/paneler fångar. */
.varld-ui {
  position: absolute;
  inset: 0;
  z-index: var(--z-scen-ui);
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  padding: 12px;
  pointer-events: none;
}

.varld-ui-topp {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  /* På smala bredder får raden wrappa så knappar aldrig trängs/klipps. */
  flex-wrap: wrap;
}

.varld-titel {
  flex: 1 1 auto;
  text-align: center;
  font-weight: 800;
  font-size: 1.05rem;
  color: #3b3350;
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Verktygsraden är nu en enda rullgardin: bara triggern ligger inline, menyn
   fälls ut absolut under den (position: relative är ankaret). Samma UI på alla
   bredder – renast och mest konsekvent, och löser mobilträngseln direkt. */
.varld-verktyg { position: relative; display: flex; justify-content: flex-end; }

.varld-verktyg-trigger[aria-expanded=&quot;true&quot;] {
  background: #efe7ff;
  border-color: var(--lila, #7c5cd6);
}

/* Popover-menyn ärver .varld-panel-känslan (vit, mörk kant, rundat, skugga) så
   den ser ut som en del av husvärlden. */
.varld-verktyg-meny {
  pointer-events: auto;
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  z-index: var(--z-meny);
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 190px;
  max-width: min(240px, 80vw);
  padding: 8px;
  background: rgba(255, 255, 255, 0.98);
  border: 2.5px solid #3b3350;
  border-radius: 16px;
  box-shadow: 4px 4px 0 rgba(59, 51, 80, 0.18);
  animation: verktyg-meny-in 0.12s ease;
}
/* (display:flex ovan slog förr ut hidden – nu täcks det av den globala
   [hidden]{display:none!important}-regeln, så menyn startar stängd och JS:ens
   .hidden-växling fungerar utan en egen override.) */
@keyframes verktyg-meny-in {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Verktygsknapparna blir vänsterställda menyrader inne i menyn (behåller sina
   klasser/id:n – bara utseendet ändras här). */
.varld-verktyg-meny .varld-knapp {
  width: 100%;
  justify-content: flex-start;
  gap: 10px;
  border-color: transparent;
  border-radius: 12px;
  box-shadow: none;
  background: transparent;
}
.varld-verktyg-meny .varld-knapp:hover {
  transform: none;
  background: #f3eefe;
}
.varld-verktyg-meny .varld-knapp:active { transform: translateY(1px); box-shadow: none; }
.varld-verktyg-meny .varld-knapp.aktiv {
  background: #efe7ff;
  border-color: var(--lila, #7c5cd6);
}
/* Etiketterna ska ALLTID synas i menyn (även på mobil där de annars göms). */
.varld-verktyg-meny .varld-knapp span { display: inline; }

.varld-knapp {
  pointer-events: auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #fff;
  border: 2.5px solid #3b3350;
  border-radius: 999px;
  padding: 6px 14px;
  font: inherit;
  font-weight: 800;
  font-size: 14px;
  color: #3b3350;
  cursor: pointer;
  box-shadow: 3px 3px 0 rgba(59, 51, 80, 0.18);
  white-space: nowrap;
  transition: transform 0.12s ease, background 0.12s ease;
}
.varld-knapp:hover { transform: translateY(-1px); }
.varld-knapp:active { transform: translateY(1px); box-shadow: 1px 1px 0 rgba(59, 51, 80, 0.18); }
.varld-knapp.aktiv { background: #efe7ff; border-color: var(--lila, #7c5cd6); }
/* display:inline-flex ovan slår ut UA:s [hidden]-regel (samma specificitet, men
   författar-CSS vinner över UA-lagret) för .varld-knapp. Det täcks av den globala
   [hidden]{display:none!important}-regeln högst upp, så en knapp med hidden=true
   verkligen döljs. (Historiskt bet detta &quot;🔭 Andra byar&quot;, numera en skylt.) */

/* Möbler &amp; Mysterymat finns bara inne i rummet. Kläder (👗) visas även i
   ute-vyn (rum-och-hus) så avataren framför huset kan bytas om på plats. */
.varld-stage[data-niva=&quot;hus&quot;] .varld-knapp.bara-rum { display: none; }

/* Trädgården (🌳) finns bara UTE runt huset → dölj knappen inne i rummet
   (bara-hus, motsvarigheten till bara-rum). På by-/kompis-/skolnivåerna är hela
   verktygsmenyn redan dold, så en hus-vs-rum-regel räcker. */
.varld-stage[data-niva=&quot;rum&quot;] .varld-knapp.bara-hus { display: none; }

/* Flytande verktygspanel (Måla om / Möbler / Kläder) under knappraden. */
.varld-panel {
  position: relative;
  pointer-events: auto;
  margin-top: 10px;
  width: min(440px, 100%);
  max-height: min(52vh, 420px);
  max-height: min(52dvh, 420px);
  overflow-y: auto;
  background: rgba(255, 255, 255, 0.96);
  border: 2.5px solid #3b3350;
  border-radius: 16px;
  padding: 14px 16px;
  box-shadow: 4px 4px 0 rgba(59, 51, 80, 0.18);
}
.varld-panel h3 { margin: 0 0 6px; padding-right: 34px; }
.varld-panel .hint { margin-top: 0; }

/* ✕-knapp uppe till höger i varje panel – stänger panelen direkt. Ärver samma
   runda, diskreta look som modalens stängknapp (.cx-modal-close). */
.varld-panel-stang {
  position: absolute;
  top: 10px;
  right: 10px;
  border: none;
  background: #f0f4fb;
  color: var(--text-svag);
  width: 30px;
  height: 30px;
  border-radius: 50%;
  font-size: 0.95rem;
  line-height: 1;
  cursor: pointer;
}
.varld-panel-stang:hover { background: #e2ecfb; color: var(--bla-mork); }

/* Husdjurspanelen som overlay nere i scenen (matning/namn/nedräkning). */
.varld-petpanel {
  pointer-events: auto;
  position: absolute;
  left: 50%;
  bottom: 10px;
  transform: translateX(-50%);
  width: min(480px, 94%);
  max-height: 62%;
  overflow-y: auto;
  z-index: var(--z-panel);
}
.varld-petpanel:empty { pointer-events: none; }
.varld-petpanel .rum-pet-panel {
  margin: 0;
  border: 2.5px solid #3b3350;
  background: rgba(255, 255, 255, 0.97);
}

@media (max-width: 700px) {
  /* Mobil är AVSIKTLIGT oförändrad mot originalet (issue #373): kant-i-kant-
     tilläggen gäller bara desktop (&gt;700px). Scenen behåller sin gamla höjd så
     inget blir större eller luftigare än förr. */
  .varld-stage {
    height: clamp(380px, calc(100vh - 120px), 700px);
    height: clamp(380px, calc(100dvh - 120px), 700px);
  }
  /* RUMMET på mobil: scenen delas med ute-vyn, som fyller hela höjden (bra –
     rör vi inte). Men rummet ritar vägg + golv som FYLLER scenen, så på den
     smala telefonen (~360px bred × ~600–700px hög) blev rums-scenen extremt
     PORTRÄTT (aspect ~0.50 mot desktops ~1.75): en jättehög vägg, en tunn
     golv-remsa där alla möbler/djur trängdes högst upp, och ett stort tomt
     golv längst ner. Golv/vägg är procentbaserade så proportionen var i sig
     &quot;rätt&quot;, men den höga/smala aspekten gjorde rummet oanvändbart.
     Fix: cap:a BARA rums-scenens höjd (data-niva=&quot;rum&quot;) mot bredden så aspekten
     blir rums-lik (~0.77) – vägg och golv får normala proportioner och möbler/
     djur sprids över golvet i stället för att klumpa ihop sig. Ute-vyn (andra
     nivåer) behåller full höjd. min() väljer den lägre av den vanliga
     höjd-clampen och 116 % av viewport-bredden, så vi aldrig blir högre än
     tillgängligt utrymme på korta skärmar. Desktop/laptop (&gt; 700px) oförändrat. */
  .varld-stage[data-niva=&quot;rum&quot;] {
    height: min(clamp(380px, calc(100vh - 120px), 700px), 116vw);
    height: min(clamp(380px, calc(100dvh - 120px), 700px), 116vw);
  }
  .varld-knapp span { display: none; } /* bara ikoner på små skärmar */
  .varld-knapp { padding: 6px 11px; }  /* tightare så alla ikoner ryms på raden */
  .varld-titel { font-size: 0.95rem; }
  .varld-ui { padding: 8px; }          /* mer plats åt scenen/knappraden */
  .varld-panel { width: 100%; }        /* panelerna fyller bredden på mobil */

  /* Rums-sakernas storlek behöver INTE längre en egen mobil-skala: --rum-enhet
     följer nu scenbredden kontinuerligt (se .varld-lager.room-stage), så möbler,
     djur och avstånd skalar ihop vid varje bredd. Höjd-capen ovan bevaras dock –
     den håller golv/vägg-aspekten rums-lik på den smala telefonen. */
}

/* Den flytande världs-hinten (.hus-hint / #hint) är borttagen (#114) – scenen är
   tydlig nog utan den nedre info-remsan. */

/* Ambient: drivande moln, roterande solstrålar, skorstensrök */
.hus-moln { animation: hus-driva var(--t, 50s) linear infinite; }
@keyframes hus-driva { from { transform: translateX(-260px); } to { transform: translateX(1220px); } }
.hus-solstralar { transform-origin: 110px 86px; animation: hus-snurra 70s linear infinite; }
@keyframes hus-snurra { to { transform: rotate(360deg); } }
.hus-rok { animation: hus-puffa 4s ease-in infinite; opacity: 0; }
.hus-rok.r2 { animation-delay: 1.3s; }
.hus-rok.r3 { animation-delay: 2.6s; }
@keyframes hus-puffa {
  0% { opacity: 0; transform: translate(0, 0) scale(0.5); }
  25% { opacity: 0.8; }
  100% { opacity: 0; transform: translate(14px, -46px) scale(1.5); }
}

/* Klasscentret ambient (#478, art-klasscenter*.js): eld som fladdrar, fana som
   vajar, glitter, svävande kristaller, antennljus. Bara transform/opacity på
   ett fåtal grupper (kompositerbart, pausas av zoom-pausen precis som .hus-rok);
   röken återanvänder .hus-rok. Av med prefers-reduced-motion nedan. */
.kc-flamma, .kc-fana, .kc-glitter { transform-box: fill-box; }
.kc-flamma { transform-origin: 50% 100%; animation: kc-fladdra 0.9s ease-in-out infinite alternate; }
@keyframes kc-fladdra { from { transform: scale(1, 1); } to { transform: scale(0.94, 1.08); } }
.kc-fana { transform-origin: 0 50%; animation: kc-vaja 2.2s ease-in-out infinite alternate; }
@keyframes kc-vaja { from { transform: skewY(-5deg); } to { transform: skewY(4deg) scaleX(0.92); } }
.kc-glitter { transform-origin: 50% 50%; animation: kc-glittra 2.6s ease-in-out infinite; }
.kc-glitter.d2, .kc-svava.d2 { animation-delay: -0.9s; }
.kc-glitter.d3 { animation-delay: -1.7s; }
@keyframes kc-glittra { 0%, 100% { opacity: 0.25; transform: scale(0.6); } 50% { opacity: 1; transform: scale(1); } }
.kc-svava { animation: kc-svava 3.6s ease-in-out infinite alternate; }
@keyframes kc-svava { to { transform: translateY(-16px); } }
.kc-blink { animation: kc-blinka 1.6s steps(2, jump-none) infinite; }
@keyframes kc-blinka { from { opacity: 1; } to { opacity: 0.25; } }
/* Klasscentrum-föremålen (#487, art-klasscenter-inredning*.js): gungande krona/
   tofsar, fontänstråle + kaskader, fiskar och bubblor. Samma regel: EN grupp
   per rörelse, bara transform/opacity. */
.kc-pendel, .kc-vatten, .kc-fisk { transform-box: fill-box; }
.kc-pendel { transform-origin: 50% 0; animation: kc-pendla 3.2s ease-in-out infinite alternate; }
.kc-pendel.d2 { animation-delay: -1.6s; }
@keyframes kc-pendla { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }
.kc-vatten { transform-origin: 50% 100%; animation: kc-sprut 1.3s ease-in-out infinite alternate; }
@keyframes kc-sprut { to { transform: scale(0.96, 0.9); } }
.kc-kaskad { animation: kc-skimra 1.8s ease-in-out infinite alternate; }
@keyframes kc-skimra { from { opacity: 1; } to { opacity: 0.72; } }
.kc-fisk { animation: kc-simma 4.2s ease-in-out infinite alternate; }
.kc-fisk.d2 { animation-duration: 5.4s; animation-delay: -2s; }
.kc-fisk.d3 { animation-duration: 3.6s; animation-delay: -1s; }
@keyframes kc-simma { from { transform: translate(-10px, 2px); } to { transform: translate(10px, -3px); } }
.kc-bubbla { animation: kc-bubbla 2.8s ease-in infinite; }
.kc-bubbla.d2 { animation-delay: -1.4s; }
@keyframes kc-bubbla { 0% { transform: translateY(8px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-26px); opacity: 0; } }
/* Klasscentrets statistiktavla (#496, art-klasscenter-pokaler-mobler.js): &quot;klicka
   mig&quot;-affordans = glöd bakom ramen som andas + bricka som guppar. */
.kc-glod { animation: kc-glod 2.4s ease-in-out infinite alternate; }
@keyframes kc-glod { from { opacity: 0.25; } to { opacity: 1; } }
.kc-guppa { animation: kc-guppa 1.8s ease-in-out infinite alternate; }
@keyframes kc-guppa { from { transform: translateY(0); } to { transform: translateY(-3px); } }

@media (prefers-reduced-motion: reduce) {
  .hus-moln, .hus-solstralar, .hus-rok,
  .kc-flamma, .kc-fana, .kc-glitter, .kc-svava, .kc-blink,
  .kc-pendel, .kc-vatten, .kc-kaskad, .kc-fisk, .kc-bubbla, .kc-glod, .kc-guppa { animation: none; }
  .varld-lager, #husgrupp, #kompis-husgrupp, #klasskylt, #laggard-dorr, .by-tomt &gt; svg, .omrade-by-hus { transition-duration: 0.01s; }
}


/* ── src/styles/21-husdjur-rum.css ── */
/* --- Husdjur i Mitt rum ----------------------------------------------------- */
/* Äpplen på golvet (matning): ett litet emoji-äpple centrerat på sin procent-
   position. Inga pekhändelser (djuren äter dem – man drar dem inte), och de är
   inga .room-item så promenad-AI:n räknar dem inte som hinder. Ligger under
   husdjuren i DOM-ordningen så djuret syns ovanpå när det gnager. */
/* Placera-läge för Mysterymat: hela scenen får hårkors-pekare så det är tydligt
   att nästa klick lägger ut mat på golvet (knappen markeras via .aktiv). */
.room-stage.mat-placering,
.room-stage.mat-placering .room-item,
.room-stage.mat-placering .room-item * {
  cursor: crosshair;
}

/* I mat-läget går utlagd mat att PLOCKA UPP (#347): bara då får matbitarna
   pekhändelser (annars pointer-events: none, se .room-apple nedan) och en
   egen pekare så det syns att de är klickbara. */
.room-stage.mat-placering .room-apple {
  pointer-events: auto;
  cursor: pointer;
}

.room-apple {
  position: absolute;
  transform: translate(-50%, -50%);
  font-size: 1.5rem;
  line-height: 1;
  pointer-events: none;
  user-select: none;
  filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.25));
  animation: apple-pop 0.32s ease-out;
}
/* Äpplet skalar med scenbredden i husvärldens rum (som möbler/djur). */
.varld-lager.room-stage .room-apple { font-size: calc(1.5 * min(var(--rum-koeff, 2.5) * 1cqw, var(--rum-cap, 25px))); }
@keyframes apple-pop {
  from { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
  to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .room-apple { animation: none; }
}

/* Matnings-mätare i husdjurspanelen: fylls med antal uppätna äpplen i steget. */
.pet-matbar {
  position: relative;
  height: 22px;
  border-radius: 11px;
  background: #f3ead9;
  border: 2px solid #e2cfa8;
  overflow: hidden;
  margin: 6px auto 2px;
  max-width: 240px;
}
.pet-matbar-fyll {
  height: 100%;
  background: linear-gradient(90deg, #8fd18a, #5fbf62);
  transition: width 0.4s ease;
}
.pet-matbar-text {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  font-weight: 700;
  color: #3b3350;
}

/* Antal-rad på förbrukningsvaror (äpplen) i shoppen. */
.shop-antal {
  font-size: 0.8rem;
  color: #5b6b86;
  font-weight: 700;
  margin-bottom: 4px;
}

/* Husdjuren ritas i rumsscenen med samma .room-item-pipeline som sakerna, men
   med storlek per tillväxtsteg och en liten namnskylt under figuren. */

/* BAS-storlek (fasta rem) – används av den lilla READ-ONLY kompis-vyn
   (.room-stage utan container). I husvärldens rum skalas de om nedan. */
.room-pet .ri-emoji { width: 3.2rem; height: 3.2rem; }
.room-pet.pet-vuxen-2 .ri-emoji { width: 4.4rem; height: 4.4rem; }
.room-pet.pet-vuxen-3 .ri-emoji { width: 5.8rem; height: 5.8rem; }

/* Ägget i rummet: lite mindre + vaggar lugnt (samma keyframes som pet-sidan hade). */
.room-pet.pet-agg-i-rum .ri-emoji {
  width: 2.9rem;
  height: 2.9rem;
  animation: pet-wiggle 3.2s ease-in-out infinite;
  transform-origin: 50% 90%;
}

/* Husvärldens rum: husdjuren skalas med scenBREDDEN precis som möblerna, så de
   håller proportionerna och krymper/växer med scenen (se .varld-lager.room-stage).
   1cqw skrivs direkt här (Chromium resolvar cqw fel via en egen var). Faktisk
   bredd/höjd (calc, inte transform) → drag-clampen följer med. */
.varld-lager.room-stage .room-pet .ri-emoji { width: calc(3.2 * min(var(--rum-koeff, 2.5) * 1cqw, var(--rum-cap, 25px))); height: calc(3.2 * min(var(--rum-koeff, 2.5) * 1cqw, var(--rum-cap, 25px))); }
.varld-lager.room-stage .room-pet.pet-vuxen-2 .ri-emoji { width: calc(4.4 * min(var(--rum-koeff, 2.5) * 1cqw, var(--rum-cap, 25px))); height: calc(4.4 * min(var(--rum-koeff, 2.5) * 1cqw, var(--rum-cap, 25px))); }
.varld-lager.room-stage .room-pet.pet-vuxen-3 .ri-emoji { width: calc(5.8 * min(var(--rum-koeff, 2.5) * 1cqw, var(--rum-cap, 25px))); height: calc(5.8 * min(var(--rum-koeff, 2.5) * 1cqw, var(--rum-cap, 25px))); }
.varld-lager.room-stage .room-pet.pet-agg-i-rum .ri-emoji { width: calc(2.9 * min(var(--rum-koeff, 2.5) * 1cqw, var(--rum-cap, 25px))); height: calc(2.9 * min(var(--rum-koeff, 2.5) * 1cqw, var(--rum-cap, 25px))); }

.room-pet .rp-namn {
  display: block;
  margin-top: 2px;
  text-align: center;
  font-size: 0.72rem;
  font-weight: 800;
  color: #3c4a63;
  background: rgba(255, 255, 255, 0.85);
  border-radius: 8px;
  padding: 1px 6px;
  pointer-events: none;
  white-space: nowrap;
  max-width: 9rem;
  overflow: hidden;
  text-overflow: ellipsis;
}

.room-pet .rp-namn.rp-agg { color: #8a6d3b; }

/* Namn-etiketten som döpnings-/panel-affordans: klickbar (till skillnad från den
   generella pointer-events:none-etiketten). Öppnar inline-namnfältet/panelen –
   samma för mystery-djur och vanliga djur. rp-namn-edit visar dessutom en liten
   ✏️-hint (BARA innan djuret döpts); rp-namn-tap är samma klickbara etikett utan
   den permanenta pennan (för ett redan namngivet djur). */
.room-pet .rp-namn.rp-namn-edit,
.room-pet .rp-namn.rp-namn-tap {
  pointer-events: auto;
  cursor: pointer;
}
.room-pet .rp-namn.rp-namn-edit::after {
  content: &quot; ✏️&quot;;
  font-size: 0.82em;
  opacity: 0.5;
}
.room-pet .rp-namn.rp-namn-edit:hover,
.room-pet .rp-namn.rp-namn-tap:hover {
  background: #fff;
  box-shadow: 0 1px 5px rgba(0, 0, 0, 0.2);
}
.room-pet .rp-namn.rp-namn-edit:hover::after { opacity: 0.9; }

/* Promenad-AI (rum-promenad.js): mjukt tassande medan djuret går, och figuren
   speglas när det går åt vänster. Klasserna sätts/tas bort av rAF-loopen. */
.room-pet.promenerar .ri-emoji {
  animation: pet-tassa 0.55s ease-in-out infinite;
  transform-origin: 50% 100%;
}

.room-pet.vand-vanster .ri-emoji svg { transform: scaleX(-1); }

@keyframes pet-tassa {
  0%, 100% { transform: translateY(0) rotate(-1.2deg); }
  50% { transform: translateY(-7%) rotate(1.2deg); }
}

/* Klick-lek: djuret lägger sig på rygg, sprattlar och reser sig igen.
   Tajming från design-facit: 700 ms flip + 2600 ms sprattel + 550 ms upp
   (totalt 3,85 s → flip klar vid ~18 %, sprattel till ~86 %). */
.room-pet.pet-rygg .ri-emoji {
  animation: pet-rygg 3.85s ease-in-out both;
  transform-origin: 50% 62%;
}

@keyframes pet-rygg {
  0% { transform: rotate(0); }
  11% { transform: rotate(178deg); }   /* liten studs över… */
  18% { transform: rotate(157deg); }   /* …och landar på rygg */
  30% { transform: rotate(166deg); }
  42% { transform: rotate(149deg); }   /* sprattel fram och tillbaka */
  54% { transform: rotate(166deg); }
  66% { transform: rotate(149deg); }
  78% { transform: rotate(163deg); }
  86% { transform: rotate(157deg); }
  100% { transform: rotate(0); }       /* reser sig */
}

/* Hjärtan som bubblar upp medan djuret ligger och sprattlar. */
.pet-rygg-fx {
  position: absolute;
  left: 50%;
  top: -4px;
  pointer-events: none;
  font-size: 1.05rem;
  opacity: 0;
  animation: pet-rygg-fx 1.28s ease-out 3;
}

@keyframes pet-rygg-fx {
  0% { opacity: 0; transform: translate(-50%, 2px) scale(0.6); }
  25% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -26px) scale(1.35); }
}

/* Klick-klapp för de vanliga (fast-storleks-)djuren: ett kort glädjeskutt i
   stället för rygg-lek (de lägger sig inte på rygg). Gullig, ~0,9 s, med
   hjärtan – i samma anda som petBellyFlop men utan vändningen. */
.room-pet.pet-klapp .ri-emoji {
  animation: pet-klapp 0.9s ease-in-out both;
  transform-origin: 50% 100%;
}

@keyframes pet-klapp {
  0% { transform: translateY(0) scale(1, 1); }
  20% { transform: translateY(0) scale(1.12, 0.88); }   /* laddar – trycks ihop */
  45% { transform: translateY(-22%) scale(0.92, 1.1); } /* studsar upp, sträcks */
  62% { transform: translateY(0) scale(1.06, 0.96); }   /* landar mjukt */
  80% { transform: translateY(-7%) scale(1, 1); }        /* liten extrastuds */
  100% { transform: translateY(0) scale(1, 1); }
}

/* Hjärtan vid klick-klappen (en kort puff, till skillnad från rygg-lekens 3). */
.pet-klapp-fx {
  position: absolute;
  left: 50%;
  top: -4px;
  pointer-events: none;
  font-size: 1.05rem;
  opacity: 0;
  animation: pet-rygg-fx 0.9s ease-out both;
}

@media (prefers-reduced-motion: reduce) {
  .room-pet.promenerar .ri-emoji { animation: none; }
  .room-pet.pet-rygg .ri-emoji,
  .room-pet.pet-rygg .ri-emoji:has(.pet-sprite),
  .room-pet.pet-klapp .ri-emoji,
  .pet-rygg-fx,
  .pet-klapp-fx,
  .room-pet.pet-agg-i-rum .ri-emoji {
    animation: none;
  }
}

/* --- Sprite-riggade husdjur (art-pet-sprites.js) ---------------------------- */
/* Figuren monteras av 6 absolut positionerade bilddelar i en procent-rigg
   (referensyta 340×360). Positioner/storlekar sätts inline per art &amp; steg;
   här bor rotationspunkter och animationer. Samma yttre klasser som SVG-djuren
   (.promenerar, .pet-rygg, .vand-vanster) styr vilka del-animationer som går. */

.pet-sprite {
  position: relative;
  display: block;
  height: 100%;
  aspect-ratio: 340 / 360;
  margin: 0 auto;
  pointer-events: none;
}

.pet-sprite .ps-del {
  position: absolute;
  display: block;
  pointer-events: none;
}

.pet-sprite .ps-del img {
  display: block;
  width: 100%;
  height: auto;
}

/* Självmätande rigg: medan delarnas PNG-mått läses (art-pet-sprites.js) saknar
   delarna position – håll dem dolda och tona in dem på plats när måtten finns,
   så det aldrig syns någon layout-&quot;pop&quot;. Containern har fast aspect-ratio, så
   den yttre ytan är stabil redan innan delarna målas. */
.pet-sprite .ps-del { transition: opacity 0.28s ease; }
.pet-sprite.ps-laddar .ps-del { opacity: 0; }

/* Rotationspunkter (designdoket): nacke 50 %/80 %, kropp 50 %/92 %,
   höft = fotens topp 50 %/10 %. De här arternas armar hänger lodrätt
   (tassen nedåt), så axeln sitter i armens topp – inte i inre änden. */
.pet-sprite .ps-huvud { transform-origin: 50% 80%; }
.pet-sprite .ps-kropp { transform-origin: 50% 92%; }
.pet-sprite .ps-arm-v,
.pet-sprite .ps-arm-h { transform-origin: 50% 12%; }
.pet-sprite .ps-fot-v,
.pet-sprite .ps-fot-h { transform-origin: 50% 10%; }

/* Viloläge: armarna hänger med en lätt utåtvinkel. */
.pet-sprite .ps-arm-v { transform: rotate(-6deg); }
.pet-sprite .ps-arm-h { transform: rotate(6deg); }

/* Spegling när djuret går åt vänster (hela riggen – delarna följer med). */
.room-pet.vand-vanster .ri-emoji .pet-sprite { transform: scaleX(-1); }

/* Ingen blinkning: ögonen är inbakade i 00-head.png och sitter olika per art
   och steg (Fjärlis två ögon, Flammis slutform ett öga), så en ren ögon-enda
   blink går inte att göra snyggt för alla arter/steg. En helhuvud-squash såg
   inte bra ut → blinken är slopad (hellre ingen blink än att huvudet studsar). */

/* Vila: kroppen andas lugnt, huvudet tittar runt, armarna svajar. */
.room-pet .pet-sprite .ps-kropp { animation: ps-andas 3.4s ease-in-out infinite; }
@keyframes ps-andas {
  0%, 100% { transform: scaleY(1); }
  50% { transform: scaleY(1.025); }
}

.room-pet .pet-sprite .ps-huvud { animation: ps-funder 4.6s ease-in-out infinite; }
@keyframes ps-funder {
  0%, 100% { transform: rotate(0); }
  30% { transform: rotate(-3deg); }
  60% { transform: rotate(2.4deg); }
}

.room-pet .pet-sprite .ps-arm-v { animation: ps-svaj-v 3.4s ease-in-out infinite; }
@keyframes ps-svaj-v {
  0%, 100% { transform: rotate(-6deg); }
  50% { transform: rotate(-11deg); }
}

.room-pet .pet-sprite .ps-arm-h { animation: ps-svaj-h 3.4s ease-in-out infinite; }
@keyframes ps-svaj-h {
  0%, 100% { transform: rotate(6deg); }
  50% { transform: rotate(11deg); }
}

/* Gång (promenad-AI:ns .promenerar): bensteg + armpendling i motfas + huvudnick.
   Kroppsgunget sköter pet-tassa på .ri-emoji (samma som SVG-djuren). */
.room-pet.promenerar .pet-sprite .ps-fot-v { animation: ps-steg 0.5s ease-in-out infinite; }
.room-pet.promenerar .pet-sprite .ps-fot-h { animation: ps-steg 0.5s ease-in-out infinite -0.25s; }
@keyframes ps-steg {
  0%, 100% { transform: rotate(14deg); }
  50% { transform: rotate(-14deg); }
}

.room-pet.promenerar .pet-sprite .ps-arm-v { animation: ps-sving-v 0.5s ease-in-out infinite; }
@keyframes ps-sving-v {
  0%, 100% { transform: rotate(-18deg); }
  50% { transform: rotate(6deg); }
}

.room-pet.promenerar .pet-sprite .ps-arm-h { animation: ps-sving-h 0.5s ease-in-out infinite; }
@keyframes ps-sving-h {
  0%, 100% { transform: rotate(18deg); }
  50% { transform: rotate(-6deg); }
}

.room-pet.promenerar .pet-sprite .ps-huvud { animation: ps-nick 0.5s ease-in-out infinite; }
@keyframes ps-nick {
  0%, 100% { transform: translateY(0) rotate(-1.6deg); }
  50% { transform: translateY(2.5%) rotate(1.6deg); }
}

/* På rygg (klick-leken): SVG-djurens 157°-rotation läser inte som &quot;ligger på
   rygg&quot; för sprite-riggen (den ser mest tiltad ut). Sprite-riggen rullar i
   stället HELA vägen över till mage upp (~180°) så det tydligt syns att djuret
   ligger på rygg, vaggar där, och reser sig igen. Högre specificitet än den
   generella .ri-emoji-regeln (via :has) → vinner för sprite-arter. */
.room-pet.pet-rygg .ri-emoji:has(.pet-sprite) {
  animation: pet-rygg-sprite 3.85s ease-in-out both;
  transform-origin: 50% 68%;
}

@keyframes pet-rygg-sprite {
  0% { transform: rotate(0); }
  14% { transform: rotate(192deg); }   /* rullar över kanten… */
  20% { transform: rotate(180deg); }   /* …och landar på rygg, mage upp */
  32% { transform: rotate(171deg); }
  44% { transform: rotate(189deg); }   /* vaggar fram och tillbaka på ryggen */
  56% { transform: rotate(171deg); }
  68% { transform: rotate(187deg); }
  80% { transform: rotate(177deg); }
  88% { transform: rotate(180deg); }
  100% { transform: rotate(0); }        /* reser sig igen */
}

/* Ben och armar sprattlar dessutom i motfas (designdoket: 0,32 s / 0,4 s)
   medan djuret ligger på rygg. */
.room-pet.pet-rygg .pet-sprite .ps-fot-v { animation: ps-sprattel-fot 0.32s ease-in-out infinite; }
.room-pet.pet-rygg .pet-sprite .ps-fot-h { animation: ps-sprattel-fot 0.32s ease-in-out infinite -0.16s; }
@keyframes ps-sprattel-fot {
  0%, 100% { transform: rotate(12deg); }
  50% { transform: rotate(-16deg); }
}

.room-pet.pet-rygg .pet-sprite .ps-arm-v { animation: ps-sprattel-arm-v 0.4s ease-in-out infinite; }
@keyframes ps-sprattel-arm-v {
  0%, 100% { transform: rotate(-20deg); }
  50% { transform: rotate(8deg); }
}

.room-pet.pet-rygg .pet-sprite .ps-arm-h { animation: ps-sprattel-arm-h 0.4s ease-in-out infinite -0.2s; }
@keyframes ps-sprattel-arm-h {
  0%, 100% { transform: rotate(20deg); }
  50% { transform: rotate(-8deg); }
}

/* Humör-partikel (💤/❤️/🍎) – svävar stilla vid huvudet. */
.pet-sprite .ps-humor {
  position: absolute;
  top: -4%;
  right: -12%;
  font-size: 0.95rem;
  line-height: 1;
  animation: ps-humor-svav 2.4s ease-in-out infinite;
}

@keyframes ps-humor-svav {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-14%); }
}

@media (prefers-reduced-motion: reduce) {
  .pet-sprite .ps-del,
  .pet-sprite .ps-del img,
  .pet-sprite .ps-humor {
    animation: none !important;
  }
  .pet-sprite .ps-del { transition: none; }
}

/* Husdjurspanelen under rumsscenen. */

/* ==========================================================================
   Inloggningskort – utskriftsvänlig A4-vy (teacher-login-print.js)
   Skärm: kort i rutnät. Utskrift: 2 × 4 kort per A4 med streckade klipplinjer.
   ========================================================================== */
.login-cards-overlay {
  position: fixed;
  inset: 0;
  z-index: var(--z-modal);
  background: #eef3fb;
  overflow: auto;
  padding: 20px clamp(16px, 4vw, 40px) 40px;
}
.lc-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 4px;
}
.lc-title { margin: 0; font-size: 1.25rem; }
.lc-hint { color: var(--text-svag); margin: 0 0 16px; }

.login-cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
}
/* Korten är fysiska utdelningskort: alltid ljusa, även i lärarens mörka tema. */
.login-card {
  border: 2px dashed #b9c9e6;
  border-radius: 14px;
  background: #fff;
  color: #1f2a44;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.login-card .lc-head { display: flex; align-items: center; gap: 8px; }
.login-card .lc-logo { font-size: 1.7rem; line-height: 0; }
.login-card .lc-app { font-weight: 800; font-size: 1.05rem; color: #3b3350; letter-spacing: 0.2px; }
.login-card .lc-class {
  margin-left: auto;
  font-size: 0.8rem;
  font-weight: 700;
  color: #5a6c96;
  background: #eef3fb;
  border-radius: 999px;
  padding: 2px 10px;
}
.login-card .lc-name { font-size: 1.3rem; font-weight: 800; line-height: 1.2; }
.login-card .lc-field {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  border-top: 1px solid #eef2f8;
  padding-top: 7px;
}
.login-card .lc-label { color: #5b6b82; font-size: 0.9rem; }
.login-card .lc-value {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-weight: 700;
  font-size: 1.15rem;
  letter-spacing: 0.5px;
}
.login-card .lc-blank {
  flex: 1;
  max-width: 60%;
  border-bottom: 1.5px solid #1f2a44;
  min-height: 1.2em;
}
.login-card .lc-url {
  margin-top: 3px;
  text-align: center;
  font-size: 1rem;
  color: #3b3350;
  background: #fff8e1;
  border: 1px solid #f7c948;
  border-radius: 10px;
  padding: 5px 8px;
}
.login-card .lc-url b { font-size: 1.2rem; letter-spacing: 0.3px; }

@media print {
  @page { size: A4 portrait; margin: 10mm; }
  /* Dölj all app-chrome; visa bara korten. */
  body &gt; *:not(.login-cards-overlay) { display: none !important; }
  .login-cards-overlay,
  .teacher-dark.login-cards-overlay {
    position: static;
    padding: 0;
    background: #fff;
    overflow: visible;
  }
  .lc-toolbar,
  .lc-hint { display: none !important; }
  /* 2 kolumner × 4 rader = 8 kort per sida; delade streckade kanter = klipplinjer. */
  .login-cards-grid { grid-template-columns: 1fr 1fr; gap: 0; }
  .login-card {
    box-sizing: border-box;
    height: 69mm;
    page-break-inside: avoid;
    break-inside: avoid;
    border: 1px dashed #888;
    border-radius: 0;
    margin: 0;
    padding: 6mm 7mm;
    justify-content: center;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
}

/* ── src/styles/23-mysterybox.css ── */
/* ============================================================================
   Mysterybox – kategori-hint i shoppen + öppnings-/reveal-modal
   (pages-shop.js, pages-shop-mystery.js)
   ========================================================================== */
.shop-cat-hint {
  margin: -2px 0 10px;
  max-width: 640px;
}

/* Overlay-backdrop (samma känsla som cx-modal-overlay). */
.mb-overlay {
  position: fixed;
  inset: 0;
  z-index: var(--z-modal);
  background: rgba(20, 30, 50, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px 14px;
  animation: cx-fade 0.14s ease;
}

.mb-modal {
  position: relative;
  background: #fff;
  border-radius: 22px;
  width: 100%;
  max-width: 380px;
  padding: 26px 22px 24px;
  box-shadow: 0 18px 50px rgba(20, 30, 50, 0.3);
  text-align: center;
}

.mb-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 240px;
  justify-content: center;
}

/* Presentboxen som skakar och sedan poppar bort. */
.mb-box {
  width: 150px;
  height: 150px;
}
.mb-box svg { width: 100%; height: 100%; }
.mb-box.shake { animation: mb-shake 0.5s ease-in-out infinite; transform-origin: 50% 80%; }
.mb-box.burst { animation: mb-burst 0.35s ease forwards; }

@keyframes mb-shake {
  0%, 100% { transform: rotate(0deg) translateY(0); }
  20% { transform: rotate(-7deg) translateY(-3px); }
  40% { transform: rotate(6deg) translateY(0); }
  60% { transform: rotate(-5deg) translateY(-2px); }
  80% { transform: rotate(4deg) translateY(0); }
}
@keyframes mb-burst {
  0% { transform: scale(1); opacity: 1; }
  40% { transform: scale(1.25) rotate(4deg); opacity: 1; }
  100% { transform: scale(0.2); opacity: 0; }
}

/* Reveal-kortet (saken som vunnits). */
.mb-reveal { animation: mb-pop 0.4s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
@keyframes mb-pop {
  0% { transform: scale(0.4); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.mb-rarity {
  margin: 0 0 8px;
  font-weight: 800;
  font-size: 0.95rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--rar, #7FC7E8);
}

.mb-card {
  width: 150px;
  height: 150px;
  margin: 0 auto;
  border-radius: 20px;
  border: 4px solid var(--rar, #7FC7E8);
  background: #f8fbff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 20px color-mix(in srgb, var(--rar, #7FC7E8) 40%, transparent);
}
.mb-art { width: 78%; height: 78%; display: flex; align-items: center; justify-content: center; }
.mb-art svg { width: 100%; height: 100%; }
.mb-art .mb-hus { width: 100%; height: 100%; }
.mb-art .mb-hus svg { width: 100%; height: 100%; }

.mb-name { margin: 12px 0 4px; font-size: 1.3rem; font-weight: 800; color: var(--bla-mork); }
.mb-got { margin: 0 0 16px; color: var(--text-svag); font-size: 0.92rem; }
.mb-ok { min-width: 130px; }


/* ── src/styles/24-innehallsstudion.css ── */
/* ==========================================================================
   Innehållsstudion (lärarsidan #/larare/innehall) – issue #303
   Bibliotek (kort + ämnesflikar) + fokuserad kompositör (overlay). Lugn ton,
   teal-accent (per godkänd mockup). Återanvänder appens paneler/knappar/fält.
   ========================================================================== */
.studio {
  --teal: #0e9c92;
  --teal-mork: #0a7c74;
  --teal-ljus: #e6f6f4;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Verktygsrad: ämnesflikar + åtgärder */
.studio-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  padding: 12px 14px;
}
.studio-subject-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.subject-tab {
  border: 2px solid #e2ecfb;
  background: #fbfdff;
  color: var(--text);
  font-family: var(--font);
  font-weight: 700;
  font-size: 0.95rem;
  padding: 8px 14px;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
}
.subject-tab:hover { border-color: var(--teal); }
.subject-tab.active {
  background: var(--teal-ljus);
  border-color: var(--teal);
  color: var(--teal-mork);
}
.studio-toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.studio-lib-controls {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
  padding: 0 4px;
  color: var(--text-svag);
}

/* Biblioteks-korten (lärartabellen ersatte dem i #441; .area-card används
   fortfarande av elevsidans områdesknappar i pages-elev.js – rör ej) */
.area-cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}
.area-card-wrap { display: flex; flex-direction: column; gap: 8px; }
.area-card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px;
  border: 2px solid #e2ecfb;
  border-radius: 16px;
  background: var(--panel);
  box-shadow: var(--skugga-mjuk);
  cursor: pointer;
  transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
}
.area-card:hover { transform: translateY(-2px); border-color: var(--teal); }
.area-card:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.area-card-top { display: flex; align-items: flex-start; gap: 12px; }
.area-card-emoji { font-size: 2rem; line-height: 1; }
.area-card-meta { flex: 1; min-width: 0; }
.area-card-name { font-weight: 800; font-size: 1.08rem; color: var(--text); }
.area-card-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.area-card .type-badge { background: var(--teal-ljus); color: var(--teal-mork); }
.area-card-count { color: var(--text-svag); font-size: 0.9rem; font-weight: 600; }
.area-card-actions { flex-wrap: wrap; gap: 6px; }
/* Åtgärdsknapparna ska inte &quot;öppna kortet&quot; – de stoppar klicket i JS. */
.area-card-actions .btn { pointer-events: auto; }

/* Innehållsstudion som ETT kort (issue #453, Elias koncept; tabellen från #441):
   sidhuvud → understruken ämnesflikrad → verktygsrad → tabell i egen inramad
   behållare. Samma mörka tema/tokens – bara strukturen är ny. Bara lärarsidan. */
.teacher-dark .studio-card {
  background: var(--t-raised);
  border: 1px solid var(--t-border);
  border-radius: 18px;
  box-shadow: var(--t-shadow);
  padding: 22px 24px 24px;
}
.teacher-dark .studio-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.teacher-dark .studio-head .teacher-page-ic { width: 44px; height: 44px; border-radius: 12px; }
.teacher-dark .studio-head-txt { min-width: 0; }
.teacher-dark .studio-title { margin: 0; font-size: 1.4rem; font-weight: 700; line-height: 1.2; color: var(--t-text); }
.teacher-dark .studio-sub { margin: 3px 0 0; font-size: 0.92rem; color: var(--t-muted); }

/* Ämnesflikar: understruken flikrad med färgprick; &quot;+ Nytt ämne&quot; streckad sist. */
.teacher-dark .studio-tabs-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px 18px;
  border-bottom: 1px solid var(--t-border);
}
.teacher-dark .studio-subject-tabs { display: flex; flex-wrap: wrap; gap: 0 22px; }
.teacher-dark .subject-tab {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: -1px;
  padding: 10px 2px 11px;
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  border-radius: 0;
  color: var(--t-muted);
  font-size: 0.95rem;
  font-weight: 600;
}
.teacher-dark .subject-tab:hover { background: none; color: var(--t-text); }
.teacher-dark .subject-tab.active { background: none; color: var(--t-accent); border-bottom-color: var(--t-accent); }
.teacher-dark .subject-tab:focus-visible { outline: 2px solid var(--t-accent); outline-offset: 2px; border-radius: 4px; }
.teacher-dark .subject-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.teacher-dark .studio-new-subject {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin: 6px 0;
  padding: 4px 10px;
  background: transparent;
  border: 1px dashed var(--t-border-strong);
  border-radius: 8px;
  color: var(--t-muted);
  font: inherit;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: color 0.12s, border-color 0.12s;
}
.teacher-dark .studio-new-subject:hover { color: var(--t-accent); border-color: var(--t-accent); }
.teacher-dark .studio-new-subject:focus-visible { outline: 2px solid var(--t-accent); outline-offset: 2px; }
.teacher-dark #new-subject-form:not(:empty) { margin-top: 14px; }

/* Verktygsrad: Visa årskurs till vänster, &quot;+ Skapa nytt område&quot; till höger. */
.teacher-dark .studio-lib-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  padding: 16px 0;
  color: var(--t-muted);
}
.teacher-dark .studio-grade-filter { display: inline-flex; align-items: center; gap: 8px; font-size: 0.92rem; }
.teacher-dark .studio-lib-controls #create-new { padding: 9px 18px; font-size: 1rem; }
.teacher-dark .studio-grade-filter .select { padding: 7px 12px; font-size: 0.92rem; border-width: 1px; border-radius: 10px; min-width: 150px; }

/* Tabellen i egen rundad, inramad behållare; scrollar horisontellt vid behov. */
.teacher-dark .area-table-scroll {
  background: var(--t-surface);
  border: 1px solid var(--t-border);
  border-radius: 14px;
}
.teacher-dark .area-tbl { width: 100%; min-width: 760px; border-collapse: collapse; font-size: 0.95rem; }
.teacher-dark .area-tbl thead { background: var(--t-surface-2); }
.teacher-dark .area-tbl th {
  text-align: left;
  font-size: 0.74rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--t-muted);
  padding: 12px 16px;
  border-bottom: 1px solid var(--t-border);

}
.teacher-dark .area-tbl th.sorted { color: var(--t-text); }
.teacher-dark .area-tbl td { padding: 16px; vertical-align: middle; border-bottom: 1px solid var(--t-border); }
.teacher-dark .area-tbl tbody tr:last-child &gt; td { border-bottom: 0; }
.teacher-dark .area-tbl .th-sort {
  all: unset;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 6px;
}
.teacher-dark .area-tbl .th-sort:focus-visible { outline: 2px solid var(--t-accent); outline-offset: 2px; }
.teacher-dark .area-tbl .sort-ind { font-size: 0.62rem; opacity: 0.35; }
.teacher-dark .area-tbl th.sorted .sort-ind { opacity: 0.9; color: var(--t-accent); }
.teacher-dark .area-tbl-row { cursor: pointer; transition: background 0.12s; }
.teacher-dark .area-tbl-row:hover td { background: rgba(255, 255, 255, 0.025); }
.teacher-dark .area-tbl-row:focus-visible { outline: 2px solid var(--t-accent); outline-offset: -2px; }
.teacher-dark .area-tbl-name { font-weight: 700; white-space: nowrap; color: var(--t-text); }
.teacher-dark .area-tbl-emoji { font-size: 1.25rem; margin-right: 10px; vertical-align: -2px; }
.teacher-dark .area-tbl-grade { white-space: nowrap; color: var(--t-text); }
.teacher-dark .area-tbl-count { color: var(--t-muted); font-size: 0.86rem; }
.teacher-dark .area-tbl-badges { display: flex; gap: 6px; flex-wrap: wrap; }
.teacher-dark .area-tbl-badges .type-badge {
  background: transparent;
  border: 1px solid rgba(46, 193, 110, 0.5);
  border-radius: 6px;
  padding: 2px 8px;
  color: #7fe0a8;
  font-size: 0.76rem;
  font-weight: 600;
}
.teacher-dark .area-tbl th.area-tbl-actions-h { text-align: right; }
.teacher-dark .area-tbl-actions { display: flex; gap: 2px; justify-content: flex-end; flex-wrap: nowrap; }
/* Åtgärder: rena ikonknappar utan boxad bakgrund, hover-ton. */
.teacher-dark .area-act {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 0;
  background: transparent;
  border: 0;
  border-radius: 8px;
  color: var(--t-muted);
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
}
.teacher-dark .area-act:hover { background: rgba(255, 255, 255, 0.07); color: var(--t-text); }
.teacher-dark .area-act:focus-visible { outline: 2px solid var(--t-accent); outline-offset: 1px; }
.teacher-dark .area-act.active { background: var(--t-accent-soft); color: var(--t-accent); }
.teacher-dark .area-act.danger { color: #c48f8f; }
.teacher-dark .area-act.danger:hover { background: rgba(235, 87, 87, 0.12); color: #ff9d9d; }
.teacher-dark .area-expand-row &gt; td { padding: 4px 16px 16px; background: var(--t-surface-2); }

/* Lägg till-panelen (#453): AI-prompt för mer innehåll överst. */
.teacher-dark .merge-ai {
  margin-bottom: 16px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--t-border);
}
.teacher-dark .merge-ai-row { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 10px 12px; }
.teacher-dark .merge-wish {
  display: flex;
  flex: 1 1 260px;
  flex-direction: column;
  gap: 5px;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--t-muted);
}
.teacher-dark .merge-wish { min-width: 0; }
.teacher-dark .merge-wish input { box-sizing: border-box; width: 100%; min-width: 0; padding: 10px 12px; font: inherit; font-size: 0.95rem; }
.teacher-dark .merge-copy { flex: none; max-width: 100%; white-space: normal; text-align: left; }
.teacher-dark .merge-instr { margin: 10px 0 0; font-size: 0.9rem; color: var(--t-text); }

/* Smal skärm (#449 F4, stil #453): varje rad blir ett litet kort i två kolumner –
   namn | årskurs, innehåll över hela bredden, omfattning | åtgärder – så Åtgärder
   syns utan sidscroll. Sorteringsrubrikerna (Område/Årskurs) står kvar. */
@media (max-width: 640px) {
  .teacher-dark .studio-card { padding: 16px 14px 18px; border-radius: 16px; }
  .teacher-dark .studio-head { margin-bottom: 12px; }
  .teacher-dark .studio-title { font-size: 1.2rem; }
  .teacher-dark .studio-lib-controls #create-new { flex: 1 1 auto; justify-content: center; }
  .teacher-dark .area-tbl,
  .teacher-dark .area-tbl thead,
  .teacher-dark .area-tbl tbody { display: block; min-width: 0; }
  .teacher-dark .area-tbl thead tr { display: flex; gap: 4px; border-bottom: 1px solid var(--t-border); }
  .teacher-dark .area-tbl thead th { border-bottom: 0; padding: 10px 12px; }
  .teacher-dark .area-tbl thead th:nth-child(n + 3) { display: none; }
  .teacher-dark .area-tbl-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    border-bottom: 1px solid var(--t-border);
  }
  .teacher-dark .area-tbl tbody tr:last-child { border-bottom: 0; }
  .teacher-dark .area-tbl-row:hover { background: rgba(255, 255, 255, 0.025); }
  .teacher-dark .area-tbl-row &gt; td { border-bottom: 0; padding: 4px 12px; }
  .teacher-dark .area-tbl-row &gt; td:nth-child(-n + 2) { padding-top: 12px; }
  .teacher-dark .area-tbl-row &gt; td:nth-child(n + 4) { padding-bottom: 10px; align-self: center; }
  .teacher-dark .area-tbl-row &gt; td:nth-child(3) { grid-column: 1 / -1; }
  .teacher-dark .area-tbl-name { white-space: normal; }
  .teacher-dark .area-tbl-grade { text-align: right; color: var(--t-muted); font-size: 0.88rem; }
  .teacher-dark .area-expand-row:not([hidden]),
  .teacher-dark .area-expand-row &gt; td { display: block; }
  .teacher-dark .area-expand-row &gt; td { padding: 4px 10px 14px; }
  .teacher-dark .merge-ai-row &gt; * { flex: 1 1 100%; }
  .teacher-dark .merge-copy { justify-content: center; }
}

/* ---- Fokuserad kompositör (overlay) ------------------------------------- */
body.composer-open { overflow: hidden; }
.studio-composer-overlay {
  position: fixed;
  inset: 0;
  z-index: var(--z-modal);
  background: rgba(20, 30, 50, 0.5);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 24px 14px;
  overflow-y: auto;
  animation: cx-fade 0.14s ease;
}
.studio-composer {
  position: relative;
  background: #fff;
  border-radius: 20px;
  width: 100%;
  max-width: 760px;
  padding: 22px 24px 26px;
  box-shadow: 0 18px 50px rgba(20, 30, 50, 0.28);
  margin: auto 0;
}
.composer-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  padding-right: 32px;
}
.composer-icon { font-size: 2rem; }
.composer-title { margin: 0; font-size: 1.4rem; color: var(--text); }
.composer-sub { margin: 2px 0 0; color: var(--text-svag); font-size: 0.9rem; }
.composer-basics {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
/* Emoji-väljare för områdets symbol (issue #307) – spänner över båda kolumnerna */
.composer-emoji-field { grid-column: 1 / -1; }
.emoji-picker { display: flex; flex-direction: column; gap: 8px; }
.emoji-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
  gap: 6px;
}
.emoji-choice {
  border: 2px solid #e2ecfb;
  background: #fbfdff;
  border-radius: 10px;
  padding: 6px 0;
  font-size: 1.3rem;
  line-height: 1;
  cursor: pointer;
}
.emoji-choice:hover { border-color: var(--teal); }
.emoji-choice.active { background: var(--teal-ljus); border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal); }
.emoji-custom { align-items: center; gap: 8px; }
.emoji-preview {
  font-size: 1.6rem;
  line-height: 1;
  width: 44px;
  height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #f0f4fb;
  border-radius: 10px;
}
.emoji-input { max-width: 160px; }

/* Metod-växeln (guidat / material) – jämbördiga flikar */
.method-switch {
  display: flex;
  gap: 6px;
  background: #f0f4fb;
  border-radius: 12px;
  padding: 4px;
  margin: 16px 0;
}
.method-tab {
  flex: 1;
  border: none;
  background: transparent;
  font-family: var(--font);
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--text-svag);
  padding: 10px 8px;
  border-radius: 9px;
  cursor: pointer;
}
.method-tab.active {
  background: #fff;
  color: var(--teal-mork);
  box-shadow: 0 2px 6px rgba(20, 30, 50, 0.12);
}

/* Innehållstyp-växeln inne i &quot;guidat&quot; */
.ctype-switch { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.ctype-tab {
  border: 2px solid #e2ecfb;
  background: #fbfdff;
  font-family: var(--font);
  font-weight: 700;
  font-size: 0.9rem;
  color: var(--text);
  padding: 8px 12px;
  border-radius: 10px;
  cursor: pointer;
}
.ctype-tab.active { background: var(--teal-ljus); border-color: var(--teal); color: var(--teal-mork); }

.composer-callout {
  background: var(--teal-ljus);
  border-radius: 12px;
  padding: 12px 14px;
  margin-top: 12px;
}
.composer-callout .hint { color: var(--teal-mork); }

.composer-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 16px;
