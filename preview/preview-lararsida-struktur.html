<meta charset="utf-8">
<title>Ny lärarsida</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: toppmeny med 5 val + profilmeny, därunder en sida i taget. Medvetet mörkt tema som dagens lärarsida. */
:root{
  --bg:#0E1318; --panel:#171E26; --panel2:#1E2731; --line:#2A3542; --text:#E8EEF5; --svag:#A9B6C6; --dim:#7F8C9C;
  --gron:#2ECC71; --gron-m:#1F9D57; --gron-bg:rgba(46,204,113,.12); --gul:#F2C14E; --rod:#F07178; --bla:#5AA9FF;
  --display:"Baloo 2","Segoe UI Rounded",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gron);outline-offset:2px}
.demo{background:#26303B;color:var(--svag);font-size:13px;padding:8px max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo b{color:var(--text)}
.demo .seg{display:inline-flex;background:var(--bg);border-radius:999px;padding:3px}
.demo .seg button{border:0;background:none;padding:4px 12px;border-radius:999px;font-weight:700;font-size:13px;color:var(--svag)}
.demo .seg button[aria-pressed="true"]{background:var(--gron);color:#06240F}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(14,19,24,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:18px}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--gron-bg);border:1px solid var(--gron-m);display:flex;align-items:center;justify-content:center;font-style:normal;color:var(--gron)}
nav.huvud{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav.huvud button{border:1px solid transparent;background:none;padding:8px 14px;border-radius:12px;font-family:var(--display);font-weight:700;font-size:15.5px;color:var(--svag);display:flex;align-items:center;gap:8px}
nav.huvud button:hover{color:var(--text);background:var(--panel)}
nav.huvud button[aria-current="page"]{color:var(--text);background:var(--gron-bg);border-color:var(--gron-m)}
nav.huvud .badge{background:var(--gul);color:#2A1E00;border-radius:999px;font-family:var(--body);font-size:11.5px;font-weight:800;padding:0 7px;line-height:18px}
.profil{position:relative}
.profil>button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px 6px 6px;display:flex;align-items:center;gap:8px;font-weight:700}
.profil .ava{width:26px;height:26px;border-radius:50%;background:var(--gron-m);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff}
.meny{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:6px;min-width:220px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.meny button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:9px;font-weight:700}
.meny button:hover{background:var(--panel)}
.meny small{display:block;color:var(--dim);font-weight:600;padding:6px 12px 4px}
main{max-width:1240px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-weight:800;font-size:28px;margin:0;line-height:1.1}
h2{font-family:var(--display);font-weight:800;font-size:19px;margin:0}
.lead{color:var(--svag);margin:2px 0 0;max-width:70ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.rad{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);padding:9px 14px;border-radius:11px;font-weight:800;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--svag)}
.btn.prim{background:var(--gron);border-color:var(--gron);color:#06240F}
.btn.liten{padding:6px 10px;font-size:13.5px}
.btn.ghost{background:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.todo{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.todo .t{display:flex;align-items:center;gap:12px;background:var(--panel2);border-radius:12px;padding:11px 14px}
.todo .ik{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800}
.todo .txt{flex:1;min-width:0}
.todo .txt b{display:block}
.todo .txt span{color:var(--svag);font-size:13.5px}
.ik.gul{background:rgba(242,193,78,.15);color:var(--gul)} .ik.gron{background:var(--gron-bg);color:var(--gron)} .ik.bla{background:rgba(90,169,255,.14);color:var(--bla)}
.snabb{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.snabb button{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:3px}
.snabb button:hover{border-color:var(--gron-m)}
.snabb b{font-family:var(--display);font-size:16px}
.snabb span{color:var(--svag);font-size:13px}
.klasskort{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:8px}
.klasskort:hover{border-color:var(--gron-m)}
.klasskort .namn{font-family:var(--display);font-weight:800;font-size:22px;display:flex;justify-content:space-between;align-items:baseline}
.klasskort .namn small{font-family:var(--body);font-size:12.5px;color:var(--svag);font-weight:700}
.stapel{height:7px;border-radius:99px;background:var(--panel2);overflow:hidden}
.stapel i{display:block;height:100%;background:var(--gron);border-radius:99px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;background:var(--panel2);font-size:12.5px;font-weight:700;color:var(--svag)}
.chip.fokus{background:rgba(242,193,78,.14);color:var(--gul)}
.kom{border:1px dashed var(--gron-m);background:linear-gradient(160deg,rgba(46,204,113,.08),transparent)}
.kom ol{margin:10px 0 0;padding-left:0;list-style:none;display:grid;gap:8px}
.kom li{display:flex;gap:10px;align-items:center}
.kom .bock{width:22px;height:22px;border-radius:50%;border:2px solid var(--gron-m);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.kom .bock.klar{background:var(--gron);color:#06240F;border-color:var(--gron)}
.kom li.klar span{color:var(--dim);text-decoration:line-through}
.klassval{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.klassval button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 16px;font-family:var(--display);font-weight:800;font-size:17px}
.klassval button[aria-pressed="true"]{background:var(--gron-bg);border-color:var(--gron-m)}
.flikar{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.flikar button{border:0;background:none;padding:10px 14px;font-weight:800;color:var(--svag);border-bottom:3px solid transparent;margin-bottom:-1px}
.flikar button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--gron)}
.flikar button small{display:block;font-weight:600;font-size:11.5px;color:var(--dim)}
.tabellwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:640px}
td:nth-child(2){white-space:nowrap}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);background:var(--panel2);position:sticky;top:0}
td.namn,th.namn{position:sticky;left:0;background:var(--panel);font-weight:800}
th.namn{background:var(--panel2)}
.cell{display:inline-block;min-width:64px;padding:4px 8px;border-radius:8px;font-weight:800;text-align:center}
.legend{display:flex;gap:12px;align-items:center;color:var(--svag);font-size:13px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.sektion{display:flex;flex-direction:column;gap:10px}
.steg{display:flex;align-items:center;gap:10px}
.steg .nr{width:28px;height:28px;border-radius:50%;background:var(--gron-bg);color:var(--gron);font-weight:800;display:flex;align-items:center;justify-content:center;border:1px solid var(--gron-m)}
.amne{font-weight:800;color:var(--svag);font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.val{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.val label{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-weight:700;cursor:pointer}
.val label:has(input:checked){border-color:var(--gron-m);background:var(--gron-bg)}
.val input{width:18px;height:18px;accent-color:var(--gron)}
.val input.sw{width:42px;height:24px}
.val .em{width:22px;text-align:center}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel2);border-radius:11px;padding:10px 14px}
.toggle span small{display:block;color:var(--dim);font-weight:600;font-size:12.5px}
.sw{appearance:none;width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex-shrink:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw:checked{background:var(--gron)} .sw:checked::after{left:21px}
details{background:var(--panel2);border-radius:12px;padding:10px 14px}
details summary{cursor:pointer;font-weight:800}
.hjalp{display:flex;gap:10px;align-items:flex-start;background:rgba(90,169,255,.08);border:1px solid rgba(90,169,255,.3);border-radius:12px;padding:10px 14px;color:var(--svag);font-size:14px}
.hjalp b{color:var(--text)}
select,input[type=time],input[type=text]{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 10px;font:inherit;font-weight:700}
.tre{position:relative;display:inline-block}
.amnesflik{display:flex;gap:16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.amnesflik button{border:0;background:none;padding:8px 2px;font-weight:800;color:var(--svag);border-bottom:3px solid transparent;margin-bottom:-1px}
.amnesflik button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--gron)}
.tagg{display:inline-block;padding:1px 8px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:700;margin:2px 2px 2px 0;color:var(--svag)}
.liten-text{color:var(--dim);font-size:12.5px;font-weight:600}
.notis{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--gron);color:#06240F;font-weight:800;padding:10px 18px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
@media (max-width:700px){h1{font-size:24px}}
</style>

<div class="demo" role="note">
  <span><b>Förhandsvisning.</b> Exempeldata. Klicka runt som en ny lärare.</span>
  <span>Visa som:</span>
  <span class="seg"><button id="roll-ak" aria-pressed="true">Årskurslärare</button><button id="roll-ad" aria-pressed="false">Admin</button></span>
</div>

<header class="top">
  <div class="top-in">
    <span class="brand"><i>P</i>Pluggporten</span>
    <nav class="huvud" id="nav" aria-label="Lärarmeny"></nav>
    <div class="profil">
      <button id="profilknapp" aria-expanded="false" aria-haspopup="true"><span class="ava" id="ava">Å4</span><span id="kontonamn">Årskurs 4</span> ▾</button>
      <div class="meny" id="profilmeny" hidden>
        <small id="inloggad">Inloggad som Årskurs 4</small>
        <button data-g="hjalp">❔ Hjälp och guide</button>
        <button data-g="admin" id="meny-admin" hidden>⚙ Admin</button>
        <button data-g="logout">↪ Logga ut</button>
      </div>
    </div>
  </div>
</header>

<main id="sida"></main>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let roll = "ak", sida = "hem", klass = "4B", klassFlik = "hur", amne = "SO", modul = "plugga", matFlik = "plugga";
const AV = { ekvationsresan: 1, hittaratt: 1, schack: 1 };
const KLASSER_AK = ["4A", "4B", "4C", "4D"];
const KLASSER_AD = ["4A", "4B", "4C", "4D", "5A", "5B", "5D", "5E", "Studion", "Flex"];
const klasser = () => (roll === "ad" ? KLASSER_AD : KLASSER_AK);
const ELEVER = ["Ahlaam", "Bahja", "Cindy", "David", "Elias", "Elissa", "Elsa", "Harry", "Ines", "Jamal", "Kevin", "Lina"];
const OMR = ["Svensk historia", "Valet och demokrati", "Vasatiden", "Vikingarnas gudar", "Vikingatiden 2.0"];
const STJ = [[0,7,0,0,9],[0,7,0,0,4],[0,11,0,3,12],[0,0,0,3,0],[1,4,0,3,15],[0,3,0,3,8],[0,3,0,0,2],[0,13,0,3,18],[0,0,0,0,6],[2,9,4,6,21],[0,5,0,0,0],[0,8,0,3,10]];
const MAX = [3,24,12,18,27];

const NAV = [
  ["hem", "Hem", ""], ["klasser", "Mina klasser", ""], ["material", "Material", ""],
  ["prov", "Prov", "18"], ["live", "Live", ""],
];
function ritaNav() {
  const items = NAV.concat(roll === "ad" ? [["admin", "Admin", ""]] : []);
  $("#nav").innerHTML = items.map(([k, l, b]) =>
    `<button data-g="${k}" ${sida === k ? 'aria-current="page"' : ""}>${l}${b ? ` <span class="badge" title="${b} prov att rätta">${b}</span>` : ""}</button>`).join("");
  $("#meny-admin").hidden = roll !== "ad";
  $("#kontonamn").textContent = roll === "ad" ? "Elias (admin)" : "Årskurs 4";
  $("#ava").textContent = roll === "ad" ? "E" : "Å4";
  $("#inloggad").textContent = "Inloggad som " + (roll === "ad" ? "Elias (admin)" : "Årskurs 4");
}
function ga(k) {
  if (k === "logout") return notis("Här loggas man ut.");
  if (k === "hjalp") k = "hem";
  sida = k; $("#profilmeny").hidden = true; $("#profilknapp").setAttribute("aria-expanded", "false");
  ritaNav(); rita(); window.scrollTo(0, 0);
}
function notis(t) { const n = document.createElement("div"); n.className = "notis"; n.textContent = t; document.body.append(n); setTimeout(() => n.remove(), 2200); }

/* ---------- HEM ---------- */
function hem() {
  const kort = klasser().slice(0, roll === "ad" ? 10 : 4).map((k, i) => {
    const aktiva = [18, 17, 21, 12, 15, 9, 19, 11, 4, 3][i], tot = [23, 22, 23, 23, 20, 19, 21, 19, 5, 4][i];
    const fokus = k === "4A";
    return `<button class="klasskort" data-klass="${k}">
      <span class="namn">${k}<small>${tot} elever</small></span>
      <span class="liten-text">Övat den här veckan: <b style="color:var(--text)">${aktiva} av ${tot}</b></span>
      <span class="stapel"><i style="width:${Math.round(100 * aktiva / tot)}%"></i></span>
      <span class="rad" style="gap:6px">${fokus ? '<span class="chip fokus">🔒 Fokusläge till 10:40</span>' : ""}<span class="chip">Jobbar med: ${["Vikingatiden 2.0", "Vikingarnas gudar", "Skogen", "Energi"][i % 4]}</span></span>
    </button>`;
  }).join("");
  return `
  <div><h1>Hej ${roll === "ad" ? "Elias" : "Årskurs 4"}!</h1><p class="lead">Här ser du det som behöver göras och hur det går för dina klasser.</p></div>

  ${roll === "ak" ? `<section class="panel kom" aria-labelledby="kom">
    <div class="rad" style="justify-content:space-between"><h2 id="kom">Kom igång – 2 av 4 klart</h2><button class="btn ghost liten" onclick="this.closest('section').remove()">Dölj</button></div>
    <ol>
      <li class="klar"><span class="bock klar">✓</span><span>Logga in första gången</span></li>
      <li class="klar"><span class="bock klar">✓</span><span>Skriv ut inloggningskort till eleverna</span></li>
      <li><span class="bock"></span><span>Välj vilka områden din klass ska jobba med</span><button class="btn liten" data-klassflik="ser">Gör det nu</button></li>
      <li><span class="bock"></span><span>Testa ett prov eller en Live-match</span><button class="btn liten" data-g="prov">Visa hur</button></li>
    </ol>
  </section>` : ""}

  <div class="grid2">
    <section class="panel" aria-labelledby="att">
      <h2 id="att">Att göra</h2>
      <div class="todo">
        <div class="t"><span class="ik gul">✎</span><span class="txt"><b>18 prov att rätta</b><span>Vikingatiden – avstämning · 4B · inlämnat i fredags</span></span><button class="btn prim liten" data-g="prov">Rätta</button></div>
        <div class="t"><span class="ik gul">🔒</span><span class="txt"><b>Fokusläge är på i 4A</b><span>Låst till Vikingatiden 2.0 till 10:40</span></span><button class="btn liten" onclick="notis('Fokusläget i 4A är avstängt.')">Stäng av</button></div>
        <div class="t"><span class="ik bla">👤</span><span class="txt"><b>3 elever i 4B har inte loggat in på 2 veckor</b><span>David, Ines och Kevin</span></span><button class="btn liten" data-klass="4B" data-klassflik="elever">Visa</button></div>
      </div>
    </section>
    <section class="panel" aria-labelledby="sn">
      <h2 id="sn">Snabbval</h2>
      <div class="snabb">
        <button data-klassflik="ser"><b>Välj områden åt en klass</b><span>Bestäm vad eleverna ser i Plugga</span></button>
        <button data-g="material"><b>Skapa nytt område</b><span>Frågor, par och texter</span></button>
        <button data-g="prov"><b>Skapa ett prov</b><span>Blandade frågetyper</span></button>
        <button data-g="live"><b>Starta Live</b><span>Tävling i klassen eller mot en annan</span></button>
      </div>
    </section>
  </div>

  <section class="sektion" aria-labelledby="mk"><div class="rad" style="justify-content:space-between"><h2 id="mk">Mina klasser</h2>${roll === "ad" ? '<span class="liten-text">Testklasser är dolda · <button class="btn ghost liten">Visa alla</button></span>' : ""}</div>
    <div class="grid4">${kort}</div>
  </section>`;
}

/* ---------- MINA KLASSER ---------- */
const FLIKAR = [["hur", "Hur går det?", "Statistik"], ["ser", "Vad eleverna ser", "Områden och moduler"], ["fokus", "Fokusläge", "Lås till en sak"], ["elever", "Elever", "Inloggning och konton"]];
function klasserSida() {
  return `
  <div><h1>Mina klasser</h1><p class="lead">Välj klass. Allt om klassen finns i flikarna, och klassen du valt är kvar när du byter sida.</p></div>
  <div class="klassval" role="group" aria-label="Välj klass">${klasser().map((k) => `<button data-klass="${k}" aria-pressed="${k === klass}">${k}</button>`).join("")}</div>
  <div class="panel" style="display:flex;flex-direction:column;gap:16px">
    <div class="rad" style="justify-content:space-between"><h2 style="font-size:24px">${klass} <span class="liten-text">22 elever</span></h2></div>
    <div class="flikar" role="tablist">${FLIKAR.map(([k, l, s]) => `<button role="tab" data-klassflik="${k}" aria-selected="${klassFlik === k}">${l}<small>${s}</small></button>`).join("")}</div>
    <div>${({ hur, ser, fokus, elever })[klassFlik]()}</div>
  </div>`;
}
function farg(v, m) {
  if (!v) return `<span class="liten-text">–</span>`;
  const p = v / m, a = 0.15 + p * 0.7;
  return `<span class="cell" style="background:rgba(46,204,113,${a.toFixed(2)});color:${p > .55 ? "#06240F" : "var(--text)"}">${v}/${m}</span>`;
}
const MODULER = [["plugga","Plugga"],["lasresan","Läsresan"],["ekvationsresan","Ekvationsresan"],["brakresan","Bråkresan"],["hittaratt","Hitta rätt!"],["schack","Schack"],["prov","Prov"],["live","Live"]];
function hur() {

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-g],[data-klass],[data-klassflik],[data-amne],[data-modul],[data-matflik]");
  if (!b) return;
  if (b.dataset.amne) { amne = b.dataset.amne; return rita(); }
  if (b.dataset.modul) { modul = b.dataset.modul; return rita(); }
  if (b.dataset.matflik) { matFlik = b.dataset.matflik; return rita(); }
  if (b.dataset.klass) klass = b.dataset.klass;
  if (b.dataset.klassflik) klassFlik = b.dataset.klassflik;
  if (b.dataset.g) return ga(b.dataset.g);
  if (b.dataset.klass || b.dataset.klassflik) { sida = "klasser"; ritaNav(); rita(); if (!b.closest(".flikar") && !b.closest(".klassval")) window.scrollTo(0, 0); }
});

ritaNav(); rita();
