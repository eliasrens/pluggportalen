<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matchdagen 3D – skiss</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: lördagsmatch på tv – pigg, tydlig, uppmuntrande, aldrig stressig.
   IDEA: en tv-sänd match: planen ovanifrån, resultatskylten i hörnet, kommentatorns rad under.
   PICTURE: själva planen med två 7-mannalag som springer, bollen och målen.
   COLOUR and TYPE: kvällsarena – djup marin, gräsgrönt, kritvita linjer, skyltgult som accent. Barlow Condensed för skylt och rubriker, Nunito för text.
   LAYOUT: flikar överst, planen stor, frågekortet direkt under planen; tabell/trupp/statistik som egna flikar. */
:root{color-scheme:dark;--bg:#0c1626;--panel:#14223a;--panel2:#1b2d4b;--line:#2a3f63;--ink:#eef3fb;--svag:#a9b8d0;--gul:#ffd23f;--gron:#3ccf6e;--rod:#ff6b6b;--gras1:#2f8f45;--gras2:#2a8240}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Nunito",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gul);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:16px max(16px,4vw) 48px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.logo{font:800 30px/1 "Barlow Condensed",sans-serif;letter-spacing:.01em;display:flex;align-items:center;gap:10px}
.logo span{color:var(--gul)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav button{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 16px;font-weight:800;min-height:44px}
nav button[aria-pressed=true]{background:var(--gul);color:#1b1500;border-color:var(--gul)}
.kassa{font:700 18px "Barlow Condensed",sans-serif;color:var(--gul)}
.skylt{display:flex;align-items:stretch;gap:0;font:700 22px/1 "Barlow Condensed",sans-serif;border-radius:10px;overflow:hidden;width:max-content;max-width:100%;margin-bottom:10px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.skylt>div{padding:9px 14px;display:flex;align-items:center;gap:8px;background:#0a1220}
.skylt .res{background:var(--gul);color:#1b1500;font-size:26px;padding:7px 16px}
.skylt .tid{background:#1d3150;font-size:18px}
.chip{width:12px;height:22px;border-radius:3px;display:inline-block}
.plan{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.plan{max-width:min(100%,calc(60vh * 16 / 9));margin:0 auto;background:#0a1424}
#scen3d{aspect-ratio:16/9;width:100%}#scen3d canvas{display:block;width:100%!important;height:100%!important}
.plan svg{display:block;width:100%;height:auto}
.spelare{transition:transform .7s cubic-bezier(.45,.05,.3,1)}
#boll{transition:transform .55s cubic-bezier(.3,.1,.3,1)}
.utrop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font:800 clamp(44px,10vw,96px)/1 "Barlow Condensed",sans-serif;color:var(--gul);text-shadow:0 4px 0 #6b4f00,0 10px 30px rgba(0,0,0,.6);opacity:0;transform:scale(.6);transition:opacity .25s,transform .35s}
.utrop.visa{opacity:1;transform:scale(1)}
.kommentar{font:700 20px/1.3 "Barlow Condensed",sans-serif;margin:12px 2px 10px;min-height:26px;color:var(--ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.val{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.val button,.svar button{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;min-height:64px;display:flex;flex-direction:column;gap:2px;transition:transform .1s,border-color .1s}
.val button:hover,.svar button:hover{border-color:var(--gul)}
.val button:active,.svar button:active{transform:translateY(2px)}
.val b{font:800 21px/1.1 "Barlow Condensed",sans-serif}
.val small{color:var(--svag);font-weight:700}
.val button:disabled{opacity:.4;cursor:not-allowed}
.fraga{font-size:20px;font-weight:800;margin:6px 0 12px}
.amne{display:inline-block;font-size:13px;font-weight:800;color:#1b1500;background:var(--gul);border-radius:999px;padding:1px 10px}
.svar{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.svar button{font-size:18px;font-weight:800;justify-content:center}
.svar button.ratt{border-color:var(--gron);background:#173d2a}
.svar button.fel{border-color:var(--rod);background:#4a1d26}
.klocka{float:right;font:700 18px "Barlow Condensed",sans-serif;color:var(--gul)}
.stor{background:var(--gul);color:#1b1500;border:0;border-radius:14px;padding:14px 26px;font:800 22px "Barlow Condensed",sans-serif;min-height:52px}
.ghost{background:none;border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:800;min-height:44px}
h2{font:800 32px/1.05 "Barlow Condensed",sans-serif;margin:0 0 6px}
h3{font:800 22px/1.1 "Barlow Condensed",sans-serif;margin:14px 0 8px}
.svagt{color:var(--svag)}
.rad{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:nth-child(2),td:nth-child(2){text-align:left;white-space:normal}
th{font-size:13px;color:var(--svag)}
tr.vi td{background:#22385c;font-weight:800}
tr.upp td:first-child{box-shadow:inset 4px 0 0 var(--gron)} tr.ned td:first-child{box-shadow:inset 4px 0 0 var(--rod)}
.scroll{overflow-x:auto}
.kort{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.spkort{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.spkort b{font:800 20px "Barlow Condensed",sans-serif}
.stjarnor{color:var(--gul);letter-spacing:2px}
.namnfalt{background:#0a1220;border:1px solid var(--line);border-radius:8px;color:var(--ink);font:800 19px 'Barlow Condensed',sans-serif;padding:4px 8px;width:100%}
.stor-falt{font-size:26px;max-width:340px}
.farg{width:36px;height:36px;border-radius:50%;border:3px solid #0a1220;min-height:0;padding:0}.farg[aria-pressed=true]{outline:3px solid var(--gul)}
select{background:#0a1220;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:700 16px Nunito,sans-serif;min-height:44px}
.pos{font-size:12px;font-weight:800;background:#0a1220;border-radius:6px;padding:1px 7px;width:max-content}
.stapel{height:10px;background:#0a1220;border-radius:99px;overflow:hidden}.stapel i{display:block;height:100%;background:var(--gron)}
.siffror{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.siffror div{background:var(--panel2);border-radius:12px;padding:10px 12px}
.siffror b{display:block;font:800 30px/1 "Barlow Condensed",sans-serif;color:var(--gul)}
.overlag{position:fixed;inset:0;background:rgba(5,10,20,.75);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.overlag .panel{max-width:560px;width:100%}
label.check{display:inline-flex;gap:6px;align-items:center;background:var(--panel2);border-radius:10px;padding:6px 10px;font-weight:700}
.not{font-size:13px;color:var(--svag);margin-top:12px}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){.spelare,#boll,.utrop{transition:none}}
@media(max-width:600px){.kommentar{font-size:18px}.fraga{font-size:18px}th,td{padding:6px 5px;font-size:14px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="#fff" stroke="#0a1220" stroke-width="2"/><path d="M15 8l5 3.6-1.9 5.9h-6.2L10 11.6zM15 8V3M20 11.6l4.6-1.6M18.1 17.5l2.9 4M11.9 17.5l-2.9 4M10 11.6L5.4 10" fill="#0a1220" stroke="#0a1220" stroke-width="1.6" stroke-linejoin="round"/></svg>Match<span>dagen</span></div>
    <span class="kassa" id="kassa"></span>
    <nav aria-label="Meny">
      <button data-vy="match" aria-pressed="true">Match</button>
      <button data-vy="tabell" aria-pressed="false">Tabell</button>
      <button data-vy="trupp" aria-pressed="false">Truppen</button>
      <button data-vy="stat" aria-pressed="false">Statistik</button>
    </nav>
  </header>

  <section id="vy-match">
    <div class="skylt" aria-live="polite">
      <div><span class="chip" id="chip-vi"></span><span id="namn-vi"></span></div>
      <div class="res" id="res">0 – 0</div>
      <div><span id="namn-dem"></span><span class="chip" id="chip-dem"></span></div>
      <div class="tid" id="tid">0'</div>
    </div>
    <div class="plan">
      <div id="scen3d"></div>
      <svg viewBox="0 0 105 68" id="plan" role="img" aria-label="Fotbollsplanen">
        <defs><pattern id="rand" width="21" height="68" patternUnits="userSpaceOnUse"><rect width="10.5" height="68" fill="#2f8f45"/><rect x="10.5" width="10.5" height="68" fill="#2a8240"/></pattern></defs>
        <rect width="105" height="68" fill="url(#rand)"/>
        <g fill="none" stroke="#fff" stroke-width=".45" opacity=".9">
          <rect x="2" y="2" width="101" height="64"/><line x1="52.5" y1="2" x2="52.5" y2="66"/><circle cx="52.5" cy="34" r="8.5"/>
          <rect x="2" y="16" width="15" height="36"/><rect x="88" y="16" width="15" height="36"/><rect x="2" y="26" width="5" height="16"/><rect x="98" y="26" width="5" height="16"/>
        </g>
        <rect x="0" y="29.5" width="2" height="9" fill="#fff" opacity=".85"/><rect x="103" y="29.5" width="2" height="9" fill="#fff" opacity=".85"/>
        <g id="lag-dem"></g><g id="lag-vi"></g>
        <g id="boll"><circle r="1.1" fill="#fff" stroke="#111" stroke-width=".3"/></g>
      </svg>
      <div class="utrop" id="utrop"></div>
    </div>
    <div class="kommentar" id="kommentar" aria-live="polite"></div>
    <div class="panel" id="panel"></div>
  </section>

  <section id="vy-tabell" hidden></section>
  <section id="vy-trupp" hidden></section>
  <section id="vy-stat" hidden></section>
  <p class="not">Skiss. Lagen, spelarna och frågorna är påhittade exempel – i Pluggporten kommer frågorna från det område läraren väljer. Allt sparas bara i den här webbläsaren.</p>
</div>
<div class="overlag" id="overlag" hidden><div class="panel" id="overlag-in"></div></div>

<script>
{
const $ = (s) => document.querySelector(s);
const sleep = (ms) => new Promise((r) => setTimeout(r, matchMedia("(prefers-reduced-motion: reduce)").matches ? Math.min(ms, 250) : ms));
const slump = (a, b) => a + Math.random() * (b - a);
const valj = (a) => a[Math.floor(Math.random() * a.length)];
const blanda = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const kl = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- frågor (exempel) ---------- */
const BANK = [
  ["Svenska",1,"Vilket ord är ett substantiv?","katt","springa","snabb"],["Svenska",1,"Vad är motsatsen till varm?","kall","het","ljum"],
  ["Svenska",1,"Vilket ord är rätt stavat?","sjuk","schuk","chjuk"],["Svenska",2,"Vilket ord är ett verb?","hoppar","glad","bord"],
  ["Svenska",2,"Vilket tecken avslutar en fråga?","?",".","!"],["Svenska",2,"Vad är flera av ”mus”?","möss","musar","muser"],
  ["Svenska",3,"Vilket ord är ett adjektiv?","modig","modet","modigt springa"],["Svenska",3,"Vilken mening är rätt skriven?","Vi åkte till Göteborg i lördags.","vi åkte till göteborg i lördags.","Vi åkte till göteborg i Lördags."],
  ["Svenska",3,"Vad betyder ”enorm”?","jättestor","jättesnabb","jätteliten"],
  ["SO",1,"Vad heter Sveriges huvudstad?","Stockholm","Göteborg","Malmö"],["SO",1,"Vilken är Sveriges största sjö?","Vänern","Vättern","Mälaren"],
  ["SO",2,"Vilket land ligger väster om Sverige?","Norge","Finland","Estland"],["SO",2,"Vad kallades vikingarnas snabba krigsskepp?","Långskepp","Koggar","Galärer"],
  ["SO",2,"Vilken tro hade vikingarna innan kristendomen?","Asatro","Islam","Buddhism"],["SO",2,"Hur många landskap har Sverige?","25","21","30"],
  ["SO",3,"Vem leder Sveriges regering?","Statsministern","Kungen","Talmannen"],["SO",3,"Var sammanträder Sveriges riksdag?","Stockholm","Uppsala","Göteborg"],
  ["NO",1,"Vilket djur är ett däggdjur?","Val","Haj","Abborre"],["NO",1,"Vid hur många grader fryser vatten?","0 °C","10 °C","100 °C"],
  ["NO",1,"Vilket träd är ett barrträd?","Gran","Björk","Ek"],["NO",2,"Vad behöver växter för att tillverka näring?","Solljus","Mörker","Snö"],
  ["NO",2,"Vad heter gasen vi behöver andas in?","Syre","Koldioxid","Helium"],["NO",2,"Vad kallas det när vatten blir till vattenånga?","Avdunstning","Kondensation","Frysning"],
  ["NO",3,"Vilken planet ligger närmast solen?","Merkurius","Venus","Mars"],["NO",3,"Vad kallas stadiet mellan larv och fjäril?","Puppa","Ägg","Grodyngel"],
  ["Engelska",1,"Vad betyder ”dog”?","hund","katt","häst"],["Engelska",1,"Vad heter ”äpple” på engelska?","apple","orange","pear"],
  ["Engelska",2,"Vad betyder ”Thursday”?","torsdag","tisdag","lördag"],["Engelska",2,"I ___ ten years old.","am","is","are"],
  ["Engelska",2,"Vad betyder ”kitchen”?","kök","sovrum","kyrka"],["Engelska",3,"She ___ football every day.","plays","play","playing"],
  ["Engelska",3,"Vad heter ”barn” (flera) på engelska?","children","childs","childes"],
];
const AMNEN = ["Matte","Svenska","SO","NO","Engelska"];
function matte(niva) {
  let q, r;
  if (niva === 1) { const a = Math.floor(slump(3, 15)), b = Math.floor(slump(2, 10)); q = `${a} + ${b} = ?`; r = a + b; }
  else if (niva === 2) { const a = Math.floor(slump(2, 10)), b = Math.floor(slump(2, 10)); q = `${a} · ${b} = ?`; r = a * b; }
  else { const a = Math.floor(slump(11, 30)), b = Math.floor(slump(3, 9)); q = `${a} · ${b} = ?`; r = a * b; }
  const fel = new Set(); while (fel.size < 2) { const f = r + valj([-10, -2, -1, 1, 2, 10, 3, -3]); if (f > 0 && f !== r) fel.add(f); }
  return { amne: "Matte", q, ratt: String(r), alt: blanda([String(r), ...[...fel].map(String)]) };
}
const anvanda = new Set();
function nyFraga(niva) {
  const amnen = S.inst.amnen.length ? S.inst.amnen : AMNEN;
  const a = valj(amnen);
  if (a === "Matte") return matte(niva);
  let pool = BANK.filter((f) => f[0] === a && Math.abs(f[1] - niva) <= 1 && !anvanda.has(f[2]));
  if (!pool.length) { BANK.filter((f) => f[0] === a).forEach((f) => anvanda.delete(f[2])); pool = BANK.filter((f) => f[0] === a); }
  const f = valj(pool); anvanda.add(f[2]);
  return { amne: f[0], q: f[2], ratt: f[3], alt: blanda(f.slice(3)) };
}

/* ---------- lag, spelare, divisioner ---------- */
const DIV = ["Division 6", "Division 5", "Division 4", "Division 3", "Division 2", "Division 1", "Elitligan", "Superligan"];
const TOPP = DIV.length - 1;
const LAGANTAL = [6, 6, 8, 8, 10, 10, 12, 12];
const DUBBEL = (div) => div >= 3;   // från Division 3: skott kräver två rätt i rad
const styrkaFor = (div) => kl(0.2 + div * 0.09 + slump(-0.05, 0.05), 0.12, 0.92);
const LAGNAMN = ["Ekebacka IF","FC Stjärnbo","Sjöviks BK","Granåsens IK","Björkhagen United","Hälleberga FF","Tallmo SK","Norrbäcks AIK","Älvdalens BoIS","Kvarnby FC","Lindö GoIF","Stenbrottets IF","Västerängs FK","Ugglans BK","Mossbo United","Sandvikens Lejon"];
const FARGER = ["#e8473f","#f59f1a","#8e5cf7","#e84a9a","#11a3a3","#f2f2f2","#7a8899","#c0392b","#2ecc71","#d35400","#9b59b6","#16a085"];
const FNAMN = ["Alvin","Selma","Omar","Wilma","Leo","Nora","Elias","Alva","Hugo","Juni","Sami","Ines","Liam","Maja","Noah","Saga","Adam","Ebba","Theo","Lova"];
const ENAMN = ["Berg","Ek","Lind","Ström","Holm","Sund","Dahl","Falk","Nyberg","Ahmadi","Kaya","Nilsson","Virtanen","Hassan","Lund","Kovač"];
const POS = { MV: "Målvakt", FÖR: "Försvar", MIT: "Mittfält", ANF: "Anfall" };
const nySpelare = (pos, st) => ({ id: Math.random().toString(36).slice(2, 8), namn: valj(FNAMN) + " " + valj(ENAMN), pos, st });
const pris = (st) => Math.round(150 * st ** 1.9 / 10) * 10;

function nyLiga(div) {
  const n = LAGANTAL[div], namn = blanda(LAGNAMN).slice(0, n - 1), farg = blanda(FARGER.concat(FARGER));
  const lag = [{ id: 0, namn: S.lagnamn, farg: S.farg, vi: true }].concat(namn.map((n, i) => ({ id: i + 1, namn: n, farg: farg[i], styrka: styrkaFor(div) })));
  const ids = lag.map((l) => l.id), schema = [];
  for (let r = 0; r < n - 1; r++) { const par = []; for (let i = 0; i < n / 2; i++) par.push([ids[i], ids[n - 1 - i]]); schema.push(par); ids.splice(1, 0, ids.pop()); }
  const tabell = {}; lag.forEach((l) => (tabell[l.id] = { s: 0, v: 0, o: 0, f: 0, gm: 0, im: 0 }));
  return { lag, schema, tabell, omg: 0 };
}
const STANDARD = () => ({ lagnamn: "Pluggporten FC", farg: "#2f6fe8", div: 0, sasong: 1, kassa: 600,
  trupp: [["MV",2],["FÖR",2],["FÖR",2],["MIT",2],["MIT",2],["ANF",2],["ANF",2]].map(([p, s]) => ({ ...nySpelare(p, s), egen: true, xp: 0 })),
  marknad: [], matcher: [], sasonger: [], pokaler: [], inst: { amnen: [], klocka: false }, liga: null });
let S;
try { S = JSON.parse(localStorage.getItem("matchdagen-v2")); } catch { S = null; }
if (!S) { S = STANDARD(); S.liga = nyLiga(0); nyMarknad(); }
const spara = () => { try { localStorage.setItem("matchdagen-v2", JSON.stringify(S)); } catch {} };
function nyMarknad() { const d = S.div; S.marknad = Array.from({ length: 6 }, () => nySpelare(valj(["MV","FÖR","MIT","ANF"]), kl(Math.round(slump(2, 3.2 + d * 0.3)), 2, 5))); }
const snitt = (pos) => { const p = S.trupp.filter((x) => x.pos === pos); return p.reduce((a, x) => a + x.st, 0) / p.length; };
const bonus = (pos) => (snitt(pos) - 2) * 0.05;
const lagNamn = (id) => S.liga.lag.find((l) => l.id === id);
const kort = (n) => n.split(" ").map((w) => w[0]).join("").slice(0, 3).toUpperCase();

/* ---------- planen ---------- */
const FORM = [[5,34],[22,20],[22,48],[38,26],[38,42],[50,22],[50,46]];
function ritaLag(id, farg, nummer) {
  if (typeof T3 !== "undefined" && T3) T3.lag(id === "#lag-vi" ? "vi" : "dem", farg);
  $(id).innerHTML = FORM.map((_, i) => `<g class="spelare" data-i="${i}"><circle r="2.1" fill="${i ? farg : "#ffd23f"}" stroke="#0a1220" stroke-width=".45"/><text y=".9" text-anchor="middle" font-size="2.4" font-weight="800" fill="${i ? "#fff" : "#1b1500"}" font-family="Nunito">${nummer[i]}</text></g>`).join("");
}
let boll = { x: 52.5, y: 34 };
let hojd = 0.4;
function placera(m) {
  const bx = 2 + m.x * 1.01, by = boll.y;
  const fram = (m.x - 50) * 0.55;
  const raknaUt = (spegel, anfall) => {
    const pos = FORM.map(([x, y], i) => {
      if (i) { x = x + (spegel ? -fram : fram) + (anfall ? 8 : -4); y = y + (by - 34) * 0.35 + Math.sin(Date.now() / 900 + i) * 1.5; }
      else y = 34 + (by - 34) * 0.22;
      if (spegel) x = 105 - x;
      return [kl(x, 3, 102), kl(y, 3, 65)];
    });
    let n = 1, nd = 1e9;
    pos.forEach(([x, y], i) => { const d = (x - bx) ** 2 + (y - by) ** 2; if (i && d < nd) { nd = d; n = i; } });
    if (bx > 6 && bx < 99) pos[n] = anfall ? [bx + (spegel ? 1.2 : -1.2), by] : [bx + (spegel ? -3.5 : 3.5), by + 1.5];
    return pos;
  };

const tot = () => Object.values(S.stat || {}).reduce((a, v) => ({ r: a.r + v.r, t: a.t + v.t }), { r: 0, t: 0 });
function paus(rubrik, text, knapp) {
  return new Promise((klar) => { $("#overlag-in").innerHTML = `<h2>${rubrik}</h2><p>${text}</p><button class="stor" id="vidare">${knapp}</button>`; $("#overlag").hidden = false; $("#vidare").focus(); $("#vidare").onclick = () => { $("#overlag").hidden = true; klar(); }; });
}
function registrera(a, b, ga, gb) {
  const t = S.liga.tabell; t[a].s++; t[b].s++; t[a].gm += ga; t[a].im += gb; t[b].gm += gb; t[b].im += ga;
  if (ga > gb) { t[a].v++; t[b].f++; } else if (ga < gb) { t[b].v++; t[a].f++; } else { t[a].o++; t[b].o++; }
}
const simMal = (s, mot) => { let g = 0; for (let i = 0; i < 6; i++) if (Math.random() < 0.12 + s * 0.25 - mot * 0.12) g++; return g; };
function avsluta(m) {
  if (m.kval) return kvalSlut(m);
  const omg = S.liga.schema[S.liga.omg];
  for (const [a, b] of omg) {
    if (a === 0 || b === 0) { const oss = a === 0; registrera(a, b, oss ? m.oss : m.dem, oss ? m.dem : m.oss); continue; }
    const la = lagNamn(a), lb = lagNamn(b); registrera(a, b, simMal(la.styrka, lb.styrka), simMal(lb.styrka, la.styrka));
  }
  const r = tot(), ratt = r.r - m.r0.r, alla = r.t - m.r0.t;
  const pengar = (m.oss > m.dem ? 300 : m.oss === m.dem ? 150 : 80) + ratt * 15 + m.oss * 25;
  S.kassa += pengar;
  S.matcher.unshift({ sasong: S.sasong, div: S.div, mot: m.mot.namn, oss: m.oss, dem: m.dem, ratt, alla, skott: m.st.skott, passOk: m.st.passOk, pass: m.st.pass, datum: new Date().toLocaleDateString("sv-SE") });
  S.liga.omg++; nyMarknad(); spara();
  const res = m.oss > m.dem ? "Seger!" : m.oss === m.dem ? "Oavgjort" : "Förlust – nästa gång!";
  $("#overlag-in").innerHTML = `<h2>${res} ${m.oss} – ${m.dem}</h2><p class="svagt">mot ${m.mot.namn}</p>
    <div class="siffror"><div><b>${ratt}/${alla}</b>rätt svar</div><div><b>${m.st.skott}</b>skott</div><div><b>${m.st.passOk}/${m.st.pass}</b>lyckade pass</div><div><b>+${pengar}</b>till klubbkassan</div></div>
    <p></p><button class="stor" id="vidare">${S.liga.omg >= S.liga.schema.length ? "Se hur säsongen slutade" : "Till tabellen"}</button>`;
  $("#overlag").hidden = false;
  $("#vidare").onclick = () => { $("#overlag").hidden = true; if (S.liga.omg >= S.liga.schema.length) sasongSlut(); else visa("tabell"); };
}
function sorterad() {
  const t = S.liga.tabell;
  return S.liga.lag.map((l) => ({ ...l, ...t[l.id], p: t[l.id].v * 3 + t[l.id].o })).sort((a, b) => b.p - a.p || (b.gm - b.im) - (a.gm - a.im) || b.gm - a.gm);
}
function sasongSlut() {
  const plac = sorterad().findIndex((l) => l.vi) + 1;
  S.sasonger.unshift({ sasong: S.sasong, div: DIV[S.div], plac });
  if (plac === 1) {
    S.pokaler.push(`Vinnare ${DIV[S.div]} (säsong ${S.sasong})`);
    if (S.div < TOPP) {
      S.kval = { namn: valj(LAGNAMN.filter((n) => !S.liga.lag.some((l) => l.namn === n))), farg: valj(FARGER), styrka: styrkaFor(S.div + 1) };
      spara();
      return paus("Ligavinnare!", `Ni vann ${DIV[S.div]}! Nu väntar en kvalmatch mot ${S.kval.namn} från ${DIV[S.div + 1]}. Vinner ni går ni upp. Blir det oavgjort avgörs det på straffar.`, "Till kvalmatchen").then(() => visa("match"));
    }
    return nySasong(`Ni vann ${DIV[S.div]} – den högsta ligan! Ni är bäst av alla.`, "Mästare!");
  }
  let text = `Ni slutade på plats ${plac} av ${S.liga.lag.length} i ${DIV[S.div]}.`;
  text += ` Vinn ligan nästa säsong för att få kvala upp!`;
  nySasong(text, "Säsongen är slut");
}
function nySasong(text, rubrik) {
  S.kval = null; S.sasong++; S.liga = nyLiga(S.div); nyMarknad(); spara();
  paus(rubrik, text, "Starta nästa säsong").then(() => visa("match"));
}
function kvalSlut(m) {
  const vann = m.oss > m.dem || (m.straff && m.straff[0] > m.straff[1]);
  const r = tot(); S.kassa += vann ? 600 : 150;
  S.matcher.unshift({ sasong: S.sasong, div: S.div, mot: m.mot.namn + " (kval)", oss: m.oss, dem: m.dem, ratt: r.r - m.r0.r, alla: r.t - m.r0.t, skott: m.st.skott, passOk: m.st.passOk, pass: m.st.pass });
  const res = `${m.oss} – ${m.dem}${m.straff ? ` (straffar ${m.straff[0]} – ${m.straff[1]})` : ""}`;
  if (vann) { S.div++; S.pokaler.push(`Kvalade upp till ${DIV[S.div]} (säsong ${S.sasong})`); nySasong(`Kvalet slutade ${res}. Ni går upp till ${DIV[S.div]}! Motståndet blir tuffare – köp förstärkningar och träna grundpelarna.`, "Uppflyttning!"); }
  else nySasong(`Kvalet slutade ${res}. Ni stannar i ${DIV[S.div]} och får en ny chans nästa säsong.`, "Nära!");
}

/* ---------- vyerna ---------- */
function matchStart() {
  S.liga.lag[0].namn = S.lagnamn; S.liga.lag[0].farg = S.farg;
  const mot = nastaMot();
  ritaLag("#lag-vi", S.farg, [1, 2, 3, 6, 8, 9, 10]); ritaLag("#lag-dem", mot.farg, [1, 4, 5, 7, 11, 14, 19]);
  $("#chip-vi").style.background = S.farg; $("#chip-dem").style.background = mot.farg;
  $("#namn-vi").textContent = kort(S.lagnamn); $("#namn-dem").textContent = kort(mot.namn); $("#res").textContent = "0 – 0"; $("#tid").textContent = "0'";
  boll = { x: 52.5, y: 34 }; placera({ x: 50, boll: "oss" });
  sag(S.kval ? `KVAL till ${DIV[S.div + 1]} · ${mot.namn} är ett lag från divisionen ovanför` : `Säsong ${S.sasong} · ${DIV[S.div]} · Omgång ${S.liga.omg + 1} av ${S.liga.schema.length}`);
  $("#panel").innerHTML = `<h2>${S.lagnamn} – ${mot.namn}</h2>
    <p class="svagt">Varje drag ger en fråga. Svarar du rätt lyckas passet eller skottet oftare – men även snygga skott kan räddas, och långskott går sällan in.</p>
    <div class="rad" style="margin:10px 0 14px">${AMNEN.map((a) => `<label class="check"><input type="checkbox" value="${a}" ${!S.inst.amnen.length || S.inst.amnen.includes(a) ? "checked" : ""}>${a}</label>`).join("")}
    <label class="check"><input type="checkbox" id="klocka" ${S.inst.klocka ? "checked" : ""}>Klocka på frågorna</label></div>
    <button class="stor" id="avspark">Avspark!</button>`;
  $("#avspark").onclick = () => {
    const v = [...document.querySelectorAll("#panel input[value]:checked")].map((i) => i.value);
    S.inst.amnen = v.length === AMNEN.length ? [] : v; S.inst.klocka = $("#klocka").checked; spara(); spelaMatch();
  };
}
function tabell() {
  const rader = sorterad();
  $("#vy-tabell").innerHTML = `<div class="panel"><h2>${DIV[S.div]} – säsong ${S.sasong}</h2><p class="svagt">Stegen: ${DIV.map((d, i) => i === S.div ? `<b style="color:var(--gul)">${d}</b>` : d).join(" → ")}</p><p class="svagt">Omgång ${S.liga.omg} av ${S.liga.schema.length} spelad · ${S.liga.lag.length} lag. Ettan får kvala upp. Man kan bara gå uppåt – ju högre upp, desto fler lag att slå och tuffare motstånd.${DUBBEL(S.div) ? ' Här krävs två rätt i rad för ett riktigt bra skott.' : ''}</p>
    <div class="scroll"><table><thead><tr><th>#</th><th>Lag</th><th>S</th><th>V</th><th>O</th><th>F</th><th>Mål</th><th>+/−</th><th>P</th></tr></thead><tbody>
    ${rader.map((l, i) => `<tr class="${l.vi ? "vi" : ""} ${i === 0 && S.div < TOPP ? "upp" : ""}"><td>${i + 1}</td><td><span class="chip" style="background:${l.farg};height:14px;width:8px;vertical-align:-1px"></span> ${l.namn}</td><td>${l.s}</td><td>${l.v}</td><td>${l.o}</td><td>${l.f}</td><td>${l.gm}–${l.im}</td><td>${l.gm - l.im}</td><td><b>${l.p}</b></td></tr>`).join("")}
    </tbody></table></div><p></p><button class="stor" data-vy="match">Nästa match</button></div>`;
}
const LAGFARGER = ["#2f6fe8", "#e8473f", "#2ecc71", "#f59f1a", "#8e5cf7", "#11a3a3", "#e84a9a", "#f2f2f2"];
const lagerNyckel = () => `${S.sasong}-${S.liga.omg}-${S.kval ? 'k' : ''}`;
function trupp() {
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const kortHtml = (p, kop) => `<div class="spkort"><span class="pos">${POS[p.pos]}${p.egen ? " · grundpelare" : ""}</span>
    <b>${esc(p.namn)}</b>
    <span class="stjarnor">${"★".repeat(p.st)}${"☆".repeat(5 - p.st)}</span>
    ${kop ? `<button class="ghost" data-kop="${p.id}" ${S.kassa < pris(p.st) ? "disabled" : ""}>Köp för ${pris(p.st)} kr</button>`
      : p.st < 5 ? `<div class="stapel" title="Träning mot nästa stjärna"><i style="width:${p.xp || 0}%;background:var(--gul)"></i></div><small class="svagt">${p.xp || 0}/100 träning</small>` : `<small class="svagt">Fullt tränad</small>`}</div>`;
  const lagerKlart = S.lagerOmg === lagerNyckel();
  $("#vy-trupp").innerHTML = `<div class="panel">
    <h2>Ditt lag</h2>
    <div class="rad"><input id="lagnamn" class="namnfalt stor-falt" value="${esc(S.lagnamn)}" maxlength="24" aria-label="Lagets namn">
      <div class="rad" role="group" aria-label="Lagets färg">${LAGFARGER.map((f) => `<button class="farg" data-farg="${f}" style="background:${f}" aria-label="Färg ${f}" aria-pressed="${S.farg === f}"></button>`).join("")}</div></div>
    <p class="svagt">Klubbkassa: <b style="color:var(--gul)">${S.kassa} kr</b>. Bättre spelare ger bättre chans: anfallare gör fler mål, mittfältare passar säkrare, försvarare vinner fler tacklingar och målvakten räddar mer. Rätt svar avgör ändå mest.</p>
    <h3>Träningsläger</h3>
    <div class="panel" style="background:var(--panel2)" id="lager">
      ${lagerKlart ? `<p class="svagt" style="margin:0">Laget har tränat den här omgången. Spela nästa match, så får ni ett nytt träningsläger.</p>`
        : `<p style="margin:0 0 10px">Välj en spelare och svara på 8 frågor. Varje rätt svar ger spelaren 12 träningspoäng – vid 100 får hen en stjärna till. Ett läger per omgång.</p>
        <div class="rad"><select id="lagerspelare" aria-label="Spelare att träna">${S.trupp.filter((p) => p.st < 5).map((p) => `<option value="${p.id}">${esc(p.namn)} (${POS[p.pos]}, ${p.st}★)</option>`).join("")}</select>
        <button class="stor" id="startalager">Starta träningen</button></div>`}
    </div>
    <h3>Startelvan (7-manna)</h3><div class="kort">${S.trupp.map((p) => kortHtml(p)).join("")}</div>
    <h3>Spelare till salu</h3><p class="svagt">Köper du en spelare ersätter hen den sämsta på samma position, som säljs för halva priset. Nya spelare efter varje match.</p>
    <div class="kort">${S.marknad.map((p) => kortHtml(p, true)).join("")}</div></div>`;
  document.querySelectorAll("[data-kop]").forEach((b) => b.onclick = () => {
    const ny = S.marknad.find((p) => p.id === b.dataset.kop), samma = S.trupp.filter((p) => p.pos === ny.pos).sort((a, c) => a.st - c.st)[0];
    S.kassa -= pris(ny.st) - Math.round(pris(samma.st) / 2); S.trupp[S.trupp.indexOf(samma)] = { ...ny, xp: 0 }; S.marknad = S.marknad.filter((p) => p !== ny); spara(); visa("trupp");
  });
  $("#lagnamn").onchange = () => { S.lagnamn = $("#lagnamn").value.trim() || S.lagnamn; S.liga.lag[0].namn = S.lagnamn; spara(); };
  document.querySelectorAll("[data-farg]").forEach((b) => b.onclick = () => { S.farg = b.dataset.farg; S.liga.lag[0].farg = S.farg; spara(); visa("trupp"); });
  if ($("#startalager")) $("#startalager").onclick = () => traning(S.trupp.find((p) => p.id === $("#lagerspelare").value));
}
async function traning(sp) {
  S.lagerOmg = lagerNyckel(); spara();
  const box = $("#lager"); let ratt = 0;
  for (let i = 1; i <= 8; i++) {
    box.innerHTML = `<p style="margin:0 0 8px"><b>${sp.namn}</b> tränar · fråga ${i} av 8 · <span style="color:var(--gul)">${sp.xp}/100</span></p><div id="lagerfraga"></div>`;
    const r = await stall(valj([1, 2, 2, 3]), $("#lagerfraga"));
    if (r) { ratt++; sp.xp = (sp.xp || 0) + 12; if (sp.xp >= 100 && sp.st < 5) { sp.st++; sp.xp -= 100; box.insertAdjacentHTML("afterbegin", `<p style="color:var(--gul);font-weight:800">${sp.namn} fick en stjärna till!</p>`); await sleep(1200); } }
    spara();
  }
  box.innerHTML = `<p style="margin:0"><b>Träningen är klar!</b> ${ratt} av 8 rätt. ${sp.namn} har nu ${sp.st}★ och ${sp.xp}/100 träningspoäng.</p>`;
  setTimeout(() => visa("trupp"), 2200);
}
function stat() {
  const m = S.matcher, v = m.filter((x) => x.oss > x.dem).length, o = m.filter((x) => x.oss === x.dem).length, r = tot();
  $("#vy-stat").innerHTML = `<div class="panel"><h2>Statistik</h2>
    <div class="siffror"><div><b>${m.length}</b>matcher</div><div><b>${v}–${o}–${m.length - v - o}</b>vinst–oavgj–förl</div><div><b>${m.reduce((a, x) => a + x.oss, 0)}</b>gjorda mål</div><div><b>${r.t ? Math.round(100 * r.r / r.t) : 0} %</b>rätt svar</div></div>
    <h3>Rätt per ämne</h3>${Object.entries(S.stat || {}).map(([a, s]) => `<div class="rad" style="margin:6px 0"><span style="width:80px">${a}</span><div class="stapel" style="flex:1"><i style="width:${Math.round(100 * s.r / s.t)}%"></i></div><span style="width:90px;text-align:right">${s.r}/${s.t}</span></div>`).join("") || "<p class='svagt'>Inga frågor än.</p>"}
    <h3>Pokalskåpet</h3><p>${S.pokaler.length ? S.pokaler.map((p) => `🏆 ${p}`).join("<br>") : "<span class='svagt'>Vinn en division för din första pokal.</span>"}</p>
    <h3>Senaste matcherna</h3><div class="scroll"><table><thead><tr><th>Säsong</th><th>Motståndare</th><th>Resultat</th><th>Rätt</th><th>Skott</th></tr></thead><tbody>
    ${m.slice(0, 15).map((x) => `<tr><td>${x.sasong}</td><td>${x.mot}</td><td>${x.oss}–${x.dem}</td><td>${x.ratt}/${x.alla}</td><td>${x.skott}</td></tr>`).join("") || "<tr><td></td><td class='svagt'>Inga matcher än</td></tr>"}
    </tbody></table></div><p></p><button class="ghost" id="nollstall">Börja om från början</button></div>`;
  $("#nollstall").onclick = () => { S = STANDARD(); S.liga = nyLiga(0); nyMarknad(); spara(); visa("match"); };
}
let spelar = false;
function visa(vy) {
  if (M && M.min < 90 && vy !== "match") { /* matchen fortsätter i bakgrunden pausad på frågan */ }
  ["match", "tabell", "trupp", "stat"].forEach((v) => ($("#vy-" + v).hidden = v !== vy));
  document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.vy === vy));
  $("#kassa").textContent = `${S.kassa} kr i kassan`;
  if (vy === "tabell") tabell(); if (vy === "trupp") trupp(); if (vy === "stat") stat();
  if (vy === "match" && (!M || M.min >= 90)) { M = null; matchStart(); }
}
document.addEventListener("click", (e) => { const b = e.target.closest("[data-vy]"); if (b) visa(b.dataset.vy); });
visa("match");
}
</script>
