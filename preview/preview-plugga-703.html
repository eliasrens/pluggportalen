<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Områdessidan #703 – testrigg (riktig ui.js + styles.css)</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../src/styles.css" />
    <!-- Testrigg för issue #703: den RIKTIGA pageElevOmrade (src/gamemodes.js)
         + renderTopbar i index.html-layouten. Bara datakällorna stubbas
         (plugga-703/*, sidomeny-701/*). Området väljs i hashen; parametrar ?dolt=quiz,
         ?tre=1 (senaste läget har 3 ★), ?ny=1 (inget spelat) samt
         sidomenyns (#701) parametrar. -->
    <script type="importmap">
      { "imports": {
        "../src/data.js": "./plugga-703/data.js",
        "../src/auth.js": "./plugga-702/auth.js",
        "../src/data-xp.js": "./kategori-stubs/data-xp.js",
        "../src/fx.js": "./kategori-stubs/fx.js",
        "../src/firebase-config.js": "./kategori-stubs/firebase-config.js",
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js": "./kategori-stubs/firestore.js",
        "../src/live/live-watch.js": "./sidomeny-701/live-watch.js",
        "../src/tavling/mm-watch.js": "./sidomeny-701/mm-watch.js",
        "../src/class-lock-watch.js": "./sidomeny-701/class-lock-watch.js"
      } }
    </script>
  </head>
  <body>
    <button class="hamburger" id="hamburger" aria-label="Öppna meny" aria-expanded="false" aria-controls="sidebar" hidden>
      <span aria-hidden="true">☰</span>
    </button>
    <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>
    <div class="layout">
      <aside class="sidebar" id="sidebar" aria-label="Sidomeny">
        <button class="brand" id="brand"><span class="brand-text">Pluggporten</span></button>
        <div id="sidebar-body" class="sidebar-body"></div>
      </aside>
      <main id="app" class="container"></main>
    </div>
    <script type="module">
      import { pageElevOmrade } from "../src/gamemodes.js";
      import { pageElevPlugga } from "../src/pages-elev.js";
      const visa = () => (location.hash.startsWith("#/elev/omrade") ? pageElevOmrade() : pageElevPlugga());
      if (!location.hash) location.hash = "#/elev/omrade?subj=so&area=vikingatiden";
      window.addEventListener("hashchange", visa);
      visa();
    </script>
  </body>
</html>
