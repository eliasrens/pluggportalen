<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vinter i världen – förhandsvisning (#908)</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/styles.css" />
    <script type="importmap">{ "imports": { "/src/season.js": "/preview/vinter-908/season.js" } }</script>
    <style>
      body { margin: 0; background: #0b0f14; color: #cfd8e3; font: 600 0.85rem system-ui, sans-serif; }
      .pv-ctrl { padding: 6px 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
      .pv-ctrl a { color: #cfd8e3; padding: 3px 10px; border: 1px solid #39465a; border-radius: 999px; text-decoration: none; }
      .pv-ctrl a[aria-current] { background: #2f8f5b; border-color: #2f8f5b; color: #fff; }
      body.ren .pv-ctrl { display: none; }
      /* En scen = exakt som husvärldens stage (1366×768 → 1062×618 i appen;
         ?w=&h= styr). Port/spärr = hela fönstret. */
      .pv-scen.varld-stage { position: relative; margin: 0 auto; overflow: hidden; border-radius: 0; box-shadow: none; }
      .pv-scen > .varld-lager { position: absolute; inset: 0; width: 100% !important; height: 100% !important;
        margin: 0 !important; transform: none !important; }
      .pv-scen > .varld-lager > svg { width: 100%; height: 100%; display: block; overflow: visible; }
      .pv-matris { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; padding: 10px; }
      .pv-ruta { background: var(--sz-hill, #a8da8f); border-radius: 10px; padding: 6px; text-align: center; color: #3b3350; }
      .pv-ruta svg { width: 100%; height: 170px; display: block; overflow: visible; }
      .pv-fonster { display: flex; gap: 16px; padding: 16px; flex-wrap: wrap; }
      .pv-fonster svg.room-window { width: 420px; height: auto; display: block; }
    </style>
  </head>
  <body>
    <div class="pv-ctrl" id="pv-ctrl"></div>
    <div id="pv-yta"></div>
    <script type="module" src="./vinter-908/main.js"></script>
  </body>
</html>
